async function saveScores(){
 if(state.loading)return;

 const btn=document.getElementById('saveExam'),msg=document.getElementById('examMsg');
 if(btn)btn.disabled=true;
 if(msg)msg.innerHTML='<p class="muted">Menyimpan nilai...</p>';
 const items=[];
 for(const el of document.querySelectorAll('.material')){
   const status=String(el.dataset.scoreStatus||'').toUpperCase();
   // Nilai FINAL/LOCKED sudah tersimpan. Tampilkan, tetapi jangan kirim ulang.
   if(window.bkfIsFinishedScore(status))continue;
   const final=el.querySelector('.final-score'),id=final?.dataset.material,s=Number(final?.value);
   if(!id||!Number.isFinite(s)||s<0||s>100)return failSave('Semua nilai yang belum selesai harus diisi 0–100.');
   const comps=[...el.querySelectorAll('.comp')].map(x=>({component_code:x.dataset.code,score:Number(x.value)}));
   if(comps.length&&(comps.length!==2||comps.some(c=>!Number.isFinite(c.score)||c.score<0||c.score>100)))return failSave('Gerakan dan Bacaan Sholat wajib diisi 0–100.');

 }
 if(!items.length){
   state.loading=false;
   if(btn)btn.disabled=true;
   if(msg)msg.innerHTML='<p class="success">Semua materi peserta ini sudah tersimpan. Tidak ada nilai baru yang perlu disimpan.</p>';
   return;
 }
 const {data,error}=await sb.rpc('save_examiner_scores',{p_exam_session_id:state.participant.exam_session_id,p_scores:items});

function compressPhoto(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),w=480,h=Math.round(w*4/3);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const scale=Math.max(w/im.width,h/im.height),nw=im.width*scale,nh=im.height*scale;ctx.drawImage(im,(w-nw)/2,(h-nh)/2,nw,nh);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)}

ror){await sb.from('bills').delete().eq('id',id);return window.bkAlert(friendlyError(q.error))}bill2.remove();financeTab2('bills')}}
async function showPayments(){

  if(!roles.some(r=>['KETUA','BENDAHARA'].includes(r))){
    return toast('Akses Pembayaran tidak diberikan untuk akun ini.','error');
  }

  </div>

    <div id="payBillInfo" class="notice" style="display:none;margin:8px 0 12px"></div>
    <div class="field"><label>Nominal Pembayaran *</label><input name="amount" id="payAmount" type="number" min="1" step="1" required inputmode="numeric" placeholder="Masukkan nominal"></div>
    <div class="grid grid2"><div class="field"><label>Metode Pembayaran *</label><select name="payment_method"><option value="CASH">Tunai</option><option value="TRANSFER">Transfer</option><option value="QRIS">QRIS</option><option value="LAINNYA">Lainnya</option></select></div><div class="field"><label>Tanggal Pembayaran *</label><input name="payment_date" type="date" value="${today}" required></div></div>

  const form=document.getElementById('payForm'),instSel=document.getElementById('payInstitution'),billSel=document.getElementById('payBill'),info=document.getElementById('payBillInfo'),amountEl=document.getElementById('payAmount'),msg=document.getElementById('payMsg'),submit=document.getElementById('paySubmit');

async function v10SaveRule(type){
 const d=window._v10ExamRules||await v10LoadExamRulesOnly();
 const rule=(d.rules||[]).find(x=>x.exam_type===type)||null;
 const materials=d.materials||[];
 if(!materials.length)return window.bkAlert('Materi ujian aktif belum tersedia.');
 const details=materials.map(m=>({material_id:m.id,minimum_score:Number(document.getElementById(`min_${type}_${m.id}`)?.value)}));
 if(details.some(x=>!Number.isFinite(x.minimum_score)||x.minimum_score<0||x.minimum_score>100))return window.bkAlert('Semua batas minimal materi harus diisi dengan angka 0–100.');
 const overall=Number(rule?.overall_minimum??Math.min(...details.map(x=>x.minimum_score)));
 const q=await sb.rpc('save_exam_rule_config',{p_exam_type:type,p_overall_minimum:overall,p_details:details});
 if(q.error)return window.bkAlert(window.bkfExamRuleError(q.error));
 window.bkAlert(`Penetapan ${type==='PRA_TASHIH'?'Pra Tashih':'Tashih'} berhasil disimpan.`);
 await v10SettingsTab('aturan',true);
}

async function v10SubmitExaminerAssignments(){
 const rows=v10SyncExaminerRowsFromDom().filter(x=>x.exam_material_id&&x.examiner_user_id);
 if(!rows.length)return window.bkfSystemAlert('Pilih materi dan penguji terlebih dahulu.');
 const seen=new Set();for(const r of rows){const k=r.exam_type+'|'+r.exam_material_id;if(seen.has(k))return window.bkfSystemAlert('Materi yang sama tidak boleh ditugaskan dua kali pada jenis ujian yang sama.');seen.add(k)}
 if(!(await window.bkfSystemConfirm('Simpan penugasan penguji untuk sesi ujian yang tersedia?')))return;
 const groups={PRA_TASHIH:[],TASHIH:[]};rows.forEach(r=>groups[r.exam_type].push({exam_material_id:r.exam_material_id,examiner_profile_id:r.examiner_user_id}));
 try{for(const type of ['PRA_TASHIH','TASHIH']){if(groups[type].length){const {error}=await sb.rpc('apply_examiner_assignments',{p_exam_type:type,p_assignments:groups[type]});if(error)throw error}}document.getElementById('v10ExaminerAssignment')?.remove();window.bkfSystemAlert('Penugasan penguji berhasil disimpan.');await v10SettingsTab('penguji')}catch(e){window.bkfSystemAlert(v10Err(e))}
}

async function v10ExamTab(tab){const a=document.getElementById('v10ExamArea');if(!a)return;a.innerHTML='<div class="card"><p class="muted">Memuat...</p></div>';
 if(tab==='gelombang'){
  if(!(state.roles||[]).includes('KETUA') && !has('exam.manage')){a.innerHTML='<div class="card"><div class="empty">Anda tidak memiliki hak untuk menetapkan gelombang.</div></div>';return}
  const perQ=await sb.from('management_periods').select('id,name,start_date,end_date,status').eq('status','ACTIVE').order('start_date',{ascending:false}).limit(1).maybeSingle();
  if(perQ.error){a.innerHTML=`<div class="card error">${E(v10Err(perQ.error))}</div>`;return}
  const period=perQ.data;
  if(!period){a.innerHTML='<div class="card"><div class="empty">Belum ada periode kepengurusan aktif.</div></div>';return}

  document.getElementById('simDo26').onclick=async()=>{const selected=[...modal.querySelectorAll('input[name=sec]:checked')].map(x=>x.value);if(all.checked)selected.push('semua_simulasi');if(!selected.length){document.getElementById('simMsg26').className='error';document.getElementById('simMsg26').textContent='Pilih minimal satu bagian.';return}if(!(await window.bkfSystemConfirm('Yakin mengosongkan data simulasi yang dipilih? Data yang dihapus tidak dapat dikembalikan.')))return;const msg=document.getElementById('simMsg26');msg.textContent='Mengosongkan data...';const q=await sb.rpc('reset_simulation_data',{p_sections:[...new Set(selected)]});if(q.error){msg.className='error';msg.textContent=window.friendlyError?friendlyError(q.error):q.error.message;return}msg.className='success';msg.textContent='Data simulasi berhasil dikosongkan.';setTimeout(()=>modal.remove(),1000)};
 };
 const oldSettings26=window.showSettings;
 })();
</script>

<script>
(function(){
  const _E=window.esc||((v)=>String(v??''));
  function closeButtonify(){document.querySelectorAll('button').forEach(b=>{const t=(b.textContent||'').trim();if(/^Tutup$|^×$|^✕$/.test(t)){b.classList.add('v32-x-close');b.setAttribute('aria-label','Tutup');b.title='Tutup'}})}
  const _oldOpen=window.openMyProfileForm;
  window.openMyProfileForm=async function(){
    const p=state.profile||{}; document.getElementById('v32ProfileModal')?.remove();
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="v32ProfileModal"><div class="modal-sheet"><div class="row"><div><h3>Edit Profil Saya</h3><div class="small muted">Nama, nomor telepon, foto, dan password akun.</div></div><button class="btn secondary" type="button" onclick="document.getElementById('v32ProfileModal')?.remove()">Tutup</button></div><form id="v32ProfileForm"><div class="field"><label>Nama lengkap</label><input name="full_name" required value="${_E(p.full_name||'')}"></div><div class="field"><label>Nomor telepon</label><input name="phone" inputmode="tel" value="${_E(p.phone||'')}"></div><div class="field"><label>Foto profil</label><input id="v32ProfilePhoto" type="file" accept="image/*"><div id="v32ProfilePreview">${typeof imgOr==='function'?imgOr(p.photo_url,'photo-lg'):'<div class="photo-lg photo-placeholder">Belum ada foto</div>'}</div></div><div class="field"><label>Password baru <span class="small muted">(opsional)</span></label><input name="password" type="password" minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter"></div><div class="field"><label>Konfirmasi password baru</label><input name="password_confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Ulangi password baru"><div class="small muted">Kosongkan keduanya jika password tidak ingin diubah.</div></div><button class="btn primary" style="width:100%">Simpan perubahan</button><p id="v32ProfileMsg" class="small"></p></form></div></div>`);
    const form=document.getElementById('v32ProfileForm');
    document.getElementById('v32ProfilePhoto').onchange=e=>{const f=e.target.files?.[0];if(!f)return;form._photoFile=f;document.getElementById('v32ProfilePreview').innerHTML='<span class="small muted">Foto baru siap disimpan.</span>'};
    form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form),msg=document.getElementById('v32ProfileMsg');msg.textContent='Menyimpan...';try{let photo=null;if(form._photoFile){photo=await (window.bkfUploadImage?window.bkfUploadImage(form._photoFile,'profiles/'+(state.profile?.id||state.user.id)+'.jpg'):new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(form._photoFile)}))}const r=await sb.functions.invoke('user-management',{body:{action:'self_update_profile',full_name:String(f.get('full_name')||'').trim(),phone:String(f.get('phone')||'').trim()||null,photo_url:photo,password:String(f.get('password')||'').trim()||null,password_confirm:String(f.get('password_confirm')||'').trim()||null}});if(r.error||r.data?.error)throw new Error(r.data?.error||r.error?.message||'Profil belum berhasil disimpan.');document.getElementById('v32ProfileModal')?.remove();await loadIdentity();renderShell();navigate(state.route||'settings');if(window.v12Toast)v12Toast('Profil dan perubahan akun berhasil disimpan.')}catch(err){msg.className='error';msg.textContent=err?.message||'Gagal menyimpan profil.'}};
    setTimeout(closeButtonify,0);
  };

  /* Pengguna: seluruh akun tetap ditampilkan hanya untuk Ketua; setiap pengguna mengedit dirinya sendiri lewat Profil Saya. */
  const _oldShowUsers=window.showUsers;
  

  /* Kegiatan: tombol tambah/edit yang sudah ada di V30 dipertahankan, dengan fungsi lengkap. */
  const _oldShowActivities=window.showActivities;
  /* Kegiatan: form tambah/edit lengkap untuk tombol yang ditampilkan di modul Kegiatan. */
  window.openActivityForm=async function(id=''){
    if(!(await requireActiveSession())){toast('Sesi pengguna belum tersedia. Silakan muat ulang halaman.','error');return}
    const a=(window._activityData||[]).find(x=>x.id===id)||{};
    const iso=v=>v?new Date(v).toISOString().slice(0,16):'';
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="activityModal"><div class="modal-sheet"><div class="row"><h3>${id?'Edit Kegiatan':'Tambah Kegiatan'}</h3><button class="btn secondary" type="button" onclick="document.getElementById('activityModal')?.remove()">Tutup</button></div><form id="activityForm"><div class="field"><label>Nama kegiatan *</label><input name="name" required value="${_E(a.name||'')}"></div><div class="field"><label>Tema</label><input name="theme" value="${_E(a.theme||'')}"></div><div class="grid grid2"><div class="field"><label>Mulai *</label><input name="start_at" type="datetime-local" required value="${iso(a.start_at)}"></div><div class="field"><label>Selesai</label><input name="end_at" type="datetime-local" value="${iso(a.end_at)}"></div></div><div class="field"><label>Tempat</label><input name="venue" value="${_E(a.venue||'')}"></div><div class="field"><label>Status</label><select name="status"><option value="RENCANA" ${a.status==='RENCANA'?'selected':''}>Rencana</option><option value="BERJALAN" ${a.status==='BERJALAN'?'selected':''}>Berjalan</option><option value="SELESAI" ${a.status==='SELESAI'?'selected':''}>Selesai</option><option value="BATAL" ${a.status==='BATAL'?'selected':''}>Batal</option></select></div><div class="field"><label>Deskripsi</label><textarea name="description">${_E(a.description||'')}</textarea></div><label class="check"><input name="is_published" type="checkbox" ${a.is_published?'checked':''}> Tampilkan sebagai kegiatan publik</label><button class="btn primary" style="width:100%;margin-top:12px">Simpan Kegiatan</button><p id="activityMsg" class="small"></p></form></div></div>`);
    const f=document.getElementById('activityForm');
    f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),msg=document.getElementById('activityMsg');msg.textContent='Menyimpan...';try{const start=fd.get('start_at'),end=fd.get('end_at');if(end&&new Date(end)<new Date(start))throw new Error('Waktu selesai tidak boleh sebelum waktu mulai.');const payload={name:String(fd.get('name')||'').trim(),theme:String(fd.get('theme')||'').trim()||null,start_at:start,end_at:end||null,venue:String(fd.get('venue')||'').trim()||null,status:fd.get('status')||'RENCANA',description:String(fd.get('description')||'').trim()||null,is_published:fd.get('is_published')==='on'};if(!payload.name)throw new Error('Nama kegiatan wajib diisi.');if(!id){const orgs=await sb.rpc('current_organization_ids');const oid=Array.isArray(orgs.data)?orgs.data[0]:null;if(orgs.error||!oid)throw new Error('Organisasi aktif akun belum ditemukan.');payload.organization_id=oid;}let q=id?await sb.from('activities').update(payload).eq('id',id):await sb.from('activities').insert(payload);if(q.error)throw q.error;document.getElementById('activityModal')?.remove();toast(id?'Kegiatan berhasil diperbarui.':'Kegiatan berhasil ditambahkan.');showActivities()}catch(err){msg.className='error';msg.textContent=friendlyError(err)}};
  };

  window.showExamReportsV32=async function(examType){
    const area=document.getElementById('examArea')||page();
    const type=String(examType||'').toUpperCase();
    if(type!=='PRA_TASHIH'&&type!=='TASHIH'){
      window._bkfExamReportType='';
      area.innerHTML=`<div class="card"><div class="row"><div><h3>Rekap Hasil Ujian</h3><div class="small muted">Pilih tahap ujian untuk melihat hasil yang sudah tersimpan.</div></div><button class="btn secondary" onclick="window.bkfPagePrintActionsV151(document.title)">Cetak</button></div><div class="grid grid2" style="margin-top:12px"><button class="btn primary" type="button" onclick="showExamReportsV32('PRA_TASHIH')"><strong>Ujian Pra Tashih</strong><span class="small" style="display:block;margin-top:4px">Rekap hasil Ujian Pra Tashih</span></button><button class="btn gold" type="button" onclick="showExamReportsV32('TASHIH')"><strong>Ujian Tashih</strong><span class="small" style="display:block;margin-top:4px">Rekap hasil Ujian Tashih</span></button></div></div>`;
      return;
    }

    window._bkfExamReportType=type;
    const label=type==='TASHIH'?'Tashih':'Pra Tashih';
    const reportElId='examReport';
    area.innerHTML=`<div class="card"><div class="row"><div><h3>Rekap Hasil Ujian ${label}</h3><div class="small muted">Menampilkan hasil ujian yang sudah tersimpan. Nilai dapat dikoreksi sebelum difinalisasi.</div></div><div class="compact-actions no-print"><button class="btn secondary" onclick="showExamReportsV32()">← Pilih Tahap</button><button class="btn secondary" onclick="window.bkfPagePrintActionsV151(document.title)">Cetak</button></div></div><div id="${reportElId}" class="list"><p class="muted">Memuat hasil ujian...</p></div></div>`;
    const reportEl=()=>document.getElementById(reportElId);
    const setError=m=>{const el=reportEl();if(el)el.innerHTML=`<p class="error">${_E(m||'Hasil ujian belum dapat dimuat.')}</p>`};
    const waitQuery=async(promise,labelText)=>{
      const r=await Promise.race([promise,new Promise(resolve=>setTimeout(()=>resolve({data:null,error:{message:labelText+' melebihi batas waktu 15 detik.'}}),15000))]);
      return r;
    };

    try{
      // Batasi seluruh rangkaian ke organisasi aktif. Ini mencegah Rekap membaca ratusan hasil lintas organisasi.
      const oq=await waitQuery(sb.rpc('current_organization_ids'),'Pemeriksaan organisasi aktif');
      if(oq.error)throw oq.error;
      const orgIds=Array.isArray(oq.data)?oq.data.filter(Boolean):[];
      if(!orgIds.length)throw new Error('Organisasi aktif akun belum ditemukan.');

      const iq=await waitQuery(sb.from('institutions').select('id,name').in('organization_id',orgIds).limit(500),'Pemuatan lembaga');
      if(iq.error)throw iq.error;
      const institutions=iq.data||[];
      const institutionIds=institutions.map(x=>x.id).filter(Boolean);
      if(!institutionIds.length){reportEl().innerHTML=`<div class="empty">Belum ada lembaga pada organisasi aktif.</div>`;return;}
      const institutionMap=new Map(institutions.map(x=>[x.id,x.name||'-']));

      const rq=await waitQuery(sb.from('exam_registrations').select('id,exam_type,institution_id').eq('exam_type',type).in('institution_id',institutionIds).limit(1000),'Pemuatan pendaftaran ujian');
      if(rq.error)throw rq.error;
      const registrations=rq.data||[];
      const registrationIds=registrations.map(x=>x.id).filter(Boolean);
      if(!registrationIds.length){reportEl().innerHTML=`<div class="empty">Belum ada hasil ujian ${label} yang tersimpan.</div>`;return;}
      const registrationMap=new Map(registrations.map(x=>[x.id,x]));

      const sq=await waitQuery(sb.from('exam_sessions').select('id,exam_registration_id,participant_id').in('exam_registration_id',registrationIds).limit(1000),'Pemuatan sesi ujian');
      if(sq.error)throw sq.error;
      const sessions=sq.data||[];
      const sessionIds=sessions.map(x=>x.id).filter(Boolean);
      if(!sessionIds.length){reportEl().innerHTML=`<div class="empty">Belum ada hasil ujian ${label} yang tersimpan.</div>`;return;}
      const sessionMap=new Map(sessions.map(x=>[x.id,x]));

      // Ambil hasil TERLEBIH DAHULU; Rekap tidak bergantung pada status sesi/locked_at.
      const erq=await waitQuery(sb.from('exam_results').select('id,exam_session_id,total_score,average_score,status,finalized_at,locked_at').in('exam_session_id',sessionIds).limit(1000),'Pemuatan hasil ujian');
      if(erq.error)throw erq.error;
      const results=(erq.data||[]).filter(x=>x.exam_session_id&&sessionMap.has(x.exam_session_id));
      if(!results.length){reportEl().innerHTML=`<div class="empty">Belum ada hasil ujian ${label} yang tersimpan.</div>`;return;}

      const participantIds=[...new Set(sessions.map(x=>x.participant_id).filter(Boolean))];
      const [pq,mq,scoreQ]=await Promise.all([
        participantIds.length?waitQuery(sb.from('exam_participants').select('id,name,nis,exam_number,media_id').in('id',participantIds).limit(1000),'Pemuatan peserta'):Promise.resolve({data:[],error:null}),
        Promise.resolve({data:[],error:null}),
        waitQuery(sb.from('exam_scores').select('id,exam_session_id,exam_material_id,score,attempt_number,status,submitted_at,created_at,exam_materials:exam_material_id(name,code,sequence),exam_score_components(id,component_code,score)').in('exam_session_id',results.map(x=>x.exam_session_id)).order('attempt_number',{ascending:false}).order('submitted_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false}),'Pemuatan rincian nilai')
      ]);
      if(pq.error)throw pq.error;
      if(scoreQ.error)throw scoreQ.error;
      const participants=new Map((pq.data||[]).map(x=>[x.id,x]));
      const mediaIds=[...new Set((pq.data||[]).map(x=>x.media_id).filter(Boolean))];
      let media=[];
      if(mediaIds.length){
        const mediaQ=await waitQuery(sb.from('participant_media').select('id,storage_path').in('id',mediaIds).limit(1000),'Pemuatan foto peserta');
        if(mediaQ.error)throw mediaQ.error;
        media=mediaQ.data||[];
      }
      const mediaMap=new Map(media.map(x=>[x.id,x.storage_path]));

      const scoreMap=new Map();
      (scoreQ.data||[]).forEach(x=>{const key=x.exam_session_id+'|'+x.exam_material_id;if(!scoreMap.has(key))scoreMap.set(key,x)});
      const mediaUrl=path=>{const u=String(path||'');if(!u)return '';if(/^https?:/i.test(u))return u;try{return sb.storage.from('bkfuspaq-media').getPublicUrl(u).data?.publicUrl||''}catch(_){return ''}};
      const roles=Array.isArray(state?.roles)?state.roles:[];
      const canReview=roles.includes('KETUA')||roles.includes('SEKRETARIS');
      const canFinalize=canReview&&roles.some(r=>['KETUA','SEKRETARIS'].includes(String(r).toUpperCase()));
      const canLock=roles.includes('KETUA');

      reportEl().innerHTML=results.sort((a,b)=>String(b.finalized_at||'').localeCompare(String(a.finalized_at||''))).map(result=>{
        const session=sessionMap.get(result.exam_session_id)||{};
        const participant=participants.get(session.participant_id)||{};
        const registration=registrationMap.get(session.exam_registration_id)||{};
        const institution=institutionMap.get(registration.institution_id)||'-';
        const finalized=!!result.finalized_at,locked=!!result.locked_at,editable=canReview&&!finalized&&!locked;
        const photo=mediaUrl(mediaMap.get(participant.media_id));
        const statusText=locked?'TERKUNCI':finalized?'DIFINALISASI':(result.status||'BELUM_LULUS');
        const statusClass=locked||finalized||String(result.status||'').startsWith('LULUS')?'ok':result.status==='REMEDIAL'||result.status==='BELUM_LULUS'?'bad':'';
        const scoreRows=[...scoreMap.values()].filter(x=>x.exam_session_id===result.exam_session_id).sort((a,b)=>Number(a.exam_materials?.sequence||9999)-Number(b.exam_materials?.sequence||9999));
        const materialHtml=scoreRows.length?scoreRows.map(x=>{
          const comps=(x.exam_score_components||[]).map(c=>editable?`<div class="small muted" style="margin-top:4px">${_E(c.component_code)} <input class="exam-list-component" data-score-id="${_E(x.id)}" data-component="${_E(c.component_code)}" type="number" min="0" max="100" step="0.01" value="${c.score??''}" style="width:90px;margin-left:5px"></div>`:`<div class="small muted">${_E(c.component_code)}: ${_E(c.score??'-')}</div>`).join('');
          const scoreField=editable?`<input class="exam-list-score" data-score-id="${_E(x.id)}" type="number" min="0" max="100" step="0.01" value="${x.score??''}" style="width:105px;text-align:right">`:`<strong>${_E(x.score??'-')}</strong>`;
          return `<div style="padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-top:7px"><div class="row"><span>${_E(x.exam_materials?.name||x.exam_materials?.code||'-')}</span><span>${scoreField}</span></div>${comps}</div>`;
        }).join(''):'<div class="small muted" style="margin-top:8px">Belum ada rincian nilai materi.</div>';
        let actions='';
        if(editable&&scoreRows.length)actions+=`<button class="btn secondary" onclick="window.bkfSaveExamList('${_E(result.exam_session_id)}')">Simpan Koreksi Nilai</button>`;
        if(!finalized&&!locked&&String(result.status||'').startsWith('LULUS')&&canFinalize)actions+=`<button class="btn primary" onclick="v11FinalizeSession('${_E(result.exam_session_id)}')">Finalisasi Nilai</button>`;
        if(finalized&&!locked&&String(result.status||'').startsWith('LULUS')&&canLock)actions+=`<button class="btn gold" onclick="v11LockSession('${_E(result.exam_session_id)}')">Penguncian Nilai</button>`;
        if(locked)actions+=`<span class="small muted">Hasil sudah dikunci dan tidak dapat dikoreksi.</span>`;
        if(finalized&&!locked&&!actions)actions='<span class="small muted">Hasil sudah difinalisasi.</span>';
        return `<div class="list-item"><div class="row"><div style="display:flex;gap:10px;align-items:center"><div class="photo-sm" style="width:48px;height:60px;flex:0 0 48px;overflow:hidden;border-radius:8px;border:1px solid var(--line)">${photo?`<img src="${_E(photo)}" alt="Foto" style="width:100%;height:100%;object-fit:cover">`:'Foto'}</div><div><strong>${_E(participant.name||'Peserta ujian')}</strong><div class="small muted">NIS ${_E(participant.nis||'-')} · No. ujian ${_E(participant.exam_number||'-')}</div><div class="small muted">Lembaga: ${_E(institution)}</div></div></div><span class="status ${statusClass}">${_E(statusText)}</span></div><div style="margin-top:10px"><strong>Hasil Ujian ${label}</strong>${materialHtml}</div><div class="small muted" style="margin-top:9px"><strong>Total:</strong> ${_E(result.total_score??'-')} · <strong>Rata-rata:</strong> ${result.average_score==null?'-':Number(result.average_score).toFixed(2)} · <strong>Hasil:</strong> ${_E(result.status||'-')}</div><div class="compact-actions no-print" style="margin-top:10px">${actions}</div></div>`;
      }).join('');
    }catch(e){
      console.error('[BK REKAP HASIL UJIAN V252]',e);
      setError(e?.message||String(e));
    }
  };

  window.bkfSaveExamList=async function(sessionId){
    const box=document.getElementById('examReport');
    const items=[...document.querySelectorAll('#examReport .exam-list-score')].filter(i=>i.closest('.list-item')).map(i=>({exam_score_id:i.dataset.scoreId,score:Number(i.value),components:[...document.querySelectorAll('#examReport .exam-list-component[data-score-id="'+i.dataset.scoreId+'"]').map(c=>({component_code:c.dataset.component,score:Number(c.value)}))]}));
    if(!items.length)return window.bkAlert('Tidak ada nilai yang dapat disimpan.');
    if(items.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100||x.components.some(c=>!Number.isFinite(c.score)||c.score<0||c.score>100)))return window.bkAlert('Nilai harus 0–100.');
    const {error}=await sb.rpc('review_exam_scores',{p_exam_session_id:sessionId,p_scores:items});
    if(error)return window.bkAlert(v10Err(error));
    window.bkAlert('Koreksi nilai tersimpan. Hasil ujian dihitung ulang oleh sistem.');
    await showExamReportsV32(window._bkfExamReportType||'');
  };

  window.bkfOpenExamReview=async function(sessionId,readOnly){
    const roles=Array.isArray(state?.roles)?state.roles:[];
    const isOperator=roles.includes('OPERATOR');
    const canReview=roles.includes('KETUA')||roles.includes('SEKRETARIS');
    const sessionQ=await sb.from('exam_sessions').select('id,status,participant_id,exam_participants:participant_id(name,nis,exam_number),exam_results:exam_results!exam_results_exam_session_id_fkey(total_score,average_score,status,finalized_at,locked_at)').eq('id',sessionId).maybeSingle();
    if(sessionQ.error||!sessionQ.data)return window.bkAlert(_E(sessionQ.error?.message||'Sesi ujian tidak ditemukan.'));
    const result=sessionQ.data.exam_results;
    const locked=!!result?.locked_at,finalized=!!result?.finalized_at;
    if(isOperator&&!locked)return window.bkAlert('Nilai belum dapat dilihat sebelum dikunci oleh Ketua.');
    const scoreQ=await sb.from('exam_scores').select('id,score,attempt_number,status,exam_materials:exam_material_id(name,code),exam_score_components(id,component_code,score)').eq('exam_session_id',sessionId).order('created_at',{ascending:true});
    if(scoreQ.error)return window.bkAlert(_E(scoreQ.error.message));
    const editable=canReview&&!readOnly&&!locked&&!finalized;
    const p=sessionQ.data.exam_participants||{};
    const rows=(scoreQ.data||[]).map(x=>{
      const comps=(x.exam_score_components||[]).map(c=>editable?`<div class="small" style="margin-top:4px"><label>${_E(c.component_code)} <input class="exam-correction-component" data-score-id="${x.id}" data-component="${_E(c.component_code)}" type="number" min="0" max="100" step="0.01" value="${c.score??''}" style="max-width:110px"></label></div>`:`<div class="small muted">${_E(c.component_code)}: ${_E(c.score??'-')}</div>`).join('');
      return `<div class="list-item"><div class="row"><strong>${_E(x.exam_materials?.name||'-')}</strong><span class="small muted">${_E(x.status||'-')}</span></div>${editable?`<input class="exam-correction-score" data-score-id="${x.id}" type="number" min="0" max="100" step="0.01" value="${x.score??''}" style="max-width:140px">`:`<div class="metric" style="font-size:22px">${_E(x.score??'-')}</div>`}${comps}</div>`;
    }).join('')||'<div class="empty">Belum ada rincian nilai.</div>';
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="examReviewModal"><div class="modal-sheet" style="max-width:760px"><div class="row"><div><h3>${editable?'Pemeriksaan & Koreksi Nilai':isOperator?'Nilai Resmi Peserta':'Hasil Ujian'}</h3><div class="small muted">${_E(p.name||'-')} · NIS ${_E(p.nis||'-')} · No. ujian ${_E(p.exam_number||'-')}</div></div><button class="btn secondary" onclick="document.getElementById('examReviewModal')?.remove()">Tutup</button></div><div class="small muted" style="margin:10px 0">Status: ${locked?'🔒 Terkunci':finalized?'Sudah difinalisasi':'Belum difinalisasi'}</div><div class="list">${rows}</div><div id="examReviewMsg"></div>${editable?`<div class="compact-actions" style="margin-top:12px"><button class="btn primary" onclick="window.bkfSaveExamReview('${sessionId}')">Simpan Koreksi</button><button class="btn secondary" onclick="window.bkfFinalizeFromReview('${sessionId}')">Finalisasi Nilai</button></div>`:''}</div></div>`);
  };

  window.bkfSaveExamReview=async function(sessionId){
    const items=[...document.querySelectorAll('#examReviewModal .exam-correction-score')].map(i=>({exam_score_id:i.dataset.scoreId,score:Number(i.value),components:[...document.querySelectorAll('#examReviewModal .exam-correction-component[data-score-id="'+i.dataset.scoreId+'"]')].map(c=>({component_code:c.dataset.component,score:Number(c.value)}))}));
    if(items.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100))return window.bkAlert('Nilai harus 0–100.');
    const {error}=await sb.rpc('review_exam_scores',{p_exam_session_id:sessionId,p_scores:items});
    if(error)return window.bkAlert(v10Err(error));
    window.bkAlert('Koreksi nilai tersimpan. Hasil ujian dihitung ulang.');
    document.getElementById('examReviewModal')?.remove();
    showExamReportsV32();
  };

  window.bkfFinalizeFromReview=async function(sessionId){
    if(!(await window.bkfSystemConfirm('Finalisasi hasil ini? Pastikan seluruh nilai sudah diperiksa dan benar. Setelah finalisasi, koreksi biasa tidak dapat dilakukan lagi.')))return;
    const {error}=await sb.rpc('finalize_exam_result',{p_session_id:sessionId});
    if(error)return window.bkAlert(v10Err(error));
    window.bkAlert('Hasil ujian berhasil difinalisasi.');
    document.getElementById('examReviewModal')?.remove();
    showExamReportsV32();
  };


  /* Keuangan: pertahankan semua tab V30, tetapi ganti panel Kas dan Tagihan dengan alur V32. */
  window.saveCashV32=async function(e){e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('v32CashMsg');const org=(await sb.from('organizations').select('id').eq('status','ACTIVE').limit(1).maybeSingle()).data;if(!org){msg.className='error';msg.textContent='Organisasi aktif belum tersedia.';return}const typ=f.get('transaction_type');const {error}=await sb.from('cash_transactions').insert({transaction_number:'KAS-'+Date.now(),organization_id:org.id,transaction_date:f.get('transaction_date'),transaction_type:typ,category_id:f.get('category_id'),amount:Number(f.get('amount')),description:f.get('description')||null,created_by:state.profile?.id,status:'DISETUJUI'});if(error){msg.className='error';msg.textContent=friendlyError(error);return}msg.className='success';msg.textContent=typ==='EXPENSE'?'Kas keluar tersimpan; jika melewati batas, sistem menunggu persetujuan Ketua.':'Kas masuk berhasil dicatat.';e.target.reset();document.getElementById('v32CashType').dispatchEvent(new Event('change'));loadCashV32()};
  window.loadCashV32=async function(){const [h,p]=await Promise.all([sb.from('v_cash_book').select('*').order('transaction_date',{ascending:false}).limit(100),sb.from('cash_transactions').select('id,transaction_number,transaction_date,amount,description,status').eq('transaction_type','EXPENSE').eq('status','MENUNGGU_PERSETUJUAN').order('transaction_date',{ascending:false})]);const hh=document.getElementById('v32CashHistory'),pp=document.getElementById('v32CashPending');if(hh)hh.innerHTML=h.error?`<p class="error">${_E(h.error.message)}</p>`:h.data?.length?h.data.map(x=>`<div class="list-item"><div class="row"><strong>${_E(x.transaction_number)}</strong><span class="status ${x.status==='MENUNGGU_PERSETUJUAN'?'lock':x.status==='DITOLAK'?'bad':'ok'}">${_E(x.status||'-')}</span></div><div class="small">${_E(x.category_name||x.transaction_type)} · ${fmt(x.amount)} · ${date(x.transaction_date)}</div></div>`).join(''):'<div class="empty">Belum ada transaksi.</div>';if(pp)pp.innerHTML=p.error?`<p class="error">${_E(p.error.message)}</p>`:p.data?.length?p.data.map(x=>`<div class="list-item"><div class="row"><div><strong>${_E(x.transaction_number)}</strong><div class="small">${date(x.transaction_date)} · ${fmt(x.amount)}</div><div class="small">${_E(x.description||'')}</div></div>${has('finance.approve')?`<div class="compact-actions"><button class="btn primary" onclick="approveCashV32('${x.id}',true)">Setujui</button><button class="btn danger" onclick="approveCashV32('${x.id}',false)">Tolak</button></div>`:''}</div></div>`).join(''):'<div class="empty">Tidak ada kas keluar yang menunggu persetujuan.</div>'};
  window.approveCashV32=async function(id,ok){const {error}=await sb.rpc('approve_cash_expense',{p_id:id,p_approved:ok,p_note:ok?'Disetujui Ketua':'Ditolak Ketua'});if(error)return window.bkAlert(error.message);loadCashV32()};
  /* previous financeBills2 implementation removed; canonical implementation retained later. */
  window.autoCreateBillsV32=async function(){return true;};

  /* Sekretariat: hapus langsung dari masing-masing item surat. */
  window.deleteLetterV32=async function(table,id){if(!(await window.bkfSystemConfirm('Hapus surat ini? Data tidak dapat dikembalikan.')))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)return window.bkAlert(error.message);showSecretariat()};
  /* Pengaturan: tanpa counter/tombol Keluar. */
  /* Bersihkan tombol manual tagihan yang mungkin dirender oleh legacy function. */
  document.addEventListener('click',()=>setTimeout(()=>{document.querySelectorAll('button').forEach(b=>{if(/Tambah Tagihan|Jadikan Tagihan/.test((b.textContent||'').trim()))b.remove()});closeButtonify()},0),{passive:true});
  setTimeout(closeButtonify,100);
})();
</script>
<style id="v33-user-architecture">
/* V33 — Kepengurusan & Pengguna: pisahkan akun organisasi dari akun lembaga */
#adminUserForm .scope-note{margin-top:6px}
</style>
<script id="v33-user-architecture-script">
(function(){
  const E=window.esc||((x)=>String(x??''));
  const oldShowManagement=window.showManagement;
  

  function roleOptions(type,current){
    const org=[['KETUA','Ketua Pengurus'],['SEKRETARIS','Sekretaris Pengurus'],['BENDAHARA','Bendahara Pengurus'],['ANGGOTA','Anggota Pengurus']];
    const inst=[['OPERATOR','Kepala/Operator Lembaga']];
    return (type==='institution'?inst:org).map(x=>`<option value="${x[0]}" ${x[0]===current?'selected':''}>${x[1]}</option>`).join('');
  }
  function syncScopeForm(){
    const f=document.getElementById('v33AdminUserForm'); if(!f)return;
    const type=f.elements.scope_type?.value||'organization', role=f.elements.role_code, inst=f.elements.institution_id, pw=f.elements.password;
    role.innerHTML=roleOptions(type,role.dataset.current||role.value);
    if(type==='institution'){
      inst.disabled=false; inst.required=true;
      f.querySelector('.v33-inst-wrap')?.classList.remove('hidden');
      f.querySelector('.scope-note').textContent='Akun ini terhubung ke satu lembaga dan tidak menjadi anggota kepengurusan organisasi.';
    }else{
      inst.value=''; inst.disabled=true; inst.required=false;
      f.querySelector('.scope-note').textContent='Akun ini adalah akun pengurus organisasi. Lembaga tidak perlu dipilih.';
    }
    if(pw) pw.placeholder=f.dataset.uid?'Kosongkan jika tidak ingin mengganti password':'Minimal 8 karakter';
  }
  async function saveV33AdminUser(e,uid){
    e.preventDefault(); const f=e.target,msg=document.getElementById('v33AdminMsg'); msg.textContent='Menyimpan...';
    try{
      const fd=new FormData(f),type=fd.get('scope_type'),role=fd.get('role_code'),inst=type==='institution'?(fd.get('institution_id')||null):null,pw=String(fd.get('password')||'').trim(),pc=String(fd.get('password_confirm')||'').trim();
      if(type==='institution'&&!inst)throw new Error('Lembaga wajib dipilih untuk Pengguna Lembaga.');
      if(pw&&pw.length<8)throw new Error('Password minimal 6 karakter.');
      if(pw!==pc)throw new Error('Konfirmasi password tidak sama.');
      let authId=uid;
      if(!uid){const r=await sb.functions.invoke('user-management',{body:{action:'create',full_name:String(fd.get('full_name')||'').trim(),email:String(fd.get('email')||'').trim(),phone:String(fd.get('phone')||'').trim()||null,role_code:role,password:pw}});if(r.error||r.data?.error)throw new Error(r.data?.error||r.error?.message||'Akun belum berhasil dibuat.');authId=r.data.user_id;}
      else if(pw){const r=await sb.functions.invoke('user-management',{body:{action:'reset_password',user_id:authId,password:pw}});if(r.error||r.data?.error)throw new Error(r.data?.error||r.error?.message||'Password belum berhasil diubah.');}
      let photo=null;if(f._photoFile)photo=await (window.bkfUploadImage?window.bkfUploadImage(f._photoFile,'profiles/admin-'+authId+'.jpg'):null);
      const q=await sb.rpc('admin_save_user_profile',{p_auth_user_id:authId,p_full_name:String(fd.get('full_name')||'').trim(),p_phone:String(fd.get('phone')||'').trim()||null,p_photo_url:photo,p_role_code:role,p_institution_id:inst});
      if(q.error)throw q.error;
      if(type==='organization'){const mm=await sb.rpc('add_management_member',{p_auth_user_id:authId,p_role_code:role,p_start_date:new Date().toISOString().slice(0,10),p_end_date:null});if(mm.error)throw mm.error;}
      else {await sb.from('management_members').update({status:'INACTIVE',end_date:new Date().toISOString().slice(0,10)}).eq('user_id',authId).eq('status','ACTIVE');}
      document.getElementById('adminUserModal')?.remove();toast(uid?'Pengguna berhasil diperbarui.':'Pengguna berhasil dibuat.');showUsers();
    }catch(err){msg.className='error';msg.textContent=friendlyError(err)}
  }

  

  // Label navigasi utama: Pengurus menjadi bagian dari Kepengurusan, bukan modul yang berdiri sendiri.
  setTimeout(()=>{document.querySelectorAll('button,a').forEach(el=>{if((el.textContent||'').trim()==='Pengurus')el.textContent='Kepengurusan'});},100);
})();

(function(){
  const E=window.esc||((x)=>String(x??''));
  const isManager=()=>state.roles.includes('KETUA')||state.roles.includes('SEKRETARIS');
  const isChair=()=>state.roles.includes('KETUA');
  const posLabel=x=>({KETUA:'Ketua Panitia',SEKRETARIS:'Sekretaris Panitia',BENDAHARA:'Bendahara Panitia',ANGGOTA:'Anggota Panitia'})[x]||x;

  // Satu pintu Kepengurusan: profil organisasi, susunan pengurus, penugasan penguji.
  

  // Penugasan penguji bersifat TEMPLATE: boleh dibuat kapan saja, sebelum ada peserta.
  // Kegiatan: setiap kegiatan memiliki satu susunan panitia. Semua anggota panitia berasal dari Pengurus aktif.
  window.openCommitteeForm=async function(activityId){
    if(!(await requireActiveSession())){toast('Sesi pengguna belum tersedia.','error');return}
    const a=(window._activityData||[]).find(x=>x.id===activityId); if(!a)return;
    const [{data:members},{data:comm}]=await Promise.all([
      sb.from('management_members').select('user_id,role_id').eq('status','ACTIVE'),
      sb.from('activity_committees').select('id').eq('activity_id',activityId).maybeSingle()
    ]);
    const ids=(members||[]).map(x=>x.role_id).filter(Boolean),uids=(members||[]).map(x=>x.user_id).filter(Boolean);
    const [{data:roles},{data:profiles},{data:cm}]=await Promise.all([
      ids.length?sb.from('roles').select('id,code,name').in('id',ids):Promise.resolve({data:[]}),
      uids.length?sb.from('profiles').select('id,full_name,phone').in('id',uids):Promise.resolve({data:[]}),
      comm?.id?sb.from('activity_committee_members').select('user_id,position').eq('committee_id',comm.id):Promise.resolve({data:[]})
    ]);
    const rm=new Map((roles||[]).map(x=>[x.id,x])),pm=new Map((profiles||[]).map(x=>[x.id,x])),cmMap=new Map((cm||[]).map(x=>[x.user_id,x.position]));
    const rows=(members||[]).map(x=>({id:x.user_id,p:pm.get(x.user_id),r:rm.get(x.role_id)})).filter(x=>x.p).map(x=>`<div class="list-item"><div class="row"><label class="check" style="flex:1"><input type="checkbox" class="committee-user" value="${E(x.id)}" ${cmMap.has(x.id)?'checked':''}><span><strong>${E(x.p.full_name)}</strong><br><span class="small muted">${E(x.r?.name||x.r?.code||'Pengurus')}</span></span></label><select class="committee-pos" data-user="${E(x.id)}"><option value="KETUA" ${cmMap.get(x.id)==='KETUA'?'selected':''}>Ketua Panitia</option><option value="SEKRETARIS" ${cmMap.get(x.id)==='SEKRETARIS'?'selected':''}>Sekretaris Panitia</option><option value="BENDAHARA" ${cmMap.get(x.id)==='BENDAHARA'?'selected':''}>Bendahara Panitia</option><option value="ANGGOTA" ${cmMap.get(x.id)==='ANGGOTA'?'selected':''}>Anggota Panitia</option></select></div></div>`).join('');
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="committeeModal"><div class="modal-sheet"><div class="row"><div><h3>Panitia Kegiatan</h3><div class="small muted">${E(a.name)}</div></div><button class="btn secondary" type="button" onclick="document.getElementById('committeeModal')?.remove()">Tutup</button></div><div class="notice">Ketua, Sekretaris, Bendahara, maupun Anggota Pengurus dapat diberi tugas sebagai panitia dengan peran apa pun.</div><div class="list" style="margin-top:10px">${rows||'<div class="empty">Belum ada pengurus aktif.</div>'}</div><button id="saveCommittee" class="btn primary" style="width:100%;margin-top:12px">Simpan Susunan Panitia</button><p id="committeeMsg" class="small"></p></div></div>`);
    document.getElementById('saveCommittee').onclick=async()=>{
      const msg=document.getElementById('committeeMsg');msg.textContent='Menyimpan...';
      try{
        const members=[...document.querySelectorAll('.committee-user:checked')].map(ch=>({user_id:ch.value,position:document.querySelector(`.committee-pos[data-user="${ch.value}"]`)?.value||'ANGGOTA'}));
        if(!members.length)throw new Error('Pilih minimal satu anggota panitia.');
        const positions=members.map(x=>x.position);for(const p of ['KETUA','SEKRETARIS','BENDAHARA'])if(positions.filter(x=>x===p).length>1)throw new Error(posLabel(p)+' hanya boleh satu orang.');
        const r=await sb.rpc('save_activity_committee',{p_activity_id:activityId,p_members:members});if(r.error)throw r.error;
        msg.className='success';msg.textContent='Susunan panitia berhasil disimpan.';setTimeout(()=>{document.getElementById('committeeModal')?.remove();showActivities()},500);
      }catch(e){msg.className='error';msg.textContent=E(e?.message||e)}
    };
  };

  // Pengaturan dibuat ringkas: akun + master jenis kas. Identitas/susunan dipindah ke Kepengurusan.
  window.openFinanceCategoryForm=async function(id=''){
    if(!isChair()){toast('Hanya Ketua yang dapat mengatur jenis kas.','error');return}

<script id="v41-final-consolidated-revision">
(function(){
  const E=window.esc||((v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  const toast=(m,t='success')=>window.v12Toast?v12Toast(m,t):window.bkAlert(m);
  const err=(e)=>window.friendlyError?window.friendlyError(e):'Tindakan belum berhasil. Silakan periksa data lalu coba lagi.';
  const isPengurus=()=>['KETUA','SEKRETARIS','BENDAHARA','ANGGOTA'].some(r=>state.roles.includes(r));
  const canAction=p=>{const roles=Array.isArray(state?.roles)?state.roles:[];if(roles.includes('KETUA'))return true;const map={ 'exam.manage':['KETUA','SEKRETARIS'], 'exam.participant.register':['KETUA','SEKRETARIS','OPERATOR'], 'exam.participant.edit':['KETUA','SEKRETARIS','OPERATOR'], 'exam.remedial.manage':['KETUA','ANGGOTA'], 'graduation.manage':['KETUA','SEKRETARIS'], 'graduation.participant.register':['KETUA','SEKRETARIS','OPERATOR'], 'graduation.participant.edit':['KETUA','SEKRETARIS','OPERATOR']};return (map[p]||[]).some(r=>roles.includes(r));};
  const canExamManage=()=>canAction('exam.manage');
  const canGradManage=()=>canAction('graduation.manage');
  const xls=(filename,title,headers,rows)=>{
    const escx=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><style id="v125-no-sidebar-descriptions">.drawer .menu-caption,.drawer .menu-item .small.muted{display:none!important}.drawer .menu-item{min-height:44px}</style></head><body><h2>${escx(title)}</h2><table border="1"><tr>${headers.map(h=>`<th>${escx(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${escx(v)}</td>`).join('')}</tr>`).join('')}</table>`;
    const blob=new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8;'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
  };
  const printTable=(title,headers,rows)=>{
    if(typeof window.bkfPrintTableV108==='function')return window.bkfPrintTableV108(title,headers,rows);
    const w=window.open('','_blank');if(!w){toast('Jendela cetak diblokir browser.','error');return}
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${E(title)}</title><style>@page{size:A4 portrait;margin:12mm}body{font:12px Arial;color:#111}h2{text-align:center;margin:0 0 12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:6px;vertical-align:top}th{background:#eee}</style><style id="v125-no-sidebar-descriptions">.drawer .menu-caption,.drawer .menu-item .small.muted{display:none!important}.drawer .menu-item{min-height:44px}</style></head><body><h2>${E(title)}</h2><table><thead><tr>${headers.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${E(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);w.document.close();setTimeout(()=>window.bkfPreparePrintWindowV151(w),300);
  };

  // ------------------------------------------------------------
  // UJIAN: pendaftaran tanpa pilihan kegiatan, foto peserta,
  // lembaga otomatis untuk OPERATOR dan dropdown untuk Pengurus.
  // ------------------------------------------------------------
  window.openExamRegistrationForm=async function(){
    const isOp=state.roles.includes('OPERATOR');
    
    const {data:insts,error:ie}=await sb.from('institutions').select('id,name').eq('status','ACTIVE').order('name').limit(500);
    if(ie){toast(err(ie),'error');return}
    let ownInst=null;
    if(isOp){
      const pid=state.profile?.id;
      const q=pid?await sb.from('user_roles').select('institution_id').eq('user_id',pid).eq('status','ACTIVE').not('institution_id','is',null).limit(1).maybeSingle():{data:null,error:null};
      ownInst=q.data?.institution_id||null;
      if(!ownInst){toast('Lembaga akun Anda belum terhubung.','error');return}
    }
    const options=(insts||[]).map(i=>`<option value="${E(i.id)}" ${ownInst===i.id?'selected':''}>${E(i.name)}</option>`).join('');
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="examRegModal"><div class="modal-sheet"><div class="row"><div><h3>Pendaftaran Ujian</h3><div class="small muted">Kegiatan ujian tidak perlu dipilih pada pendaftaran.</div></div><button class="btn secondary" type="button" onclick="document.getElementById(&quot;examRegModal&quot;)?.remove()">Tutup</button></div><form id="v40ExamRegForm"><div class="field"><label>Jenis ujian *</label><select name="exam_type" required><option value="PRA_TASHIH">Pra Tashih</option><option value="TASHIH">Tashih</option></select></div><div class="field"><label>Nama lembaga *</label><select name="institution_id" required ${isOp?'disabled':''}><option value="">Pilih lembaga</option>${options}</select>${isOp?`<div class="small muted">Otomatis mengikuti lembaga akun: ${E((insts||[]).find(x=>x.id===ownInst)?.name||'-')}</div>`:''}</div><div class="field"><label>Foto peserta *</label><input id="v40ExamPhoto" type="file" accept="image/*" required><div id="v40ExamPhotoPreview" class="small muted">Belum ada foto.</div></div><div class="field"><label>Nama peserta *</label><input name="name" required></div><div class="grid grid2"><div class="field"><label>NIS</label><input name="nis"></div><div class="field"><label>Jenis kelamin</label><select name="gender"><option value="">Pilih</option><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div><div class="field"><label>Tempat lahir</label><input name="birth_place"></div><div class="field"><label>Tanggal lahir</label><input name="birth_date" type="date"></div></div><div class="field"><label>Nama wali</label><input name="guardian_name"></div><div class="field"><label>Alamat</label><textarea name="address"></textarea></div><button class="btn primary" style="width:100%">Daftarkan Peserta</button><p id="v40ExamRegMsg" class="small"></p></form></div></div>`);
    const f=document.getElementById('v40ExamRegForm'),photo=document.getElementById('v40ExamPhoto'),preview=document.getElementById('v40ExamPhotoPreview');
    photo.onchange=e=>{const file=e.target.files?.[0];if(!file)return;f._photoFile=file;const r=new FileReader();r.onload=()=>preview.innerHTML=`<img src="${E(r.result)}" style="width:90px;height:115px;object-fit:cover;border-radius:10px;border:1px solid #ccc">`;r.readAsDataURL(file)};
    f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),msg=document.getElementById('v40ExamRegMsg');msg.textContent='Menyimpan...';try{if(!f._photoFile)throw new Error('Foto peserta wajib diisi.');let mediaId=null;const url=await (window.bkfUploadImage||window.v23UploadImage)(f._photoFile,'exam-participants/'+crypto.randomUUID()+'.jpg');const m=await sb.from('participant_media').insert({media_type:'PARTICIPANT',storage_path:url,mime_type:'image/jpeg',file_size:f._photoFile.size,uploaded_by:state.profile?.id||null,status:'ACTIVE'}).select('id').single();if(m.error)throw m.error;mediaId=m.data.id;const institution=isOp?ownInst:fd.get('institution_id');const q=await sb.rpc('register_exam_participant',{p_activity_id:null,p_exam_type:fd.get('exam_type'),p_institution_id:institution,p_name:String(fd.get('name')||'').trim(),p_nis:String(fd.get('nis')||'').trim()||null,p_gender:fd.get('gender')||null,p_birth_place:String(fd.get('birth_place')||'').trim()||null,p_birth_date:fd.get('birth_date')||null,p_address:String(fd.get('address')||'').trim()||null,p_guardian_name:String(fd.get('guardian_name')||'').trim()||null,p_media_id:mediaId});if(q.error)throw q.error;document.getElementById('examRegModal')?.remove();toast('Peserta berhasil didaftarkan.');showExams()}catch(e2){msg.className='error';msg.textContent=err(e2)}};
  };

  window.showExams=async function(){
    page().innerHTML=`<div class="card"><div class="row"><div><h2>Ujian</h2><p class="muted">Pendaftaran, penilaian, rekap, dan kartu kendali.</p></div>${state.roles.includes('OPERATOR')||canExamManage()?'<button class="btn primary" onclick="openExamRegistrationForm()">+ Pendaftaran Ujian</button>':''}</div><div class="menu-grid"><button class="btn secondary menu-item" onclick="showExamReportsV32?showExamReportsV32():showExamReports()"><strong>Rekap Hasil Ujian</strong></button>${canExamManage()?'<button class="btn gold menu-item" onclick="openExamNumberManager()"><strong>Nomor Ujian</strong></button><button class="btn info menu-item" onclick="printExamNumbers()"><strong>Cetak Nomor Ujian</strong></button><button class="btn primary menu-item" onclick="printExamCards()"><strong>Cetak Kartu Ujian</strong></button>':''}</div></div><div id="examArea"></div>`;
    // Modul Pengujian berdiri sendiri; Ujian tidak lagi menampilkan Panel Penguji.
  };

  window.openExamNumberManager=async function(){
    
    const q=await sb.from('exam_participants').select('id,name,nis,exam_number,exam_registrations!inner(exam_type,institution_id,institutions:institution_id(name))').order('created_at',{ascending:false}).limit(1000);
    if(q.error){toast(err(q.error),'error');return}
    const rows=q.data||[];document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="examNumModal"><div class="modal-sheet"><div class="row"><div><h3>Atur Nomor Ujian</h3><div class="small muted">Nomor tidak mengikuti urutan pendaftaran. Pengurus bebas mengatur selama tidak duplikat.</div></div><button class="btn secondary" onclick="document.getElementById('examNumModal')?.remove()">Tutup</button></div><div id="examNumRows" class="list" style="margin-top:10px">${rows.map(x=>`<div class="list-item"><div class="row"><div><strong>${E(x.name)}</strong><div class="small muted">${E(x.exam_registrations?.institutions?.name||'-')} · ${E(x.exam_registrations?.exam_type||'-')}</div></div><input data-exam-id="${E(x.id)}" class="edit-number" style="max-width:130px" value="${E(x.exam_number||'')}" inputmode="numeric"></div></div>`).join('')||'<div class="empty">Belum ada peserta ujian.</div>'}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveExamNumbersV40()">Simpan Nomor</button></div></div>`);
  };
  window.saveExamNumbersV40=async function(){const inputs=[...document.querySelectorAll('#examNumRows [data-exam-id]')],seen=new Set();for(const i of inputs){const n=String(i.value||'').trim();if(!n){toast('Semua nomor ujian harus diisi.','error');return}if(seen.has(n)){toast('Ada nomor ujian yang sama.','error');return}seen.add(n);const q=await sb.rpc('update_exam_number',{p_participant_id:i.dataset.examId,p_exam_number:n});if(q.error){toast(err(q.error),'error');return}}document.getElementById('examNumModal')?.remove();toast('Nomor ujian berhasil diperbarui.');showExams()};

  // Kartu Kendali: pertahankan format awal, F4 portrait, 3 kartu/lembar,
  // foto peserta, 7 materi, nama penguji, dan ruang tanda tangan.
  // ------------------------------------------------------------
  // WISUDA: Album Kenangan, Daftar Wisuda, Cetak + nomor editable.
  // ------------------------------------------------------------
  window.openGraduationCostForm=async function(eventId){
    if(!eventId)return toast('Belum ada rangkaian Wisuda aktif.','error');
    if(!canGradManage())return toast('Anda tidak memiliki izin menetapkan biaya Wisuda.','error');
    const org=(await sb.from('organizations').select('id').eq('status','ACTIVE').limit(1).maybeSingle()).data;
    if(!org)return toast('Organisasi aktif belum tersedia.','error');
    const tq=await sb.from('tariffs').select('id,code,name,amount,unit,effective_from,effective_until,status').in('code',['WISUDA','WISUDA_SEWA']).eq('status','ACTIVE').order('effective_from',{ascending:false});
    if(tq.error)return toast(err(tq.error),'error');
    const base=(tq.data||[]).find(x=>x.code==='WISUDA')||{};const rent=(tq.data||[]).find(x=>x.code==='WISUDA_SEWA')||{};
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="gradCostModal"><div class="modal-sheet"><div class="row"><div><h3>Penetapan Biaya Wisuda</h3><div class="small muted">Master biaya dipisahkan dari pembuatan tagihan.</div></div><button class="btn secondary" onclick="document.getElementById('gradCostModal')?.remove()">Tutup</button></div><form id="gradCostForm"><div class="field"><label>Biaya Wisuda per peserta</label><input name="base" type="number" min="0" required value="${base.amount??''}"></div><div class="field"><label>Sewa Perlengkapan Wisuda per peserta</label><input name="rent" type="number" min="0" required value="${rent.amount??''}"></div><div class="small muted">Paket TANPA_SEWA memakai biaya Wisuda. Paket DENGAN_SEWA memakai keduanya.</div><button class="btn primary" style="width:100%;margin-top:12px">Simpan Penetapan Biaya</button><p id="gradCostMsg" class="small"></p></form></div></div>`);
    document.getElementById('gradCostForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('gradCostMsg');msg.textContent='Menyimpan...';const today=new Date().toISOString().slice(0,10);const a=await sb.rpc('save_tariff',{p_id:base.id||null,p_code:'WISUDA',p_name:'Biaya Wisuda',p_amount:Number(f.get('base')),p_unit:'peserta',p_effective_from:today,p_effective_until:null,p_status:'ACTIVE'});if(a.error){msg.className='error';msg.textContent=err(a.error);return}const b=await sb.rpc('save_tariff',{p_id:rent.id||null,p_code:'WISUDA_SEWA',p_name:'Sewa Perlengkapan Wisuda',p_amount:Number(f.get('rent')),p_unit:'peserta',p_effective_from:today,p_effective_until:null,p_status:'ACTIVE'});if(b.error){msg.className='error';msg.textContent=err(b.error);return}document.getElementById('gradCostModal')?.remove();toast('Penetapan biaya Wisuda berhasil disimpan.');};
  };
  window.openGraduationBillForm=async function(eventId){
    if(!eventId)return toast('Belum ada rangkaian Wisuda aktif.','error');
    if(!canGradManage())return toast('Anda tidak memiliki izin membuat tagihan Wisuda.','error');
    const regs=await sb.from('graduation_registrations').select('id,institution_id,graduation_participants(id,status)').eq('graduation_event_id',eventId).neq('status','DIBATALKAN');
    const insts=await sb.from('institutions').select('id,name').eq('status','ACTIVE').order('name');
    if(regs.error||insts.error)return toast(err(regs.error||insts.error),'error');
    const counts=new Map();for(const r of regs.data||[]){const n=(r.graduation_participants||[]).filter(p=>p.status!=='BATAL').length;if(n)counts.set(r.institution_id,(counts.get(r.institution_id)||0)+n)}
    const base=(await sb.from('tariffs').select('amount').eq('code','WISUDA').eq('status','ACTIVE').order('effective_from',{ascending:false}).limit(1).maybeSingle()).data?.amount||0;
    const rent=(await sb.from('tariffs').select('amount').eq('code','WISUDA_SEWA').eq('status','ACTIVE').order('effective_from',{ascending:false}).limit(1).maybeSingle()).data?.amount||0;
    const options=(insts.data||[]).filter(i=>counts.has(i.id)).map(i=>`<option value="${E(i.id)}" data-count="${counts.get(i.id)}">${E(i.name)} · ${counts.get(i.id)} peserta</option>`).join('');
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="gradBillModal"><div class="modal-sheet"><div class="row"><div><h3>Buat Tagihan Wisuda</h3><div class="small muted">Tagihan dibuat manual setelah peserta dan paket ditetapkan.</div></div><button class="btn secondary" onclick="document.getElementById('gradBillModal')?.remove()">Tutup</button></div><form id="gradBillForm"><div class="field"><label>Nama Lembaga</label><select name="inst" id="gradBillInst" required><option value="">Pilih lembaga</option>${options}</select></div><div class="field"><label>Jumlah Peserta Wisuda</label><input id="gradBillCount" readonly></div><div class="field"><label>Paket Wisuda</label><select name="pkg" id="gradBillPkg"><option value="TANPA_SEWA">Tanpa Sewa</option><option value="DENGAN_SEWA">Dengan Sewa</option></select></div><div class="notice"><strong>Total Tagihan:</strong> <span id="gradBillTotal">Rp0</span><div class="small muted">Biaya Wisuda ${fmt(base)} / peserta${rent?` · Sewa ${fmt(rent)} / peserta`:''}</div></div><button class="btn primary" style="width:100%;margin-top:12px">Simpan & Buat Tagihan</button><p id="gradBillMsg" class="small"></p></form></div></div>`);
    const refresh=()=>{const opt=document.querySelector('#gradBillInst option:checked'),n=Number(opt?.dataset.count||0),pkg=document.getElementById('gradBillPkg').value;document.getElementById('gradBillCount').value=n;document.getElementById('gradBillTotal').textContent=fmt(n*(Number(base||0)+(pkg==='DENGAN_SEWA'?Number(rent||0):0)))};
    gradBillInst.onchange=refresh;gradBillPkg.onchange=refresh;refresh();document.getElementById('gradBillForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('gradBillMsg');msg.textContent='Menyimpan...';const p=await sb.rpc('set_graduation_institution_package',{p_event_id:eventId,p_institution_id:f.get('inst'),p_package_code:f.get('pkg')});if(p.error){msg.className='error';msg.textContent=err(p.error);return}const b=await sb.rpc('rebuild_graduation_collective_bill',{p_event_id:eventId,p_institution_id:f.get('inst')});if(b.error){msg.className='error';msg.textContent=err(b.error);return}document.getElementById('gradBillModal')?.remove();toast('Tagihan Wisuda berhasil dibuat.');showGraduation()};
  };

  window.showGraduation=async function(){
    
    const {data:events,error}=await sb.from('graduation_events').select('id,activity_id,registration_deadline,registration_status,graduation_status,theme,motto,activities:activity_id(name)').order('registration_deadline',{ascending:false}).limit(20);
    listPage('Wisuda','Peserta Tashih yang lulus masuk otomatis; pendaftaran wisuda dikelola melalui Pengurus.','<div class="v14-toolbar no-print"><button class="btn primary" id="v40AlbumBtn">Album Kenangan</button><button class="btn gold" id="v40DaftarBtn">Daftar wisuda</button>'+(canGradManage()?' <button class="btn secondary" id="v40CostBtn">Penetapan Biaya</button><button class="btn gold" id="v40BillBtn">Buat Tagihan Wisuda</button>':'')+'<button class="btn info" id="v40CetakBtn">Cetak</button></div><div class="card"><div class="row"><h3>Peserta Wisuda</h3><span class="small muted">Nomor wisuda dapat diedit Pengurus.</span></div><div id="v40GradList" class="list">Memuat...</div></div>');
    const list=document.getElementById('v40GradList');const event=events?.[0];
    // Setiap tombol selalu membuka modul/templatnya. Data kosong hanya memengaruhi isi modul.
    document.getElementById('v40AlbumBtn').onclick=()=>showMemoryAlbum(event?.id||'');
    document.getElementById('v40DaftarBtn').onclick=async()=>{try{if(typeof window.openSpecialGraduationForm!=='function')throw new Error('Fungsi form pendaftaran wisuda belum tersedia.');await window.openSpecialGraduationForm(event?.id||'')}catch(e){console.error('[WISUDA DAFTAR]',e);toast('Form pendaftaran wisuda gagal dibuka: '+(e?.message||e),'error')}};
    if(document.getElementById('v40CostBtn'))document.getElementById('v40CostBtn').onclick=()=>openGraduationCostForm(event?.id||'');
    if(document.getElementById('v40BillBtn'))document.getElementById('v40BillBtn').onclick=()=>openGraduationBillForm(event?.id||'');
    document.getElementById('v40CetakBtn').onclick=()=>printGraduationReportV40(event?.id||'');
    if(!event){list.innerHTML='<div class="empty">Belum ada acara wisuda.</div>';return}
    const {data:regs,error:re}=await sb.from('graduation_registrations').select('id,institution_id,source_type,graduation_participants(id,name,nis,graduation_order,status,motto)').eq('graduation_event_id',event.id);
    if(re){list.innerHTML=`<p class="error">${E(err(re))}</p>`;return}
    const insts=(await sb.from('institutions').select('id,name').order('name')).data||[],im=new Map(insts.map(x=>[x.id,x.name]));
    window.editGraduationParticipant=async function(id){
      if(!canAction('graduation.participant.edit')){toast('Anda tidak memiliki izin mengedit data peserta wisuda.','error');return}
      const {data:p,error}=await sb.from('graduation_participants').select('id,name,nis,gender,birth_place,birth_date,address,guardian_name,media_id,motto,status,graduation_order,graduation_registrations:registration_id(institution_id,source_type,institutions:institution_id(name))').eq('id',id).single();
      if(error||!p){toast('Data peserta wisuda tidak ditemukan.','error');return}
      const media=p.media_id?(await sb.from('participant_media').select('storage_path').eq('id',p.media_id).maybeSingle()).data:null;
      document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="gradEditModal"><div class="modal-sheet"><div class="row"><div><h3>Edit Data Peserta Wisuda</h3><div class="small muted">${E(p.graduation_registrations?.institutions?.name||'-')} · ${p.graduation_registrations?.source_type==='SPECIAL'?'Wisuda khusus':'Dari Tashih'}</div></div><button class="btn secondary" onclick="document.getElementById('gradEditModal')?.remove()">Tutup</button></div><form id="gradEditForm"><div class="grid grid2"><div class="field"><label>Nama peserta</label><input name="name" required value="${E(p.name||'')}"></div><div class="field"><label>NIS</label><input name="nis" value="${E(p.nis||'')}"></div><div class="field"><label>Jenis kelamin</label><select name="gender"><option value="">Pilih</option><option value="L" ${p.gender==='L'?'selected':''}>Laki-laki</option><option value="P" ${p.gender==='P'?'selected':''}>Perempuan</option></select></div><div class="field"><label>Tempat lahir</label><input name="birth_place" value="${E(p.birth_place||'')}"></div><div class="field"><label>Tanggal lahir</label><input name="birth_date" type="date" value="${E(p.birth_date||'')}"></div><div class="field"><label>Nama wali</label><input name="guardian_name" value="${E(p.guardian_name||'')}"></div></div><div class="field"><label>Alamat</label><textarea name="address">${E(p.address||'')}</textarea></div><div class="field"><label>Motto</label><textarea name="motto">${E(p.motto||'')}</textarea></div><div class="field"><label>Foto peserta</label><input id="gradEditPhoto" name="photo" type="file" accept="image/*"><div id="gradEditPreview" style="margin-top:8px">${media?.storage_path?`<img src="${E(media.storage_path)}" style="width:90px;height:115px;object-fit:cover;border-radius:10px;border:1px solid #ccc">`:''}</div><div class="small muted">Kosongkan jika foto tidak diganti.</div></div><button class="btn primary" style="width:100%">Simpan Perubahan</button><p id="gradEditMsg" class="small"></p></form></div></div>`);
      const f=document.getElementById('gradEditForm'),photo=document.getElementById('gradEditPhoto'),preview=document.getElementById('gradEditPreview');
      photo.onchange=e=>{const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>preview.innerHTML=`<img src="${E(r.result)}" style="width:90px;height:115px;object-fit:cover;border-radius:10px;border:1px solid #ccc">`;r.readAsDataURL(file)};

<script id="v173-dashboard-authoritative">
(function(){
'use strict';
const E=window.esc||((v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const homeCounters=[['Lembaga','institutions'],['Kegiatan','activities'],['Tagihan','bills'],['Pembayaran','payments'],['Peserta Wisuda','graduation_participants'],['Notifikasi','notifications']];
const quick=[['Kegiatan','activities'],['Ujian','exams'],['Wisuda','graduation'],['Keuangan','finance'],['Sekretariat','secretariat'],['Laporan','reports']];
const detailTitles={institutions:'Detail Lembaga',activities:'Detail Kegiatan',bills:'Detail Tagihan',payments:'Detail Pembayaran',graduation_participants:'Detail Peserta Wisuda',notifications:'Detail Notifikasi'};
const detailRows={};
window.closeDashboardDetail=function(){document.getElementById('v173DashboardDetail')?.remove()};
function renderRows(key,rows){
 const render={
  institutions:x=>`<div><strong>${E(x.name||'-')}</strong><div class="small muted">${E(x.address||'-')} · ${E(x.status||'-')}</div></div>`,
  activities:x=>`<div><strong>${E(x.name||'-')}</strong><div class="small muted">${E(x.theme||'')} · ${E(x.venue||'-')} · ${x.start_at?date(x.start_at):'-'}${x.status?' · '+E(x.status):''}</div>${x.description?`<div class="small" style="margin-top:5px">${E(x.description)}</div>`:''}</div>`,
  bills:x=>`<div><div class="row"><strong>${E(x.bill_number||x.id||'-')}</strong><span class="status">${E(x.status||'-')}</span></div><div class="small muted">${date(x.bill_date)} · Jatuh tempo ${date(x.due_date)}</div><div class="small" style="margin-top:4px">Total ${fmt(x.total_amount)} · Terbayar ${fmt(x.paid_amount)} · Sisa ${fmt(x.outstanding_amount)}</div>${x.institution_name?`<div class="small muted" style="margin-top:4px">Lembaga: ${E(x.institution_name)}</div>`:''}</div>`,
  payments:x=>`<div class="v228-data-row"><div class="v228-main"><div><strong>${E(x.payment_number||x.id||'-')}</strong><div class="v228-meta">${E(x.institution_name||'Lembaga')} · ${date(x.payment_date)} · ${E(x.payment_method||'-')}</div><div class="v228-meta">Tagihan: ${E(x.bill_number||'-')} · Diterima oleh: ${E(x.received_name||'-')}</div></div><span class="status">${E(x.status||'-')}</span></div><div class="v228-amount">Jumlah ${fmt(x.amount)}</div>${x.notes?`<div class="v228-meta">Keterangan: ${E(x.notes)}</div>`:''}</div>`,
  graduation_participants:x=>`<div><div class="row"><strong>${E(x.name||'-')}</strong><span class="status">${E(x.status||'-')}</span></div><div class="small muted">NIS ${E(x.nis||'-')} · Urutan ${E(x.graduation_order??'-')}</div>${x.registration_number?`<div class="small" style="margin-top:4px">${E(x.registration_number)}</div>`:''}</div>`,
  notifications:x=>`<div><strong>${E(x.title||'Notifikasi')}</strong><div class="small muted">${date(x.created_at)} · ${E(x.type||'')}</div><div class="small" style="margin-top:5px">${E(x.message||'-')}</div></div>`
 };
 return rows.length?rows.map(x=>`<div class="v173-dashboard-detail-row">${render[key]?render[key](x):E(x.name||x.title||x.id||'-')}</div>`).join(''):'<div class="v173-dashboard-detail-empty">Belum ada data yang dapat ditampilkan.</div>';
}
function applyFilter(key){
 const input=document.getElementById('v173DashboardDetailSearch'),body=document.getElementById('v173DashboardDetailBody');
 if(!body)return;
 const q=String(input?.value||'').trim().toLowerCase();
 const rows=(detailRows[key]||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));
 body.innerHTML=renderRows(key,rows);
 const count=document.getElementById('v173DashboardDetailCount');if(count)count.textContent=q?`${rows.length} data ditemukan`:`${(detailRows[key]||[]).length} data`;
}
async function fetchDashboardDetail(key){
 if(key==='institutions'){
  const q=await sb.from('institutions').select('id,name,address,status').order('name').limit(200); return q;
 }
 if(key==='activities'){
  return await sb.from('activities').select('id,name,theme,start_at,end_at,venue,status,description').order('start_at',{ascending:false}).limit(200);
 }
 if(key==='bills'){
  const b=await sb.from('bills').select('id,bill_number,institution_id,bill_date,due_date,total_amount,status').order('bill_date',{ascending:false}).limit(200);
  if(b.error)return b;
  const rows=b.data||[];
  const ids=[...new Set(rows.map(x=>x.id).filter(Boolean))];
  const instIds=[...new Set(rows.map(x=>x.institution_id).filter(Boolean))];
  const [pay,inst]=await Promise.all([
   ids.length?sb.from('payments').select('bill_id,amount,status').in('bill_id',ids):Promise.resolve({data:[],error:null}),
   instIds.length?sb.from('institutions').select('id,name').in('id',instIds):Promise.resolve({data:[],error:null})
  ]);
  if(pay.error)return pay;
  if(inst.error)return inst;
  const paidMap=new Map();(pay.data||[]).forEach(x=>{if(x.status==='CONFIRMED')paidMap.set(x.bill_id,(paidMap.get(x.bill_id)||0)+Number(x.amount||0))});
  const instMap=new Map((inst.data||[]).map(x=>[x.id,x.name]));
  rows.forEach(x=>{x.paid_amount=paidMap.get(x.id)||0;x.outstanding_amount=Math.max(Number(x.total_amount||0)-x.paid_amount,0);x.institution_name=instMap.get(x.institution_id)||''});
  return {data:rows,error:null};
 }
 if(key==='payments'){
  const p=await sb.from('payments').select('id,payment_number,payment_date,amount,status,payment_method,received_by,notes,bill_id').order('payment_date',{ascending:false}).limit(200);
  if(p.error)return p;
  const rows=p.data||[];
  const billIds=[...new Set(rows.map(x=>x.bill_id).filter(Boolean))];
  const profileIds=[...new Set(rows.map(x=>x.received_by).filter(Boolean))];
  const [bills,profiles]=await Promise.all([
   billIds.length?sb.from('bills').select('id,bill_number,institution_id').in('id',billIds):Promise.resolve({data:[],error:null}),
   profileIds.length?sb.from('profiles').select('id,full_name').in('id',profileIds):Promise.resolve({data:[],error:null})
  ]);
  if(bills.error)return bills;
  if(profiles.error)return profiles;
  const billMap=new Map((bills.data||[]).map(x=>[x.id,x]));
  const instIds=[...new Set((bills.data||[]).map(x=>x.institution_id).filter(Boolean))];
  const inst=instIds.length?await sb.from('institutions').select('id,name').in('id',instIds):{data:[],error:null};
  if(inst.error)return inst;
  const instMap=new Map((inst.data||[]).map(x=>[x.id,x.name]));
  const profileMap=new Map((profiles.data||[]).map(x=>[x.id,x.full_name]));
  rows.forEach(x=>{const b=billMap.get(x.bill_id)||{};x.bill_number=b.bill_number||'';x.institution_name=instMap.get(b.institution_id)||'';x.received_name=profileMap.get(x.received_by)||''});
  return {data:rows,error:null};
 }
 if(key==='graduation_participants'){
  const p=await sb.from('graduation_participants').select('id,name,nis,status,graduation_order,registration_id').order('name').limit(200);
  if(p.error)return p;
  const rows=p.data||[];const ids=[...new Set(rows.map(x=>x.registration_id).filter(Boolean))];
  if(ids.length){const r=await sb.from('graduation_registrations').select('id,registration_number').in('id',ids);if(r.error)return r;const m=new Map((r.data||[]).map(x=>[x.id,x.registration_number]));rows.forEach(x=>x.registration_number=m.get(x.registration_id)||'')}
  return {data:rows,error:null};
 }
 if(key==='notifications')return await sb.from('notifications').select('id,title,message,type,created_at,read_at').order('created_at',{ascending:false}).limit(200);
 return {data:[],error:null};
}
window.openDashboardDetail=async function(key){
 const title=detailTitles[key]||'Detail';
 window.closeDashboardDetail();
 document.body.insertAdjacentHTML('beforeend',`<div class="v173-dashboard-detail" id="v173DashboardDetail"><section class="v173-dashboard-detail-sheet" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="v173-dashboard-detail-head"><div class="v173-dashboard-detail-top"><div><div class="v173-dashboard-detail-title">${E(title)}</div><div id="v173DashboardDetailCount" class="small muted">Memuat data…</div></div><button class="btn secondary" type="button" onclick="closeDashboardDetail()">Tutup</button></div><div class="v173-dashboard-detail-tools"><input id="v173DashboardDetailSearch" type="search" placeholder="Cari data…" autocomplete="off"><button class="btn secondary" type="button" onclick="document.getElementById('v173DashboardDetailSearch').value='';applyDashboardDetailFilter()">Reset</button></div></div><div id="v173DashboardDetailBody" class="v173-dashboard-detail-body"><div class="muted">Memuat…</div></div></section></div>`);
 window.applyDashboardDetailFilter=()=>applyFilter(key);
 document.getElementById('v173DashboardDetailSearch')?.addEventListener('input',window.applyDashboardDetailFilter);
 const body=document.getElementById('v173DashboardDetailBody');
 try{const q=await fetchDashboardDetail(key);if(q.error)throw q.error;detailRows[key]=q.data||[];applyFilter(key)}
 catch(e){console.error('[Dashboard detail]',key,e);body.innerHTML=`<div class="error">Data belum dapat dimuat. ${E(e?.message||'Periksa koneksi atau struktur data.')}</div>`;document.getElementById('v173DashboardDetailCount').textContent='Gagal memuat data'}
};
window.showHome=async function(){
 const host=document.getElementById('page');if(!host)return;
 const name=state.profile?.full_name||state.user?.email||'Pengguna';
 const role=typeof primaryRole==='function'?roleLabel(primaryRole()):'Pengguna';
 const status=state.profile?.status||'ACTIVE';
 const counters=homeCounters.map(x=>`<button type="button" class="card v75-dashboard-counter" data-dashboard-detail="${E(x[1])}" aria-label="Lihat detail ${E(x[0])}"><div class="v173-counter-title">${E(x[0])}</div><div class="metric v173-counter-number" id="metric-${E(x[1])}">…</div><div class="v173-counter-help">Ringkasan data saat ini</div><div class="v173-counter-detail">Ketuk untuk detail</div></button>`).join('');
 const quickHtml='<div class="module-card-grid">'+quick.map(x=>'<button class="btn secondary menu-item quick-module module-card-btn" type="button" onclick="navigate(\''+x[1]+'\')"><strong>'+E(x[0])+'</strong></button>').join('')+'</div>';
 host.innerHTML='<div class="card hero v35-welcome"><div style="font-size:14px;color:#6b7c70;font-weight:700">Assalamu\'alaikum Wr. Wb.</div><h2 class="v41-user-name" style="margin:6px 0 2px">'+E(name)+'</h2><div class="row" style="justify-content:flex-start;gap:8px;margin:6px 0 10px"><span class="status ok">'+E(role)+'</span><span class="status '+(status==='ACTIVE'?'ok':'bad')+'">'+E(status==='ACTIVE'?'Aktif':status)+'</span></div><p class="v35-message" style="margin:8px 0 4px">Selamat datang di Sistem Informasi BK FUSPAQ NU.</p><p class="small muted" style="margin:0">'+E(typeof greeting==='function'?greeting():'Akses mengikuti peran dan kewenangan akun.')+'</p></div><div class="v75-dashboard-counters">'+counters+'</div><div class="card"><div class="row"><h3 style="margin:0">Akses cepat</h3><span class="status ok">'+E((state.roles||[]).map(roleLabel).join(' · ')||'Pengguna')+'</span></div><div class="menu-grid" style="margin-top:10px">'+quickHtml+'</div></div>';
 host.querySelectorAll('[data-dashboard-detail]').forEach(card=>card.addEventListener('click',()=>openDashboardDetail(card.dataset.dashboardDetail)));
 try{if(typeof loadMetrics==='function')await loadMetrics()}catch(e){console.warn('[Dashboard metrics]',e)}
};
})();
</script>

<script id="v97-final-module-repair">
(function(){
  const E=window.esc||((v)=>String(v??''));
  const msgErr=e=>window.friendlyError?window.friendlyError(e):(e?.message||'Terjadi kesalahan.');
  const say=(m,t)=>window.toast?window.toast(m,t):window.bkAlert?window.bkAlert(m):window.bkAlert(m);
  const canDo=p=>typeof window.can==='function'&&window.can(p);
  const isChair=()=>Array.isArray(state?.roles)&&state.roles.includes('KETUA');

  /* ============================================================
     DATA PENGURUS
     Sumber tunggal: management_people.
     Tidak bergantung pada profiles/Auth.
     ============================================================ */
  /* V123 CANONICAL MODULE IMPLEMENTATIONS: direct replacements, no wrapper chaining. */
  async function v123IsRole(code){
    if(Array.isArray(state.roles)&&state.roles.some(x=>String(x).toUpperCase()===String(code).toUpperCase())) return true;
    const pid=state.profile?.id; if(!pid)return false;
    try{
      const q=await sb.from('management_members').select('user_id,role_id,roles:role_id(code),status').eq('status','ACTIVE').or(`user_id.eq.${pid}`);
      return (q.data||[]).some(x=>String(x.roles?.code||'').toUpperCase()===String(code).toUpperCase());

(function(){

  document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="v126MgmtModal"><div class="modal-sheet"><div class="row"><h3>${edit?'Edit Pengurus':'Tambah Pengurus'}</h3><button class="btn secondary" type="button" onclick="document.getElementById('v126MgmtModal')?.remove()">Tutup</button></div><div class="small muted">${edit?'Edit data pengurus. Jika akun belum ada, isi email dan password untuk membuat akun.':'Pendaftaran Pengurus sekaligus pembuatan akun login.'}</div><form id="v126MgmtForm">
