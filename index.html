const dashboardGreeting=()=>({KETUA:'Semoga amanah dalam memimpin, mengayomi lembaga, dan menjaga kemaslahatan bersama.',SEKRETARIS:'Semoga dimudahkan dalam mengelola administrasi, agenda, surat, dan tugas kesekretariatan.',BENDAHARA:'Semoga dimudahkan dalam menjaga amanah kas, pembayaran, pemasukan, pengeluaran, dan laporan keuangan.',ANGGOTA:'Semoga dimudahkan dalam menjalankan tugas pengurus dan memberikan manfaat bagi BK FUSPAQ NU.',OPERATOR:'Semoga dimudahkan dalam melayani lembaga, peserta didik, ujian, wisuda, dan administrasi lembaga.'}[dashboardPrimaryRole()]||'Semoga kehadiran Anda membawa manfaat dan kemudahan dalam menjalankan amanah.');
const quickByRole={
 KETUA:[['Keuangan','finance'],['Pembayaran','payments'],['Pengujian','pengujian'],['Kegiatan','activities'],['Home','home'],['Pengaturan','settings']],
 SEKRETARIS:[['Kegiatan','activities'],['Ujian','exams'],['Pengujian','pengujian'],['Wisuda','graduation'],['Lembaga','institutions'],['Home','home']],
 BENDAHARA:[['Pembayaran','payments'],['Keuangan','finance'],['Distribusi','distribution'],['Laporan','reports'],['Lembaga','institutions'],['Notifikasi','notifications']],
 ANGGOTA:[['Ujian','exams'],['Pengujian','pengujian'],['Wisuda','graduation'],['Lembaga','institutions'],['Home','home'],['Notifikasi','notifications']],
 OPERATOR:[['Keuangan','finance'],['Kegiatan','activities'],['Home','home'],['Wisuda','graduation'],['Lembaga','institutions']]
};
const detailTitles={institutions:'Detail Lembaga',activities:'Detail Kegiatan',bills:'Detail Tagihan',payments:dashboardPrimaryRole()==='OPERATOR'?'Pembayaran Lembaga Saya':'Detail Pembayaran',graduation_participants:'Detail Peserta Wisuda',notifications:'Detail Notifikasi'};
const detailRows={};
window.closeDashboardDetail=function(){document.getElementById('v173DashboardDetail')?.remove()};
function renderRows(key,rows){
 const render={
  institutions:x=>`<div><strong>${E(x.name||'-')}</strong><div class="small muted">${E(x.address||'-')} · ${E(x.status||'-')}</div></div>`,
  activities:x=>`<div><div class="row"><strong>${E(x.name||'Nama kegiatan belum diisi')}</strong><span class="status">${E(x.status||'Status belum diisi')}</span></div>${x.activity_number?`<div class="small muted">Nomor kegiatan: ${E(x.activity_number)}</div>`:''}${x.theme?`<div class="small">Tema/Judul: ${E(x.theme)}</div>`:''}<div class="small muted">Tempat pelaksanaan: ${E(x.venue||'-')}</div><div class="small muted">Waktu mulai: ${x.start_at?date(x.start_at):'-'} · Waktu selesai: ${x.end_at?date(x.end_at):'-'}</div>${x.activity_type_name?`<div class="small muted">Jenis kegiatan: ${E(x.activity_type_name)}</div>`:''}${x.host_institution_name?`<div class="small muted">Lembaga pelaksana: ${E(x.host_institution_name)}</div>`:''}${x.person_in_charge_name?`<div class="small muted">Penanggung jawab: ${E(x.person_in_charge_name)}</div>`:''}<div class="small muted">Publikasi: ${x.is_published?'Dipublikasikan':'Tidak dipublikasikan'}</div>${x.description?`<div class="small" style="margin-top:5px;white-space:pre-line"><strong>Keterangan:</strong> ${E(x.description)}</div>`:''}</div>`,
  bills:x=>`<div><div class="row"><strong>${E(x.bill_number||x.id||'-')}</strong><span class="status">${E(x.status||'-')}</span></div><div class="small muted">${date(x.bill_date)} · Jatuh tempo ${date(x.due_date)}</div><div class="small" style="margin-top:4px">Total ${fmt(x.total_amount)} · Terbayar ${fmt(x.paid_amount)} · Sisa ${fmt(x.outstanding_amount)}</div>${x.institution_name?`<div class="small muted" style="margin-top:4px">Lembaga: ${E(x.institution_name)}</div>`:''}</div>`,
  payments:x=>`<div class="v228-data-row"><div class="v228-main"><div><strong>${E(x.institution_name||'Lembaga')}</strong><div class="v228-meta">No. Pembayaran: ${E(x.payment_number||x.id||'-')} · ${date(x.payment_date)} · ${E(x.payment_method||'-')}</div><div class="v228-meta">Tagihan: ${E(x.bill_number||'-')}</div></div><span class="status">${E(x.status||'-')}</span></div><div class="v228-meta"><strong>Rincian item:</strong> ${E(x.item_description||'-')} · Jumlah item: ${E(x.item_quantity??1)}</div><div class="v228-amount">Jumlah pembayaran ${fmt(x.amount)}</div>${x.notes?`<div class="v228-meta">Keterangan: ${E(x.notes)}</div>`:''}</div>`,
  graduation_participants:x=>`<div><div class="row"><strong>${E(x.name||'-')}</strong><span class="status">${E(x.status||'-')}</span></div><div class="small muted">NIS ${E(x.nis||'-')} · Urutan ${E(x.graduation_order??'-')}</div>${x.registration_number?`<div class="small" style="margin-top:4px">${E(x.registration_number)}</div>`:''}</div>`,
  notifications:x=>`<div><div class="row"><strong>${E(x.title||'Notifikasi')}</strong><span class="status ${x.read_at?'':'ok'}">${x.read_at?'Sudah dibaca':'Belum dibaca'}</span></div><div class="small muted">${date(x.created_at)} · ${E(x.type||'')}</div>${x.institution_name?`<div class="small muted" style="margin-top:5px">Lembaga: ${E(x.institution_name)}</div>`:''}${x.item_name?`<div class="small muted">Item: ${E(x.item_name)}</div>`:''}<div class="small" style="margin-top:7px;white-space:pre-line;overflow-wrap:anywhere;word-break:break-word">${E(x.message||'-')}</div></div>`
 };
 return rows.length?rows.map(x=>`<div class="v173-dashboard-detail-row">${render[key]?render[key](x):E(x.name||x.title||x.id||'-')}</div>`).join(''):'<div class="v173-dashboard-detail-empty">Belum ada data yang dapat ditampilkan.</div>';
}
function applyFilter(key){
 const input=document.getElementById('v173DashboardDetailSearch'),body=document.getElementById('v173DashboardDetailBody');
 if(!body)return;
 const q=String(input?.value||'').trim().toLowerCase();
 const rows=(detailRows[key]||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));
 body.innerHTML=renderRows(key,rows);
 const count=document.getElementById('v173DashboardDetailCount');if(count)count.textContent=q?`${rows.length} data ditemukan`:`${(detailRows[key]||[]).length} data`;
}
async function fetchDashboardDetail(key){
 const isOperator=Array.isArray(state.roles)&&state.roles.includes('OPERATOR');
 const ownInst=isOperator?await window.bkfOperatorInstitutionId():null;
 if(isOperator&&!ownInst)return {data:[],error:{message:'Lembaga akun Operator belum terhubung.'}};
 if(key==='institutions'){
  let q=sb.from('institutions').select('id,name,address,status').eq('status','ACTIVE').order('name').limit(200); return q;
 }
 if(key==='activities'){
  let q=sb.from('activities').select('id,activity_number,name,theme,start_at,end_at,venue,status,description,is_published,activity_type_id,host_institution_id,person_in_charge').order('start_at',{ascending:false}).limit(200);if(isOperator)q=q.eq('host_institution_id',ownInst);q=await q;if(q.error)return q;const rows=q.data||[];const typeIds=[...new Set(rows.map(x=>x.activity_type_id).filter(Boolean))],instIds=[...new Set(rows.map(x=>x.host_institution_id).filter(Boolean))],personIds=[...new Set(rows.map(x=>x.person_in_charge).filter(Boolean))];const [types,insts,people]=await Promise.all([typeIds.length?sb.from('activity_types').select('id,name').in('id',typeIds):Promise.resolve({data:[],error:null}),instIds.length?sb.from('institutions').select('id,name').in('id',instIds):Promise.resolve({data:[],error:null}),personIds.length?sb.from('profiles').select('id,full_name').in('id',personIds):Promise.resolve({data:[],error:null})]);if(types.error)return types;if(insts.error)return insts;if(people.error)return people;const tm=new Map((types.data||[]).map(x=>[x.id,x.name])),im=new Map((insts.data||[]).map(x=>[x.id,x.name])),pm=new Map((people.data||[]).map(x=>[x.id,x.full_name]));rows.forEach(x=>{x.activity_type_name=tm.get(x.activity_type_id)||'';x.host_institution_name=im.get(x.host_institution_id)||'';x.person_in_charge_name=pm.get(x.person_in_charge)||''});return {data:rows,error:null};
 }
 if(key==='bills'){
  let billQuery=sb.from('bills').select('id,bill_number,institution_id,bill_date,due_date,total_amount,status').order('bill_date',{ascending:false}).limit(200);if(isOperator)billQuery=billQuery.eq('institution_id',ownInst);const b=await billQuery;
  if(b.error)return b;
  const rows=b.data||[];
  const ids=[...new Set(rows.map(x=>x.id).filter(Boolean))];
  const instIds=[...new Set(rows.map(x=>x.institution_id).filter(Boolean))];
  const [pay,inst]=await Promise.all([
   ids.length?sb.from('payments').select('bill_id,amount,status').in('bill_id',ids):Promise.resolve({data:[],error:null}),
   instIds.length?sb.from('institutions').select('id,name').in('id',instIds):Promise.resolve({data:[],error:null})
  ]);
  if(pay.error)return pay;
  if(inst.error)return inst;
  const paidMap=new Map();(pay.data||[]).forEach(x=>{if(x.status==='CONFIRMED')paidMap.set(x.bill_id,(paidMap.get(x.bill_id)||0)+Number(x.amount||0))});
  const instMap=new Map((inst.data||[]).map(x=>[x.id,x.name]));
  rows.forEach(x=>{x.paid_amount=paidMap.get(x.id)||0;x.outstanding_amount=Math.max(Number(x.total_amount||0)-x.paid_amount,0);x.institution_name=instMap.get(x.institution_id)||''});
  return {data:rows,error:null};
 }
 if(key==='payments'){
  const p=await sb.from('payments').select('id,payment_number,payment_date,amount,status,payment_method,received_by,notes,bill_id').order('payment_date',{ascending:false}).limit(200);
  if(p.error)return p;
  const rows=p.data||[];
  const billIds=[...new Set(rows.map(x=>x.bill_id).filter(Boolean))];
  const profileIds=[...new Set(rows.map(x=>x.received_by).filter(Boolean))];
  let paymentBillQuery=sb.from('bills').select('id,bill_number,institution_id').in('id',billIds);if(isOperator)paymentBillQuery=paymentBillQuery.eq('institution_id',ownInst);
  const [bills,profiles]=await Promise.all([
   billIds.length?paymentBillQuery:Promise.resolve({data:[],error:null}),
   profileIds.length?sb.from('profiles').select('id,full_name').in('id',profileIds):Promise.resolve({data:[],error:null})
  ]);
  if(bills.error)return bills;
  if(profiles.error)return profiles;
  const itemQ=billIds.length?await sb.from('bill_items').select('bill_id,description,quantity,unit_price,subtotal').in('bill_id',billIds).order('id',{ascending:true}):{data:[],error:null};if(itemQ.error)return itemQ;const itemMap=new Map();(itemQ.data||[]).forEach(x=>{if(!itemMap.has(x.bill_id))itemMap.set(x.bill_id,[]);itemMap.get(x.bill_id).push(x)});
  const billMap=new Map((bills.data||[]).map(x=>[x.id,x]));if(isOperator){const allowedBills=new Set((bills.data||[]).map(x=>x.id));rows.splice(0,rows.length,...rows.filter(x=>allowedBills.has(x.bill_id)));}
  const instIds=[...new Set((bills.data||[]).map(x=>x.institution_id).filter(Boolean))];
  const inst=instIds.length?await sb.from('institutions').select('id,name').in('id',instIds):{data:[],error:null};
  if(inst.error)return inst;
  const instMap=new Map((inst.data||[]).map(x=>[x.id,x.name]));
  const profileMap=new Map((profiles.data||[]).map(x=>[x.id,x.full_name]));
  rows.forEach(x=>{const b=billMap.get(x.bill_id)||{};const its=itemMap.get(x.bill_id)||[];x.bill_number=b.bill_number||'';x.institution_name=instMap.get(b.institution_id)||'';x.bill_items=its;x.item_description=its.map(it=>it.description||'-').filter(Boolean).join(' · ')||'';x.item_quantity=its.reduce((n,it)=>n+Number(it.quantity??1),0)||1;x.received_name=profileMap.get(x.received_by)||''});
  return {data:rows,error:null};
 }
 if(key==='graduation_participants'){
  const p=await sb.from('graduation_participants').select('id,name,nis,status,graduation_order,registration_id').order('name').limit(200);
  if(p.error)return p;
  const rows=p.data||[];const ids=[...new Set(rows.map(x=>x.registration_id).filter(Boolean))];
  if(ids.length){let rQuery=sb.from('graduation_registrations').select('id,registration_number,institution_id').in('id',ids);if(isOperator)rQuery=rQuery.eq('institution_id',ownInst);const r=await rQuery;if(r.error)return r;const allowedRegs=new Set((r.data||[]).map(x=>x.id));if(isOperator)rows.splice(0,rows.length,...rows.filter(x=>allowedRegs.has(x.registration_id)));const m=new Map((r.data||[]).map(x=>[x.id,x.registration_number]));rows.forEach(x=>x.registration_number=m.get(x.registration_id)||'')}
  return {data:rows,error:null};
 }
 if(key==='notifications'){
  const pid=state.profile?.id;
  if(!pid)return {data:[],error:{message:'Profil akun belum tersedia.'}};
  // V273: sumber detail dashboard disamakan dengan modul Notifikasi utama.
  const q=await sb.from('notifications').select('id,title,message,type,read_at,created_at,related_table,related_id,event_scope,event_type,activity_id,institution_id,item_name').eq('user_id',pid).order('created_at',{ascending:false}).limit(200);
  if(q.error)return q;
  const ids=[...new Set((q.data||[]).map(x=>x.institution_id).filter(Boolean))];
  if(ids.length){const iq=await sb.from('institutions').select('id,name').in('id',ids);if(iq.error)return iq;const im=new Map((iq.data||[]).map(x=>[x.id,x.name]));(q.data||[]).forEach(x=>x.institution_name=im.get(x.institution_id)||'')}
  return q;
 }
 return {data:[],error:null};
}
window.openDashboardDetail=async function(key){
 const title=detailTitles[key]||'Detail';
 window.closeDashboardDetail();
 document.body.insertAdjacentHTML('beforeend',`<div class="v173-dashboard-detail" id="v173DashboardDetail"><section class="v173-dashboard-detail-sheet" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="v173-dashboard-detail-head"><div class="v173-dashboard-detail-top"><div><div class="v173-dashboard-detail-title">${E(title)}</div><div id="v173DashboardDetailCount" class="small muted">Memuat data…</div></div><button class="btn secondary" type="button" onclick="closeDashboardDetail()">Tutup</button></div><div class="v173-dashboard-detail-tools"><input id="v173DashboardDetailSearch" type="search" placeholder="Cari data…" autocomplete="off"><button class="btn secondary" type="button" onclick="document.getElementById('v173DashboardDetailSearch').value='';applyDashboardDetailFilter()">Reset</button></div></div><div id="v173DashboardDetailBody" class="v173-dashboard-detail-body"><div class="muted">Memuat…</div></div></section></div>`);
 window.applyDashboardDetailFilter=()=>applyFilter(key);
 document.getElementById('v173DashboardDetailSearch')?.addEventListener('input',window.applyDashboardDetailFilter);
 const body=document.getElementById('v173DashboardDetailBody');
 try{const q=await fetchDashboardDetail(key);if(q.error)throw q.error;detailRows[key]=q.data||[];applyFilter(key)}
 catch(e){console.error('[Dashboard detail]',key,e);body.innerHTML=`<div class="error">Data belum dapat dimuat. ${E(e?.message||'Periksa koneksi atau struktur data.')}</div>`;document.getElementById('v173DashboardDetailCount').textContent='Gagal memuat data'}
};
window.showHome=async function(){
 const host=document.getElementById('page');if(!host)return;
 const name=state.profile?.full_name||state.user?.email||'Pengguna';
 const role=roleLabel(dashboardPrimaryRole());
 const status=state.profile?.status||'ACTIVE';
 const anggotaPengurus=Array.isArray(state?.roles)&&state.roles.includes('ANGGOTA');
 const visibleCounters=homeCounters.filter(x=>!(anggotaPengurus&&(x[1]==='bills'||x[1]==='payments')));
 const counters=visibleCounters.map(x=>`<button type="button" class="card v75-dashboard-counter" data-dashboard-detail="${E(x[1])}" aria-label="Lihat detail ${E(x[0])}"><div class="v173-counter-title">${E(x[0])}</div><div class="metric v173-counter-number" id="metric-${E(x[1])}">…</div><div class="v173-counter-help">Ringkasan data saat ini</div><div class="v173-counter-detail">Ketuk untuk detail</div></button>`).join('');
 const roleQuick=quickByRole[dashboardPrimaryRole()]||quickByRole.ANGGOTA||[];
 const quickHtml='<div class="module-card-grid">'+roleQuick.map(x=>'<button class="btn secondary menu-item quick-module module-card-btn" type="button" onclick="navigate(\''+x[1]+'\')"><strong>'+E(x[0])+'</strong></button>').join('')+'</div>';
 host.innerHTML='<div class="card hero v35-welcome"><div style="font-size:14px;color:#6b7c70;font-weight:700">Assalamu\'alaikum Wr. Wb.</div><h2 class="v41-user-name" style="margin:6px 0 2px">'+E(name)+'</h2><div class="row" style="justify-content:flex-start;gap:8px;margin:6px 0 10px"><span class="status ok">'+E(role)+'</span><span class="status '+(status==='ACTIVE'?'ok':'bad')+'">'+E(status==='ACTIVE'?'Aktif':status)+'</span></div><p class="v35-message" style="margin:8px 0 4px">Selamat datang di Sistem Informasi BK FUSPAQ NU.</p><p class="small muted" style="margin:0">'+E(dashboardGreeting())+'</p></div><div class="v75-dashboard-counters">'+counters+'</div><div class="card"><div class="row"><h3 style="margin:0">Akses cepat</h3><span class="status ok">'+E((state.roles||[]).map(roleLabel).join(' · ')||'Pengguna')+'</span></div><div class="menu-grid" style="margin-top:10px">'+quickHtml+'</div></div>';
 host.querySelectorAll('[data-dashboard-detail]').forEach(card=>card.addEventListener('click',()=>openDashboardDetail(card.dataset.dashboardDetail)));
 try{if(typeof loadMetrics==='function')await loadMetrics()}catch(e){console.warn('[Dashboard metrics]',e)}
};
})();

    }catch(e){el.innerHTML=`<div class="error">${E(msgErr(e))}</div>`}
  };
  window.v97DeleteActivity=async function(id){if(!id)return;if(!(await window.bkfSystemConfirm('Hapus kegiatan ini? Data turunan yang mengikuti aturan database dapat ikut terhapus.')))return;try{const q=await sb.rpc('delete_activity',{p_id:id});if(q.error)throw q.error;say('Kegiatan berhasil dihapus.','success');await window.showActivities()}catch(e){say(msgErr(e),'error')}};

  window.openCashForm2=async function(id=''){
    const cats=(await sb.from('finance_categories').select('id,name,category_type').eq('is_active',true).order('name')).data||[];
    let x={}; if(id){const q=await sb.from('cash_transactions').select('id,transaction_date,transaction_type,category_id,amount,description').eq('id',id).maybeSingle();if(q.error||!q.data)return toast('Transaksi kas tidak ditemukan.','error');x=q.data}
    const initialType=x.transaction_type==='EXPENSE'?'EXPENSE':'INCOME';
    const categoryOptions=(type,selectedId='')=>{const filtered=cats.filter(c=>c.category_type===type);return filtered.length?filtered.map(c=>`<option value="${c.id}" ${selectedId===c.id?'selected':''}>${E(c.name)}</option>`).join(''):'<option value="">Belum ada kategori aktif untuk jenis transaksi ini</option>'};
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="cash2"><div class="modal-sheet"><div class="row"><h3>${id?'Edit transaksi kas':'Catat transaksi kas'}</h3><button class="btn neutral" type="button" onclick="document.getElementById('cash2')?.remove()">Tutup</button></div><form id="cash2form"><div class="field"><label>Jenis transaksi</label><select name="type"><option value="INCOME" ${initialType==='INCOME'?'selected':''}>Kas masuk</option><option value="EXPENSE" ${initialType==='EXPENSE'?'selected':''}>Kas keluar</option></select></div><div class="field"><label>Kategori</label><select name="cat" required>${categoryOptions(initialType,x.category_id||'')}</select></div><div class="grid grid2"><div class="field"><label>Tanggal</label><input name="date" type="date" required value="${x.transaction_date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Jumlah</label><input name="amount" type="number" min="1" required value="${x.amount??''}"></div></div><div class="field"><label>Keterangan</label><textarea name="desc" required>${E(x.description||'')}</textarea></div><button class="btn primary" style="width:100%">${id?'Simpan Perubahan':'Simpan Transaksi'}</button><p id="cash2msg" class="small"></p></form></div></div>`);
    const cashForm=document.getElementById('cash2form');
    cashForm.elements.type.addEventListener('change',()=>{const categorySelect=cashForm.elements.cat;categorySelect.innerHTML=categoryOptions(cashForm.elements.type.value);categorySelect.value='';});
    cashForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('cash2msg'),org=(await sb.from('organizations').select('id').eq('status','ACTIVE').limit(1).maybeSingle()).data,profileId=state.profile?.id;if(!org||!profileId){msg.className='error';msg.textContent='Identitas organisasi atau profil belum tersedia.';return}const chosenCategory=cats.find(c=>c.id===f.get('cat')&&c.category_type===f.get('type'));if(!chosenCategory){msg.className='error';msg.textContent='Pilih kategori aktif yang sesuai dengan jenis transaksi.';return}const payload={transaction_date:f.get('date'),transaction_type:f.get('type'),category_id:f.get('cat'),amount:Number(f.get('amount')),description:String(f.get('desc')||'').trim()};let q;if(id)q=await sb.from('cash_transactions').update(payload).eq('id',id);else q=await sb.from('cash_transactions').insert({...payload,transaction_number:'KAS-'+(String(f.get('type')||'INCOME').toUpperCase()==='EXPENSE'?'KELUAR':'MASUK')+'-'+String(f.get('desc')||'TRANSAKSI KAS').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)+'-'+String(f.get('date')||new Date().toISOString().slice(0,10)).replace(/-/g,'')+'-'+crypto.randomUUID().replace(/-/g,'').slice(0,8),organization_id:org.id,created_by:profileId,status:(await v123Chair())?'DISETUJUI':'MENUNGGU_PERSETUJUAN',approved_by:(await v123Chair())?profileId:null});if(q.error){msg.className='error';msg.textContent=friendlyError(q.error);return}document.getElementById('cash2')?.remove();toast(id?'Transaksi kas diperbarui.':'Transaksi kas berhasil disimpan.');await window.financeTab2('cash')};
  };
  window.financeCash2=async function(p){
    // V336: sumber tunggal modul Kas = v_cash_book.
    // Tidak memakai query pembayaran/tagihan tambahan untuk menentukan apakah transaksi tampil.
    const {data,error}=await sb.from('v_cash_book')
      .select('*')
      .order('transaction_date',{ascending:false})
      .limit(1000);
    const rows=data||[];
    if(error){
      p.innerHTML=`<div class="card"><p class="error">${E(friendlyError(error))}</p></div>`;
      return;
    }
    // V359: transaksi kas yang berasal dari pembayaran harus membawa nama lembaga dari tagihan sumbernya.
    const missingInstitutionRows=rows.filter(x=>!x.institution_name&&x.transaction_number);
    if(missingInstitutionRows.length){
      const txNums=[...new Set(missingInstitutionRows.map(x=>x.transaction_number))];
      const payQ=await sb.from('payments').select('payment_number,bill_id').in('payment_number',txNums);
      if(!payQ.error&&payQ.data?.length){
        const billIds=[...new Set(payQ.data.map(x=>x.bill_id).filter(Boolean))];
        if(billIds.length){
          const billsQ=await sb.from('bills').select('id,institution_id').in('id',billIds);
          if(!billsQ.error&&billsQ.data?.length){
            const instIds=[...new Set(billsQ.data.map(x=>x.institution_id).filter(Boolean))];
            const instQ=instIds.length?await sb.from('institutions').select('id,name').in('id',instIds):{data:[],error:null};
            if(!instQ.error){const names=new Map((instQ.data||[]).map(x=>[x.id,x.name]));const billMap=new Map(billsQ.data.map(x=>[x.id,x]));const payMap=new Map(payQ.data.map(x=>[x.payment_number,x.bill_id]));missingInstitutionRows.forEach(x=>{const b=billMap.get(payMap.get(x.transaction_number));if(b?.institution_id)x.institution_name=names.get(b.institution_id)||x.institution_name||''})}
          }
        }
      }
    }
    // Fallback for payment-origin cash rows: resolve the bill number embedded in the transaction description.
    const unresolvedCashRows=rows.filter(x=>!x.institution_name&&/TAG-[A-Z0-9-]+/i.test(String(x.description||'')));
    if(unresolvedCashRows.length){
      const billNos=[...new Set(unresolvedCashRows.flatMap(x=>String(x.description||'').match(/TAG-[A-Z0-9-]+/gi)||[]))];
      if(billNos.length){
        const sourceBills=await sb.from('bills').select('id,bill_number,institution_id').in('bill_number',billNos);
        if(!sourceBills.error&&sourceBills.data?.length){
          const institutionIds=[...new Set(sourceBills.data.map(b=>b.institution_id).filter(Boolean))];
          const sourceInstitutions=institutionIds.length?await sb.from('institutions').select('id,name').in('id',institutionIds):{data:[],error:null};
          if(!sourceInstitutions.error){
            const sourceInstMap=new Map((sourceInstitutions.data||[]).map(i=>[i.id,i.name]));
            const sourceBillMap=new Map((sourceBills.data||[]).map(b=>[String(b.bill_number||'').toUpperCase(),b]));
            unresolvedCashRows.forEach(x=>{const billNo=(String(x.description||'').match(/TAG-[A-Z0-9-]+/i)||[])[0];const bill=billNo&&sourceBillMap.get(billNo.toUpperCase());if(bill?.institution_id)x.institution_name=sourceInstMap.get(bill.institution_id)||x.institution_name||'';});
          }
        }
      }
    }
    p.innerHTML=`<div class="card">
      <div class="row">
        <div><h3>Kas</h3><div class="small muted">Seluruh transaksi kas kepengurusan dari sumber data keuangan yang sama.</div></div>
        <button class="btn primary" onclick="openCashForm2()">+ Catat Transaksi</button>
      </div>
      <div class="v228-section" style="margin-top:10px">
        <div class="v228-data-list">
          ${rows.map(x=>{
            const jenis=x.transaction_type==='INCOME'?'Kas Masuk':'Kas Keluar';
            const kategori=x.category_name||'Kategori tidak tersedia';
            const lembaga=x.institution_name||'Transaksi kas umum';
            const itemText=x.item_name?`${x.item_name}${x.item_quantity!=null?' × '+window.bkfFormatQuantityV359(x.item_quantity):''}`:(x.description||kategori);
            const ket=x.description||'-';
            return `<div class="v228-data-row">
              <div class="v228-main"><div>
                <strong>${E(lembaga)}</strong>
                <div class="v228-meta">Jenis: ${E(jenis)} · Kategori: ${E(kategori)}</div>
                <div class="v228-meta">Item: ${E(itemText)}</div>
                <div class="v228-meta">Keterangan: ${E(ket)}</div>
                <div class="v228-meta">${E(x.transaction_number||'-')} · ${E(date(x.transaction_date))}</div>
              </div><span class="status">${E(x.status||'-')}</span></div>
              <div class="v228-amount">${jenis} · ${fmt(x.amount)}</div>
              <div class="compact-actions"><button class="btn secondary" onclick="openCashForm2('${x.id}')">Edit</button></div>
            </div>`;
          }).join('')||'<div class="empty">Belum ada transaksi kas.</div>'}
        </div>
      </div>
    </div>`;
  };

  window.openBillForm2=async function(id=''){
    const insts=(await sb.from('institutions').select('id,name').eq('status','ACTIVE').order('name')).data||[]; let x={},item={};
    if(id){const q=await sb.from('bills').select('id,institution_id,bill_date,due_date,total_amount').eq('id',id).maybeSingle();if(q.error||!q.data)return toast('Tagihan tidak ditemukan.','error');x=q.data;item=(await sb.from('bill_items').select('description,quantity,unit_price').eq('bill_id',id).limit(1).maybeSingle()).data||{}}

    document.getElementById('bill2form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));let org=(await sb.from('organizations').select('id').limit(1).maybeSingle()).data,per=await window.bkfLoadSelectedPeriod();if(!per)return window.bkAlert('Periode kepengurusan belum dipilih.');let bid=id||crypto.randomUUID();let q;if(id)q=await sb.from('bills').update({institution_id:f.get('inst'),bill_date:f.get('date'),due_date:f.get('due')||null,total_amount:amount}).eq('id',id);else q=await sb.from('bills').insert({id:bid,bill_number:'TAG-MANUAL-'+String(f.get('desc')||'TAGIHAN MANUAL').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)+'-'+String(f.get('date')||new Date().toISOString().slice(0,10)).replace(/-/g,'')+'-'+crypto.randomUUID().replace(/-/g,'').slice(0,8),organization_id:org?.id,institution_id:f.get('inst'),management_period_id:per?.id,bill_date:f.get('date'),due_date:f.get('due')||null,total_amount:amount,status:'ISSUED'});if(q.error)return window.bkAlert(friendlyError(q.error));if(id)q=await sb.from('bill_items').update({description:f.get('desc'),quantity:1,unit_price:amount,subtotal:amount}).eq('bill_id',id);else q=await sb.from('bill_items').insert({bill_id:bid,description:f.get('desc'),quantity:1,unit_price:amount,subtotal:amount,source_type:'MANUAL'});if(q.error)return window.bkAlert(friendlyError(q.error));document.getElementById('bill2')?.remove();financeTab2('bills')};
  };
  window.financeBills2=async function(p){
    let q=sb.from('v_institution_bill_balance').select('*').order('bill_date',{ascending:false}).limit(200);

  window.financeSummaryV337=async function(container){
    if(!container)return;
    const roles=Array.isArray(state.roles)?state.roles:[];
    const allowed=roles.includes('KETUA')||roles.includes('BENDAHARA');
    if(!allowed){container.innerHTML='';return}
    container.innerHTML='<div class="grid grid3" style="margin-bottom:12px"><div class="card" style="margin:0"><div class="small muted">Kas Masuk</div><div id="finSummaryIn337" class="metric">Memuat...</div></div><div class="card" style="margin:0"><div class="small muted">Kas Keluar</div><div id="finSummaryOut337" class="metric">Memuat...</div></div><div class="card" style="margin:0"><div class="small muted">Saldo</div><div id="finSummaryBal337" class="metric">Memuat...</div></div></div>';
    try{
      let rows=[],from=0,step=1000;
      while(true){
        const q=await sb.from('v_cash_book').select('transaction_type,amount').range(from,from+step-1);
        if(q.error)throw q.error;
        const batch=q.data||[];rows.push(...batch);if(batch.length<step)break;from+=step;
      }
      let income=0,expense=0;
      for(const r of rows){const a=Number(r.amount)||0;const t=String(r.transaction_type||'').toUpperCase();if(['INCOME','MASUK','KAS_MASUK'].includes(t))income+=a;else if(['EXPENSE','KELUAR','KAS_KELUAR'].includes(t))expense+=a;}
      const balance=income-expense;
      const fmtMoney=v=>typeof fmt==='function'?fmt(v):new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v);
      document.getElementById('finSummaryIn337').textContent=fmtMoney(income);document.getElementById('finSummaryOut337').textContent=fmtMoney(expense);document.getElementById('finSummaryBal337').textContent=fmtMoney(balance);
    }catch(e){const msg=E(friendlyError(e));['finSummaryIn337','finSummaryOut337','finSummaryBal337'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='<span class="error">'+msg+'</span>'})}

  window.v97FinanceTab=async function(tab,btn){document.querySelectorAll('[data-fin-tab]').forEach(b=>b.classList.toggle('active',b===btn));const p=document.getElementById('finPanel');if(!p)return;p.innerHTML='<div class="card muted">Memuat...</div>';try{if(tab==='cash')return financeCash2(p);if(tab==='bills')return financeBills2(p);if(tab==='budget')return financeBudget2(p);if(tab==='report')return financeReport23(p);if(tab==='limit'){if(!state.roles.includes('KETUA')){p.innerHTML='<div class="notice">Batas Pengeluaran hanya dapat dikelola oleh Ketua.</div>';return}return financeLimit23(p);}if(tab==='teacher_other_dues')return financeTeacherOtherDues2(p);return financeDues2(p)}catch(e){p.innerHTML=`<div class="error">${E(friendlyError(e))}</div>`}};
})();

window.friendlyError=function(e){const m=String(e?.message||e||'Terjadi kesalahan.');if(/Invalid login credentials/i.test(m))return 'Email atau kata sandi tidak sesuai.';if(/Email not confirmed/i.test(m))return 'Email akun belum dikonfirmasi.';if(/JWT|token|session/i.test(m))return 'Sesi Anda sudah berakhir. Silakan masuk kembali.';if(/permission|not authorized|forbidden/i.test(m))return 'Anda tidak memiliki hak akses untuk tindakan ini.';if(/duplicate|unique/i.test(m))return 'Data tersebut sudah ada.';if(/infinite recursion detected in policy for relation ['"]?exam_sessions['"]?/i.test(m))return 'Data sesi ujian belum dapat ditampilkan. Silakan coba lagi.';if(/infinite recursion detected in policy/i.test(m))return 'Data belum dapat ditampilkan karena terjadi masalah keamanan akses. Silakan coba lagi.';if(/violates row-level security|row-level security/i.test(m))return 'Perubahan tidak diizinkan untuk akun ini.';if(/does not exist|not found/i.test(m))return 'Fitur atau data yang diminta belum tersedia.';return 'Tindakan belum berhasil. Silakan periksa data lalu coba lagi.'};
</script>
<script id="v126-final-management-settings">
(function(){
'use strict';
const E=window.esc||((v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const toast=(m,t='success')=>window.v12Toast?window.v12Toast(m,t):window.bkAlert?window.bkAlert(m):window.bkAlert(m);
const friendly=e=>window.friendlyError?window.friendlyError(e):(e?.message||'Tindakan belum berhasil.');
const roleLabel=c=>({KETUA:'Ketua Pengurus',SEKRETARIS:'Sekretaris Pengurus',BENDAHARA:'Bendahara Pengurus',ANGGOTA:'Anggota Pengurus'}[c]||c||'-');
const isAuth=async()=>!!(await requireActiveSession());

// PENGURUS: pendaftaran data + akun dilakukan dalam satu form saat penambahan.
window.openManagementAddForm=async function(){
  if(!(await isAuth())) return toast('Sesi pengguna belum tersedia.','error');
  managementModal(null,null);
};
window.openManagementPersonEdit=async function(id){
  if(!(await isAuth())) return toast('Sesi pengguna belum tersedia.','error');
  const q=await sb.from('management_people').select('*').eq('id',id).eq('status','ACTIVE').maybeSingle();
  if(q.error||!q.data)return toast('Data pengurus tidak ditemukan.','error');
  managementModal(id,q.data);
};
function managementModal(id,x){
  document.getElementById('v126MgmtModal')?.remove();
  const edit=!!id;
  const accountMissing=!x?.auth_user_id;
  const accountMode=!edit || accountMissing;
  document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="v126MgmtModal"><div class="modal-sheet"><div class="row"><h3>${edit?'Edit Pengurus':'Tambah Pengurus'}</h3><button class="btn secondary" type="button" onclick="document.getElementById('v126MgmtModal')?.remove()">Tutup</button></div><div class="small muted">${edit?'Edit data pengurus. Jika akun belum ada, isi email dan password untuk membuat akun.':'Pendaftaran Pengurus sekaligus pembuatan akun login.'}</div><form id="v126MgmtForm">
  <div class="field"><label>Nama lengkap *</label><input name="name" required value="${E(x?.full_name||'')}"></div>
  <div class="grid grid2"><div class="field"><label>Email login *</label><input name="email" type="email" required value="${E(x?.email||'')}" ${accountMode?'readonly':''}></div><div class="field">${accountMode?'<label>Password awal</label><input type="text" value="12345678" readonly><div class="small muted">Password awal otomatis: <strong>12345678</strong>. Setelah login dapat diganti oleh pemilik akun.</div>':`<label>Password ${edit&&!accountMissing?'baru (opsional)':'awal *'}</label><input name="password" type="password" minlength="6" ${edit&&!accountMissing?'':'required'} autocomplete="new-password">`}</div></div>
  <div class="field"><label>Nomor HP</label><input name="phone" value="${E(x?.phone||'')}"></div>
  <div class="grid grid2"><div class="field"><label>Jabatan *</label><select name="role" required>${['KETUA','SEKRETARIS','BENDAHARA','ANGGOTA'].map(r=>`<option value="${r}" ${x?.role_code===r?'selected':''}>${roleLabel(r)}</option>`).join('')}</select></div><div class="field"><label>Tugas</label><input name="task" value="${E(x?.task||'')}"></div></div>
  <div class="grid grid2"><div class="field"><label>Tanggal mulai *</label><input name="start" type="date" required value="${E(x?.start_date||'')}"></div><div class="field"><label>Tanggal akhir</label><input name="end" type="date" value="${E(x?.end_date||'')}"></div></div>
  <div class="field"><label>Foto</label><input name="photo" type="file" accept="image/*"></div>
  <button class="btn primary" style="width:100%">${edit?'Simpan Perubahan':'Daftar Pengurus & Buat Akun'}</button><p id="v126MgmtMsg" class="small"></p>
  </form></div></div>`);
  document.getElementById('v126MgmtForm').onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('v126MgmtMsg');msg.textContent='Menyimpan...';
    try{
      if(f.get('end')&&f.get('end')<f.get('start'))throw new Error('Tanggal akhir tidak boleh sebelum tanggal mulai.');
      const email=String(f.get('email')||'').trim(); if(!email)throw new Error('Email login wajib diisi.');
      const password=String(f.get('password')||''); if(!edit&&password.length<6)throw new Error('Password awal minimal 6 karakter.'); if(edit&&password&&password.length<6)throw new Error('Password baru minimal 6 karakter.');
      let photo=x?.photo_url||null;const file=f.get('photo');if(file?.size&&window.bkfUploadImage)photo=await window.bkfUploadImage(file,'management/'+(id||Date.now())+'.jpg');
      const args={p_full_name:String(f.get('name')||'').trim(),p_email:email,p_phone:String(f.get('phone')||'').trim()||null,p_role_code:f.get('role'),p_task:String(f.get('task')||'').trim()||null,p_start_date:f.get('start'),p_end_date:f.get('end')||null,p_photo_url:photo};
      const invokeUserManagement=async(body,fallback)=>{
        const r=await sb.functions.invoke('user-management',{body});
        if(!r.error && !r.data?.error)return r.data;
        let detail=r.data?.error||r.error?.message||fallback;
        try{const ctx=r.error?.context;if(ctx?.json){const j=await ctx.json();if(j?.error)detail=j.error;}}catch(_){}
        throw new Error(detail||fallback);
      };
      const q=edit&&x?.auth_user_id
        ? await invokeUserManagement({action:'update_management_account',management_person_id:id,email,password,full_name:args.p_full_name,phone:args.p_phone,role_code:args.p_role_code,task:args.p_task,start_date:args.p_start_date,end_date:args.p_end_date,photo_url:args.p_photo_url},'Data akun pengurus belum berhasil diperbarui.')
        : (edit?await sb.rpc('management_people_update',{p_id:id,...args}):await sb.rpc('management_people_create',args));
      if(q.error)throw q.error;
      let personId=id||q.data?.id||(Array.isArray(q.data)?q.data[0]?.id:null);let authUserId=x?.auth_user_id||null;
      if(!personId&&!edit){const lookup=await sb.from('management_people').select('id,auth_user_id,photo_url').eq('email',email).eq('status','ACTIVE').order('created_at',{ascending:false}).limit(1).maybeSingle();personId=lookup.data?.id||null;authUserId=lookup.data?.auth_user_id||null;}
      if(!edit || !x?.auth_user_id){
        if(!personId)throw new Error('Data pengurus berhasil disimpan, tetapi ID untuk pembuatan akun tidak ditemukan.');
        const accountResult=await invokeUserManagement({action:'create_management_account',management_person_id:personId,email,password},'Akun pengurus belum berhasil dibuat.');
        const fresh=await sb.from('management_people').select('auth_user_id,photo_url').eq('id',personId).maybeSingle();
        if(fresh.error)throw fresh.error; authUserId=fresh.data?.auth_user_id||authUserId; photo=fresh.data?.photo_url||photo;
        if(!authUserId)throw new Error('Akun berhasil diproses tetapi ID akun belum tersinkron ke data pengurus. Silakan coba lagi.');
      }
      /* KETUA: satu sumber foto. Profil akun dan data pengurus harus selalu memakai foto yang sama. */
      if(String(f.get('role')||'')==='KETUA' && authUserId && photo){
        const sync=await sb.from('profiles').update({photo_url:photo,updated_at:new Date().toISOString()}).eq('auth_user_id',authUserId);if(sync.error)throw sync.error;
      }
      document.getElementById('v126MgmtModal')?.remove();toast(edit?'Data pengurus diperbarui.':(accountResult?.existing_account?'Akun Pengurus yang sudah ada berhasil ditautkan.':'Pengurus dan akun berhasil didaftarkan.'));await window.v126RenderPengurus();
    }catch(err){msg.className='error';msg.textContent=String(err?.message||friendly(err));}
  };
}

window.v126RenderPengurus=async function(){
  const host=document.getElementById('v126MgmtContent');if(!host)return;
  host.innerHTML='<div class="card"><div class="row"><div><h3>DATA PENGURUS</h3><div class="small muted">Semua pengurus aktif ditampilkan. Kepemilikan akun tidak menentukan apakah data ditampilkan.</div></div><div class="compact-actions"><button class="btn secondary" type="button" onclick="openMyProfileForm()">Profil Saya</button><button class="btn primary" onclick="openManagementAddForm()">+ Tambah Pengurus</button></div></div><div id="v126PeopleList" class="list" style="margin-top:10px">Memuat...</div></div>';

    box.innerHTML=rows.length?rows.map(x=>{

      return `<div class="list-item"><div class="row"><div class="v126-person" style="display:flex;gap:12px;align-items:center"><div class="photo" style="width:58px;height:58px;flex:0 0 58px;border-radius:12px;overflow:hidden">${x.photo_url?`<img src="${E(x.photo_url)}" alt="Foto ${E(x.full_name)}" style="width:100%;height:100%;object-fit:cover">`:'<div class="photo-placeholder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">Foto</div>'}</div><div><strong>${E(x.full_name)}</strong><div class="small muted">${E(roleLabel(x.role_code))}</div><div class="small">Email: ${E(x.email||'Belum diisi')}</div><div class="small">HP: ${E(x.phone||'Belum diisi')}</div><div class="small muted">${x.auth_user_id?'Akun tersedia':'Belum punya akun'}</div></div></div>${showEdit?`<div class="compact-actions"><button class="btn secondary" onclick="openManagementPersonEdit('${E(x.id)}')">Edit</button></div>`:''}</div></div>`;
    }).join(''):'<div class="empty">Belum ada data pengurus aktif.</div>';
  }catch(e){box.innerHTML=`<div class="error">${E(friendly(e))}</div>`}
};
window.showManagement=async function(){listPage('Pengurus','Pendaftaran dan data pengurus aktif.',`<div id="v126MgmtContent"></div>`);await window.v126RenderPengurus()};

<script id="bkf-pengujian-module-v234">
(function(){
'use strict';
const E=window.esc||((v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const normType=t=>String(t||'').toUpperCase()==='TASHIH'?'TASHIH':'PRA_TASHIH';
const examLabel=t=>normType(t)==='TASHIH'?'UJIAN TASHIH':'PRA TASHIH';
const examTypeClass=t=>normType(t)==='TASHIH'?'tashih':'';
const photoHtml=(url,cls='bkf-peng-photo')=>url?`<div class="${cls}"><img src="${E(url)}" alt="Foto peserta"></div>`:`<div class="${cls}">Foto<br>peserta</div>`;
const mediaUrl=path=>{const u=String(path||'');if(!u)return '';if(/^https?:/i.test(u))return u;try{return sb.storage.from('bkfuspaq-media').getPublicUrl(u).data?.publicUrl||''}catch(_){return ''}};
const routeForType=t=>normType(t)==='TASHIH'?'pengujian-tashih':'pengujian-pra';
const isFinishedScore=s=>['FINAL','LOCKED'].includes(String(s||'').toUpperCase());
window.bkfIsFinishedScore=isFinishedScore;

async function loadPengujianRows(examType){
 const type=normType(examType);
 const uid=state.profile?.id||state.user?.id||'00000000-0000-0000-0000-000000000000';
 const aq=await sb.from('examiner_assignments').select('exam_session_id,exam_material_id,examiner_user_id,status').eq('status','ACTIVE').eq('examiner_user_id',uid);
 if(aq.error)throw aq.error;
 const rawAssignments=aq.data||[];if(!rawAssignments.length)return [];
 const sessionIds=[...new Set(rawAssignments.map(x=>x.exam_session_id).filter(Boolean))];
 const sq=await sb.from('exam_sessions').select('id,participant_id,exam_registration_id,status').in('id',sessionIds);if(sq.error)throw sq.error;
 const sessions=sq.data||[];const regIds=[...new Set(sessions.map(x=>x.exam_registration_id).filter(Boolean))];const partIds=[...new Set(sessions.map(x=>x.participant_id).filter(Boolean))];
 const [rq,pq]=await Promise.all([
  regIds.length?sb.from('exam_registrations').select('id,exam_type,institution_id,wave').in('id',regIds):Promise.resolve({data:[],error:null}),
  partIds.length?sb.from('exam_participants').select('id,name,nis,exam_number,status,media_id').in('id',partIds):Promise.resolve({data:[],error:null})
 ]);if(rq.error)throw rq.error;if(pq.error)throw pq.error;
 const regMap=new Map((rq.data||[]).map(x=>[x.id,x])),partMap=new Map((pq.data||[]).map(x=>[x.id,x])),sessMap=new Map(sessions.map(x=>[x.id,x]));
 const assignedRows=rawAssignments.map(a=>{const sess=sessMap.get(a.exam_session_id),reg=sess?regMap.get(sess.exam_registration_id):null,p=sess?partMap.get(sess.participant_id):null;return {...a,exam_sessions:sess?{...sess,exam_registrations:reg,exam_participants:p}:null}}).filter(x=>x.exam_sessions&&x.exam_sessions.exam_registrations&&x.exam_sessions.exam_participants&&normType(x.exam_sessions.exam_registrations.exam_type)===type);
 if(!assignedRows.length)return [];
 const mids=[...new Set(assignedRows.map(x=>x.exam_material_id).filter(Boolean))];
 const [mq,scoreQ,resultQ]=await Promise.all([
  mids.length?sb.from('exam_materials').select('id,name,code,sequence').in('id',mids).eq('status','ACTIVE').order('sequence'):{data:[],error:null},
  sessionIds.length?sb.from('exam_scores').select('exam_session_id,exam_material_id,score,status').in('exam_session_id',sessionIds).in('exam_material_id',mids):{data:[],error:null},
  sessionIds.length?sb.from('exam_results').select('exam_session_id,status,total_score,average_score,finalized_at,locked_at').in('exam_session_id',sessionIds):{data:[],error:null}
 ]);
 if(mq.error)throw mq.error;if(scoreQ.error)throw scoreQ.error;if(resultQ.error)throw resultQ.error;
 const mats=mq.data||[];
 const matMap=new Map(mats.map(m=>[m.id,m]));
 const scoreMap=new Map();
 for(const x of scoreQ.data||[])scoreMap.set(x.exam_session_id+'|'+x.exam_material_id,x);
 const resultMap=new Map((resultQ.data||[]).map(x=>[x.exam_session_id,x]));
 const grouped=new Map();
 for(const a of assignedRows){
   const sess=a.exam_sessions||{},p=sess.exam_participants||{};
   if(!sess.id||!p.id)continue;
   const mat=matMap.get(a.exam_material_id);if(!mat)continue;
   if(!grouped.has(sess.id))grouped.set(sess.id,{p,r:{exam_type:type,institution_id:sess.exam_registrations?.institution_id,wave:sess.exam_registrations?.wave},sess,materials:[],result:resultMap.get(sess.id)||null});
   const g=grouped.get(sess.id);
   if(!g.materials.some(m=>m.id===mat.id))g.materials.push(mat);
 }
 const rows=[...grouped.values()].filter(x=>x.materials.length);
 if(!rows.length)return [];
 const mediaIds=[...new Set(rows.map(x=>x.p.media_id).filter(Boolean))];
 let mediaMap=new Map();
 if(mediaIds.length){const mm=await sb.from('participant_media').select('id,storage_path').in('id',mediaIds);if(mm.error)throw mm.error;mediaMap=new Map((mm.data||[]).map(x=>[x.id,mediaUrl(x.storage_path)]));}
 const instIds=[...new Set(rows.map(x=>x.r.institution_id).filter(Boolean))];
 let instMap=new Map();
 if(instIds.length){const iq=await sb.from('institutions').select('id,name').in('id',instIds);if(iq.error)throw iq.error;instMap=new Map((iq.data||[]).map(x=>[x.id,x.name]));}
 return rows.map(x=>{
   const scoreRows=x.materials.map(m=>scoreMap.get(x.sess.id+'|'+m.id)).filter(Boolean);
   const scores=scoreRows.map(v=>Number(v.score)).filter(Number.isFinite);
   const result=x.result||{};
   // Status peserta ditentukan dari SELURUH materi yang ditugaskan kepada penguji ini.
   // Satu materi saja belum memiliki exam_scores => paket penilaian belum selesai.
   const scoredCount=scoreRows.length;
   const completeScore=scoredCount===x.materials.length && x.materials.length>0;
   const total=result.total_score!=null?Number(result.total_score):(completeScore&&scores.length?scores.reduce((a,b)=>a+b,0):null);
   const average=result.average_score!=null?Number(result.average_score):(completeScore&&scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null);
   const finishedCount=x.materials.filter(m=>window.bkfIsFinishedScore(scoreMap.get(x.sess.id+'|'+m.id)?.status)).length;
   const assignedMaterialScores=x.materials.map(m=>{
     const sc=scoreMap.get(x.sess.id+'|'+m.id);
     return {id:m.id,name:m.name,code:m.code,score:sc?.score??null,status:sc?.status||'BELUM_DINILAI'};
   });
   return {...x,photo_url:mediaMap.get(x.p.media_id)||'',institution_name:instMap.get(x.r.institution_id)||'-',hasAnyScore:scoredCount>0,completeScore,total_score:completeScore?total:null,average_score:completeScore?average:null,scored_count:scoredCount,finished_count:finishedCount,assignedMaterialScores};
 }).sort((a,b)=>String(a.p.exam_number||'').localeCompare(String(b.p.exam_number||''),undefined,{numeric:true})||String(a.p.name||'').localeCompare(String(b.p.name||'')));
}

 const area=document.getElementById('pengujianArea'),search=document.getElementById('pengujianSearch'),count=document.getElementById('pengujianCount');

 'secretariat.view':new Set(['KETUA','SEKRETARIS','ANGGOTA']),'distribution.view':new Set(['KETUA','SEKRETARIS','ANGGOTA','OPERATOR']),'distribution.manage':new Set(['KETUA','BENDAHARA']),

function normalizedRoles(){return Array.isArray(state?.roles)?state.roles.map(r=>String(r).toUpperCase()):[]}

window.loadIdentity=async function(){
 const run=async()=>{
  let lastError=null;
  for(let attempt=0;attempt<3;attempt++){
   try{
    const {data,error}=await sb.rpc('get_my_access_bundle');if(error)throw error;
    const roles=Array.isArray(data?.roles)?data.roles.map(x=>String(x).trim().toUpperCase()).filter(Boolean):[];
    const known=['KETUA','SEKRETARIS','BENDAHARA','ANGGOTA','OPERATOR'];const valid=roles.filter(r=>known.includes(r));
    if(!valid.length)throw new Error('Identitas role pengguna kosong atau tidak dikenal.');
    state.profile=data?.profile||state.profile||null;state.roles=valid;state.permissions=new Set(Array.isArray(data?.permissions)?data.permissions.map(String):[]);return true;
   }catch(e){lastError=e;console.warn('[BK IDENTITY]',attempt+1,e);if(attempt===0){try{await sb.auth.refreshSession()}catch(_){}}if(attempt<2)await new Promise(r=>setTimeout(r,300*(attempt+1)))}
  }
  state.roles=[];state.permissions=new Set();window.__BK_IDENTITY_ERROR__=String(lastError?.message||lastError||'Identitas pengguna gagal dimuat.');return false;
 };
 return await Promise.race([run(),new Promise(resolve=>setTimeout(()=>resolve(false),12000))]);
};

 for(const img of imgs){
   const src=img.getAttribute('src')||'';
   if(!src)continue;
   try{
     if(/^data:image\//i.test(src)){
       const test=new Image();
       await new Promise((resolve,reject)=>{test.onload=()=>resolve();test.onerror=()=>reject(new Error('Data image gagal dimuat'));test.src=src});
     }else{
       const res=await fetch(src,{mode:'cors',credentials:'omit',cache:'no-store'});
       if(!res.ok)throw new Error('HTTP '+res.status);
       const blob=await res.blob();
       const data=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob)});
       img.src=data;
     }
     img.removeAttribute('crossorigin');
     await (img.decode?img.decode().catch(()=>{}):Promise.resolve());
     if(!img.naturalWidth)throw new Error('Foto tidak memiliki ukuran gambar');
   }catch(e){
     console.warn('[BKF FOTO]',e);
   }
 }
}

   img.addEventListener('load',finish,{once:true});img.addEventListener('error',finish,{once:true});setTimeout(finish,10000);
 })));
