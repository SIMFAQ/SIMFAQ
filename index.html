:'<div class="notice">Akun ini hanya dapat melihat data distribusi.</div>'}</div>`;if(!window._distributionManage)return;const sel=document.getElementById('distItemSelect'),qty=document.getElementById('distQty'),tot=document.getElementById('distTotal'),due=document.getElementById('distDue'),dd=document.getElementById('distDate');const calc=()=>{const o=sel.options[sel.selectedIndex],price=Number(o?.dataset.price||0),paid=o?.dataset.paid==='true',q=Number(qty.value||0);tot.value=fmt(paid?price*q:0)};sel.onchange=calc;qty.oninput=calc;dd.onchange=()=>{due.min=dd.value;if(due.value<dd.value)due.value=dd.value};dd.onchange();document.getElementById('distAllocForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('distAllocMsg'),btn=e.target.querySelector('button[type=submit]');if(f.get('due')<f.get('dist_date')){msg.className='error';msg.textContent='Batas pembayaran tidak boleh sebelum tanggal distribusi.';return}if(!f.get('item')||!f.get('institution')||Number(f.get('qty')||0)<=0){msg.className='error';msg.textContent='Barang, lembaga, dan jumlah wajib diisi.';return}if(btn){btn.disabled=true;btn.textContent='Menyimpan...'}msg.className='small muted';msg.textContent='Menyimpan alokasi dan membuat tagihan...';try{const q=await sb.rpc('create_distribution_allocation_with_bill',{p_item_id:f.get('item'),p_institution_id:f.get('institution'),p_quantity:Number(f.get('qty')),p_due_date:f.get('due'),p_distribution_date:f.get('dist_date'),p_notes:f.get('notes')||null});if(q.error){console.error('[BK DISTRIBUSI ALOKASI]',q.error);const raw=String(q.error.message||q.error.details||q.error.hint||'Gagal menyimpan alokasi.');msg.className='error';msg.textContent=raw;window.v12Toast?window.v12Toast(raw,'error'):window.bkAlert&&window.bkAlert(raw);return}if(!q.data?.allocation_id)throw new Error('Database tidak mengembalikan ID alokasi.');msg.className='success';msg.textContent=q.data?.bill_number?`Distribusi tersimpan. Tagihan ${q.dat on>`:''}</div></div>`}).join('')||'<div class="empty">Belum ada riwayat distribusi.</div>'}</div></div>`;

async function v10ExamTab(tab){const a=document.getElementById('v10ExamArea');if(!a)return;a.innerHTML='<div class="card"><p class="muted">Memuat...</p></div>';
 if(tab==='gelombang'){
  if(!hasPermission('exam.manage')){a.innerHTML='<div class="card"><div class="empty">Anda tidak memiliki hak untuk menetapkan gelombang.</div></div>';return}
  a.innerHTML=`<div class="card" id="bkWaveCard"><div class="row"><div><h3>Penetapan Gelombang Pra-Tashih</h3><div class="small muted">Tentukan gelombang peserta Pra-Tashih per lembaga. Lembaga dicentang = Gelombang 1, tidak dicentang = Gelombang 2.</div></div></div><div id="bkWaveForm" style="margin-top:10px"><div class="table-wrap"><table><thead><tr><th style="width:52px">✓</th><th>Lembaga</th><th style="width:120px">Peserta Pra-Tashih</th><th style="width:150px">Gelombang saat ini</th></tr></thead><tbody id="bkWaveRows"><tr><td colspan="4" class="muted" style="text-align:center;padding:18px">Menyiapkan daftar lembaga...</td></tr></tbody></table></div><div class="grid grid3" style="margin-top:12px"><div class="card"><div class="muted">Gelombang 1</div><div class="metric" id="bkWave1Count">0</div><div class="small muted" id="bkWave1Inst">0 lembaga</div></div><div class="card"><div class="muted">Gelombang 2</div><div class="metric" id="bkWave2Count">0</div><div class="small muted" id="bkWave2Inst">0 lembaga</div></div><div class="card"><div class="muted">Selisih peserta</div><div class="metric" id="bkWaveDiff">0</div><div class="small muted">Selisih jumlah peserta antar gelombang</div></div></div><div class="compact-actions" style="margin-top:12px"><button type="button" class="btn primary" id="bkWaveSave">Simpan Penetapan</button></div><p id="bkWaveMsg" class="small"></p></div></div>`;

  const escWave=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const card=document.getElementById('bkWaveCard'),box=document.getElementById('bkWaveForm'),tbody=document.getElementById('bkWaveRows');
  if(!card||!box||!tbody)return;
  const updateSummary=()=>{
    const checks=[...box.querySelectorAll('.bk-wave-check')],g1=checks.filter(x=>x.checked),active=checks.filter(x=>Number(x.dataset.count||0)>0);
    const c1=g1.filter(x=>Number(x.dataset.count||0)>0).reduce((n,x)=>n+Number(x.dataset.count||0),0),c2=active.filter(x=>!x.checked).reduce((n,x)=>n+Number(x.dataset.count||0),0);
    const e1=document.getElementById('bkWave1Count'),e1i=document.getElementById('bkWave1Inst'),e2=document.getElementById('bkWave2Count'),e2i=document.getElementById('bkWave2Inst'),ed=document.getElementById('bkWaveDiff');
    if(e1)e1.textContent=c1;if(e1i)e1i.textContent=g1.filter(x=>Number(x.dataset.count||0)>0).length+' lembaga';if(e2)e2.textContent=c2;if(e2i)e2i.textContent=(active.length-g1.filter(x=>Number(x.dataset.count||0)>0).length)+' lembaga';if(ed)ed.textContent=Math.abs(c1-c2);
    checks.forEach(x=>{const row=x.closest('tr'),label=row?.querySelector('.bk-wave-label');if(label)label.textContent=Number(x.dataset.count||0)>0?(x.checked?'Gelombang 1':'Gelombang 2'):'Tidak ada peserta'});
  };
  try{
    const period=await window.bkfLoadSelectedPeriod(true);
    if(!period?.id)throw new Error('Periode kepengurusan belum dipilih.');
    if(!period.organization_id)throw new Error('Organisasi pada periode kepengurusan belum tersedia.');

    // Sumber utama tetap registrasi Pra-Tashih. Lembaga ditampilkan lebih dahulu, kemudian jumlah peserta diisi.
    const instQ=await sb.from('institutions').select('id,name,status').eq('organization_id',period.organization_id).eq('status','ACTIVE').order('name');
    if(instQ.error)throw instQ.error;
    const institutions=instQ.data||[];
    const byInst=new Map(institutions.map(inst=>[inst.id,{id:inst.id,name:inst.name,count:0,waves:new Set()}]));
    tbody.innerHTML=institutions.map(inst=>`<tr data-inst-row="${escWave(inst.id)}"><td style="text-align:center"><input class="bk-wave-check" type="checkbox" data-inst="${escWave(inst.id)}" data-count="0"></td><td><strong>${escWave(inst.name||'-')}</strong></td><td class="bk-wave-count">0</td><td class="bk-wave-label">Tidak ada peserta</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada lembaga aktif.</td></tr>';
    box.querySelectorAll('.bk-wave-check').forEach(x=>x.onchange=updateSummary);

    // Ambil registrasi Pra-Tashih pada periode aktif. Tidak mengambil peserta global.
    const registrations=[];
    for(let from=0;;from+=1000){
      const rq=await sb.from('exam_registrations').select('id,institution_id,wave,status,exam_type,management_period_id,exam_participants(id,status)').eq('management_period_id',period.id).eq('exam_type','PRA_TASHIH').neq('status','DIBATALKAN').range(from,from+999);
      if(rq.error)throw rq.error;
      registrations.push(...(rq.data||[]));
      if((rq.data||[]).length<1000)break;
    }
    for(const reg of registrations){
      const row=byInst.get(reg.institution_id);if(!row)continue;
      const activeParticipants=(reg.exam_participants||[]).filter(p=>String(p.status||'').toUpperCase()!=='BATAL');
      if(!activeParticipants.length)continue;
      row.count+=activeParticipants.length;
      if(reg.wave!=null)row.waves.add(Number(reg.wave));
    }
    for(const inst of institutions){
      const row=byInst.get(inst.id),check=box.querySelector('.bk-wave-check[data-inst="'+inst.id+'"]'),tr=check?.closest('tr');
      if(!row||!check||!tr)continue;
      const wave=row.waves.size===1?[...row.waves][0]:null;
      check.dataset.count=String(row.count);
      check.checked=wave===1;
      tr.querySelector('.bk-wave-count').textContent=String(row.count);
      tr.querySelector('.bk-wave-label').textContent=row.count>0?(row.waves.size>1?'Belum konsisten':wave===1?'Gelombang 1':wave===2?'Gelombang 2':'Belum ditetapkan'):'Tidak ada peserta';
    }
    updateSummary();

    const saveBtn=document.getElementById('bkWaveSave');
    if(saveBtn)saveBtn.onclick=async()=>{
      const btn=document.getElementById('bkWaveSave'),msg=document.getElementById('bkWaveMsg');
      btn.disabled=true;btn.textContent='Menyimpan...';msg.className='small';msg.textContent='';
      try{
        const assignments=[...box.querySelectorAll('.bk-wave-check')].filter(x=>Number(x.dataset.count||0)>0).map(x=>({institution_id:x.dataset.inst,wave:x.checked?1:2}));
        if(!assignments.length)throw new Error('Belum ada peserta Pra-Tashih yang dapat ditetapkan.');
        const client=window.sb||sb;
        if(!client?.rpc)throw new Error('Koneksi Supabase belum tersedia.');
        const rr=await client.rpc('assign_exam_waves',{p_management_period_id:period.id,p_assignments:assignments});
        if(rr.error)throw rr.error;
        const updated=Number(rr.data?.updated||0);
        msg.className='success';
        msg.textContent=`Penetapan gelombang Pra-Tashih berhasil disimpan. ${updated} pendaftaran diperbarui.`;
        // Muat ulang data gelombang agar tampilan selalu mengikuti database.
        await v10ExamTab('gelombang');
      }catch(e){
        console.error('[BKF GELOMBANG SIMPAN]',e);
        msg.className='error';
        msg.textContent=e?.message||String(e)||'Penetapan gelombang belum berhasil.';
      }finally{
        btn.disabled=false;btn.textContent='Simpan Penetapan';
      }
    };
  }catch(e){
    console.error('[BKF GELOMBANG MUAT]',e);
    const msg=document.getElementById('bkWaveMsg');
    if(msg){msg.className='error';msg.textContent=e?.message||String(e)||'Data penetapan gelombang belum dapat dimuat.'}
  }
  return;
 }

async function v11LockFinalizedExamResultsCollectively(examType){
  const type=String(examType||window._bkfExamReportType||'').toUpperCase();
  if(!['PRA_TASHIH','TASHIH'].includes(type))return;
  if(!Array.isArray(state?.roles)||!state.roles.includes('KETUA')){window.bkAlert('Hanya Ketua yang dapat melakukan penguncian nilai secara kolektif.');return}
  if(!(await window.bkfSystemConfirm('Kunci seluruh nilai yang sudah ditetapkan dan belum dikunci pada tahap '+(type==='TASHIH'?'Tashih':'Pra Tashih')+'? Peserta yang belum difinalisasi akan tetap terbuka.')))return;
  const btns=[...document.querySelectorAll('button')].filter(b=>String(b.textContent||'').includes('Kunci Nilai yang Sudah Ditetapkan'));btns.forEach(b=>{b.disabled=true;b.textContent='Mengunci...'});
  try{
    const orgQ=await sb.rpc('current_organization_ids'); if(orgQ.error)throw orgQ.error;
    const orgIds=Array.isArray(orgQ.data)?orgQ.data.filter(Boolean):[]; if(!orgIds.length)throw new Error('Organisasi aktif akun belum ditemukan.');
    const instQ=await sb.from('institutions').select('id').in('organization_id',orgIds); if(instQ.error)throw instQ.error;
    const instIds=(instQ.data||[]).map(x=>x.id).filter(Boolean); if(!instIds.length){window.bkAlert('Tidak ada lembaga dalam cakupan organisasi aktif.');return}
    const regQ=await sb.from('exam_registrations').select('id').eq('exam_type',type).in('institution_id',instIds); if(regQ.error)throw regQ.error;
    const regIds=(regQ.data||[]).map(x=>x.id).filter(Boolean); if(!regIds.length){window.bkAlert('Tidak ada pendaftaran ujian pada tahap ini.');return}
    const sesQ=await sb.from('exam_sessions').select('id').in('exam_registration_id',regIds); if(sesQ.error)throw sesQ.error;
    const sessionIds=(sesQ.data||[]).map(x=>x.id).filter(Boolean); if(!sessionIds.length){window.bkAlert('Belum ada sesi ujian yang dapat dikunci.');return}
    const resQ=await sb.from('exam_results').select('exam_session_id,status,finalized_at,locked_at').in('exam_session_id',sessionIds).not('finalized_at','is',null).is('locked_at',null); if(resQ.error)throw resQ.error;
    const eligible=(resQ.data||[]).filter(x=>String(x.status||'').toUpperCase().startsWith('LULUS'));
    if(!eligible.length){window.bkAlert('Tidak ada nilai yang sudah ditetapkan dan siap dikunci.');return}
    let locked=0;
    for(const r of eligible){const q=await sb.rpc('lock_exam_result',{p_session_id:r.exam_session_id});if(q.error)throw q.error;locked++}
    window.bkAlert(locked+' hasil ujian berhasil dikunci secara kolektif. Peserta yang belum difinalisasi tetap tidak terkunci.');
    await showExamReportsV32(type);
  }catch(e){console.error('[BKF KUNCI KOLEKTIF V382]',e);window.bkAlert(v10Err(e))}
  finally{btns.forEach(b=>{b.disabled=false;b.textContent='🔒 Kunci Nilai yang Sudah Ditetapkan'})}
}

 window.financeReport23=async function(p){
   const escR=window.esc||((v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
   const today=new Date().toISOString().slice(0,10);
   const first=new Date();first.setDate(1);const firstDay=first.toISOString().slice(0,10);
   p.innerHTML=`<div class="card"><div class="row"><div><h3>Laporan Keuangan Kepengurusan</h3><div class="small muted">Laporan global berdasarkan rentang tanggal dan dikelompokkan menurut jenis transaksi.</div></div><button class="btn secondary" type="button" id="financeReportPrint" disabled>Cetak Laporan</button></div><div class="grid grid2" style="margin-top:10px"><div class="field"><label>Dari tanggal</label><input id="financeReportFrom" type="date" value="${firstDay}"></div><div class="field"><label>Sampai tanggal</label><input id="financeReportTo" type="date" value="${today}"></div></div><div id="financeReportSummary" style="margin-top:12px"><div class="muted">Memuat laporan...</div></div></div>`;
   const run=async()=>{
     const from=document.getElementById('financeReportFrom')?.value||firstDay;
     const to=document.getElementById('financeReportTo')?.value||today;
     const box=document.getElementById('financeReportSummary'),btn=document.getElementById('financeReportPrint');
     if(!box)return;
     if(from>to){box.innerHTML='<div class="error">Tanggal mulai tidak boleh melebihi tanggal akhir.</div>';if(btn)btn.disabled=true;return}
     box.innerHTML='<div class="muted">Memuat laporan...</div>';if(btn)btn.disabled=true;
     const q=await sb.from('v_cash_book').select('*').gte('transaction_date',from).lte('transaction_date',to).order('transaction_date',{ascending:true});
     if(q.error){box.innerHTML='<div class="error">'+escR(friendlyError(q.error))+'</div>';return}
     const rows=(q.data||[]).filter(x=>['DISETUJUI','FINAL','LOCKED'].includes(String(x.status||'').toUpperCase()));
     const txNos=rows.map(x=>x.transaction_number).filter(Boolean);
     let payMap=new Map(),billMap=new Map(),itemMap=new Map(),instMap=new Map();
     if(txNos.length){const pq=await sb.from('payments').select('payment_number,bill_id').in('payment_number',txNos);if(pq.error){box.innerHTML='<div class="error">'+escR(friendlyError(pq.error))+'</div>';return}payMap=new Map((pq.data||[]).map(x=>[x.payment_number,x]));const billIds=[...new Set((pq.data||[]).map(x=>x.bill_id).filter(Boolean))];if(billIds.length){const bq=await sb.from('bills').select('id,bill_number,institution_id').in('id',billIds);if(bq.error){box.innerHTML='<div class="error">'+escR(friendlyError(bq.error))+'</div>';return}billMap=new Map((bq.data||[]).map(x=>[x.id,x]));const iq=await sb.from('bill_items').select('bill_id,description,quantity').in('bill_id',billIds).order('id',{ascending:true});if(iq.error){box.innerHTML='<div class="error">'+escR(friendlyError(iq.error))+'</div>';return}(iq.data||[]).forEach(x=>{if(!itemMap.has(x.bill_id))itemMap.set(x.bill_id,x)});const instIds=[...new Set((bq.data||[]).map(x=>x.institution_id).filter(Boolean))];if(instIds.length){const instQ=await sb.from('institutions').select('id,name').in('id',instIds);if(instQ.error){box.innerHTML='<div class="error">'+escR(friendlyError(instQ.error))+'</div>';return}instMap=new Map((instQ.data||[]).map(x=>[x.id,x.name]))}}}
     rows.forEach(x=>{const pay=payMap.get(x.transaction_number);const bill=pay?billMap.get(pay.bill_id):null;const it=pay?itemMap.get(pay.bill_id):null;x.institution_name=bill?instMap.get(bill.institution_id)||'':'';x.item_name=it?.description||x.category_name||'Kas';x.item_quantity=it?.quantity??1});
     let inc=0,out=0;
     const groups=new Map();
     rows.forEach(x=>{
       const amount=Number(x.amount||0);const type=String(x.transaction_type||'').toUpperCase()==='EXPENSE'?'KAS KELUAR':'KAS MASUK';
       const key=(x.category_code||'')+'|'+(x.category_name||'Tanpa Jenis');
       if(type==='KAS MASUK')inc+=amount;else out+=amount;
       if(!groups.has(key))groups.set(key,{type,code:x.category_code||'',name:x.category_name||'Tanpa Jenis',count:0,total:0});
       const g=groups.get(key);g.count++;g.total+=amount;
     });
     const sorted=[...groups.values()].sort((a,b)=>a.type.localeCompare(b.type)||a.name.localeCompare(b.name));
     const groupHtml=sorted.length?sorted.map(g=>`<div class="list-item"><div class="row"><div><strong>${escR(g.name)}</strong><div class="small muted">${escR(g.type)}${g.code?' · '+escR(g.code):''} · ${g.count} transaksi</div></div><strong>${fmt(g.total)}</strong></div></div>`).join(''):'<div class="empty">Tidak ada transaksi pada rentang tanggal tersebut.</div>';
     const detailHtml=rows.length?rows.map(x=>`<div class="list-item"><div class="row"><div><strong>${escR(x.transaction_number||'-')}</strong><div class="small muted">Tanggal: ${date(x.transaction_date)} · Jenis: ${escR(x.transaction_type||'-')} · Kategori: ${escR(x.category_name||'-')} · Status: ${escR(x.status||'-')}</div><div class="small muted">Lembaga: ${escR(x.institution_name||'-')} · Item: ${escR(x.item_name||'-')} · Jumlah item: ${escR(x.item_quantity??1)}</div></div><strong>${fmt(x.amount||0)}</strong></div><div class="small" style="margin-top:4px;white-space:pre-line"><strong>Keterangan:</strong> ${escR(x.description||'-')}</div></div>`).join(''):'<div class="empty">Belum ada transaksi.</div>';
     box.innerHTML=`<div class="finance-report-grid"><div class="finance-report-box"><div class="muted">Total masuk</div><strong>${fmt(inc)}</strong></div><div class="finance-report-box"><div class="muted">Total keluar</div><strong>${fmt(out)}</strong></div><div class="finance-report-box"><div class="muted">Saldo bersih</div><strong>${fmt(inc-out)}</strong></div><div class="finance-report-box"><div class="muted">Jumlah transaksi</div><strong>${rows.length}</strong></div></div><h4>Rekap per kelompok / jenis transaksi</h4><div class="list">${groupHtml}</div><h4 style="margin-top:14px">Rincian transaksi</h4><div class="list">${detailHtml}</div>`;
     if(btn){btn.disabled=!rows.length;btn.onclick=()=>window.bkfPrintFinanceReport23({from,to,rows,groups:sorted,inc,out});}
   };
   document.getElementById('financeReportFrom')?.addEventListener('change',run);document.getElementById('financeReportTo')?.addEventListener('change',run);
   await run();
 };
 window.bkfPrintFinanceReport23=function({from,to,rows,groups,inc,out}){

   return window.bkfDocumentViewerV183(html,'Laporan Keuangan Kepengurusan',{pdfSize:[297,210],pdfOrientation:'landscape'});
 };

    if(!(await requireActiveSession())){toast('Sesi pengguna belum tersedia. Silakan muat ulang halaman.','error');return}
    const a=(window._activityData||[]).find(x=>x.id===id)||{};
    const iso=v=>v?new Date(v).toISOString().slice(0,16):'';
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="activityModal"><div class="modal-sheet"><div class="row"><h3>${id?'Edit Kegiatan':'Tambah Kegiatan'}</h3><button class="btn secondary" type="button" onclick="document.getElementById('activityModal')?.remove()">Tutup</button></div><form id="activityForm"><div class="field"><label>Nama kegiatan *</label><input name="name" required value="${_E(a.name||'')}"></div><div class="field"><label>Tema</label><input name="theme" value="${_E(a.theme||'')}"></div><div class="grid grid2"><div class="field"><label>Mulai *</label><input name="start_at" type="datetime-local" required value="${iso(a.start_at)}"></div><div class="field"><label>Selesai</label><input name="end_at" type="datetime-local" value="${iso(a.end_at)}"></div></div><div class="field"><label>Tempat</label><input name="venue" value="${_E(a.venue||'')}"></div><div class="field"><label>Status</label><select name="status"><option value="RENCANA" ${a.status==='RENCANA'?'selected':''}>Rencana</option><option value="BERJALAN" ${a.status==='BERJALAN'?'selected':''}>Berjalan</option><option value="SELESAI" ${a.status==='SELESAI'?'selected':''}>Selesai</option><option value="BATAL" ${a.status==='BATAL'?'selected':''}>Batal</option></select></div><div class="field"><label>Deskripsi</label><textarea name="description">${_E(a.description||'')}</textarea></div><label class="check"><input name="is_published" type="checkbox" ${a.is_published?'checked':''}> Tampilkan sebagai kegiatan publik</label><button class="btn primary" style="width:100%;margin-top:12px">Simpan Kegiatan</button><p id="activityMsg" class="small"></p></form></div></div>`);
    const f=document.getElementById('activityForm');
    f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),msg=document.getElementById('activityMsg');msg.textContent='Menyimpan...';try{const start=fd.get('start_at'),end=fd.get('end_at');if(end&&new Date(end)<new Date(start))throw new Error('Waktu selesai tidak boleh sebelum waktu mulai.');const payload={name:String(fd.get('name')||'').trim(),theme:String(fd.get('theme')||'').trim()||null,start_at:start,end_at:end||null,venue:String(fd.get('venue')||'').trim()||null,status:fd.get('status')||'RENCANA',description:String(fd.get('description')||'').trim()||null,is_published:fd.get('is_published')==='on'};if(!payload.name)throw new Error('Nama kegiatan wajib diisi.');if(!id){const orgs=await sb.rpc('current_organization_ids');const oid=Array.isArray(orgs.data)?orgs.data[0]:null;if(orgs.error||!oid)throw new Error('Organisasi aktif akun belum ditemukan.');payload.organization_id=oid;}let q=id?await sb.from('activities').update(payload).eq('id',id):await sb.from('activities').insert(payload);if(q.error)throw q.error;document.getElementById('activityModal')?.remove();toast(id?'Kegiatan berhasil diperbarui.':'Kegiatan berhasil ditambahkan.');showActivities()}catch(err){msg.className='error';msg.textContent=friendlyError(err)}};
  };

  window.showExamReportsV32=async function(examType){
    const area=document.getElementById('examArea')||page();
    const type=String(examType||'').toUpperCase();
    const isOperator=Array.isArray(state?.roles)&&state.roles.includes('OPERATOR');
    const printButton=isOperator?'':`<button class="btn secondary no-print" type="button" onclick="window.bkfPrintElementV366('examReportPrintArea','Rekap Hasil Ujian')">Cetak</button>`;
    if(type!=='PRA_TASHIH'&&type!=='TASHIH'){
      window._bkfExamReportType='';
      area.innerHTML=`<div class="card" id="examReportPrintArea"><div class="row"><div><h3>Rekap Hasil Ujian</h3><div class="small muted">Pilih tahap ujian untuk melihat seluruh peserta dan hasil yang tersedia.</div></div>${printButton}</div><div class="grid grid2" style="margin-top:12px"><button class="btn primary" type="button" onclick="showExamReportsV32('PRA_TASHIH')"><strong>Ujian Pra Tashih</strong><span class="small" style="display:block;margin-top:4px">Rekap peserta dan hasil Ujian Pra Tashih</span></button><button class="btn gold" type="button" onclick="showExamReportsV32('TASHIH')"><strong>Ujian Tashih</strong><span class="small" style="display:block;margin-top:4px">Rekap peserta dan hasil Ujian Tashih</span></button></div></div>`;
      return;
    }
    window._bkfExamReportType=type;
    const label=type==='TASHIH'?'Tashih':'Pra Tashih';
    const reportElId='examReport';
    const roles=Array.isArray(state?.roles)?state.roles:[];
    const canReview=roles.includes('KETUA')||roles.includes('SEKRETARIS');
    const canFinalize=canReview;
    const canLock=roles.includes('KETUA');
    area.innerHTML=`<div class="card" id="examReportPrintArea"><div class="row"><div><h3>Rekap Hasil Ujian ${label}</h3><div class="small muted">Rincian mengikuti aturan ujian pada sesi peserta. Seluruh materi aturan ditampilkan, termasuk materi yang belum dinilai.</div></div><div class="compact-actions no-print"><button class="btn secondary" type="button" onclick="showExamReportsV32()">← Pilih Tahap</button>${type==='TASHIH'?'<button class="btn danger" type="button" onclick="showTashihFailedParticipants()">Peserta Tashih Gagal</button><button class="btn info" type="button" onclick="window.bkfOpenTashihRekapExportV373()">Download PDF / Excel</button>':''}${canLock?`<button class="btn gold" type="button" data-exam-type="${type}" onclick="v11LockFinalizedExamResultsCollectively(this.dataset.examType)">🔒 Kunci Nilai yang Sudah Ditetapkan</button>`:''}${printButton}</div></div><div class="field no-print" style="margin-top:10px"><label for="examReportSearch">Cari peserta</label><input id="examReportSearch" type="search" placeholder="Cari nama, NIS, atau nomor ujian..." autocomplete="off" oninput="filterExamReportsV32(this.value)"></div><div id="${reportElId}" class="list"><p class="muted">Memuat seluruh peserta...</p></div></div>`;
    const reportEl=()=>document.getElementById(reportElId);
    const setError=m=>{const el=reportEl();if(el)el.innerHTML=`<p class="error">${_E(m||'Rekap peserta belum dapat dimuat.')}</p>`};
    const waitQuery=async(promise,labelText)=>await Promise.race([promise,new Promise(resolve=>setTimeout(()=>resolve({data:null,error:{message:labelText+' melebihi batas waktu 15 detik.'}}),15000))]);
    const fetchAll=async(build,labelText)=>{const all=[];for(let from=0;;from+=1000){const r=await waitQuery(build().range(from,from+999),labelText);if(r.error)throw r.error;const chunk=r.data||[];all.push(...chunk);if(chunk.length<1000)break;}return all};
    try{
      let institutions=[];
      if(isOperator){
        const ownInstitutionId=await window.bkfOperatorInstitutionId();
        if(!ownInstitutionId)throw new Error('Lembaga akun Operator belum terhubung.');
        const iq=await waitQuery(sb.from('institutions').select('id,name').eq('id',ownInstitutionId).limit(1),'Pemuatan lembaga Operator');
        if(iq.error)throw iq.error;
        institutions=iq.data||[];
      }else{
        const oq=await waitQuery(sb.rpc('current_organization_ids'),'Pemeriksaan organisasi aktif');
        if(oq.error)throw oq.error;
        const orgIds=Array.isArray(oq.data)?oq.data.filter(Boolean):[];
        if(!orgIds.length)throw new Error('Organisasi aktif akun belum ditemukan.');
        const iq=await waitQuery(sb.from('institutions').select('id,name').in('organization_id',orgIds).limit(500),'Pemuatan lembaga');
        if(iq.error)throw iq.error;
        institutions=iq.data||[];
      }
      const institutionIds=institutions.map(x=>x.id).filter(Boolean);
      if(!institutionIds.length){reportEl().innerHTML='<div class="empty">Belum ada lembaga pada cakupan akun.</div>';return}
      const institutionMap=new Map(institutions.map(x=>[x.id,x.name||'-']));
      const registrations=await fetchAll(()=>sb.from('exam_registrations').select('id,exam_type,institution_id,wave,management_period_id,status').eq('exam_type',type).in('institution_id',institutionIds).order('id',{ascending:true}),'Pemuatan pendaftaran ujian');
      const registrationIds=registrations.map(x=>x.id).filter(Boolean);
      if(!registrationIds.length){reportEl().innerHTML=`<div class="empty">Belum ada peserta terdaftar untuk ujian ${label} pada cakupan akun ini.</div>`;return}
      const registrationMap=new Map(registrations.map(x=>[x.id,x]));
      const [participantsRows,sessions]=await Promise.all([
        fetchAll(()=>sb.from('exam_participants').select('id,exam_registration_id,name,nis,exam_number,media_id,status').in('exam_registration_id',registrationIds).order('id',{ascending:true}),'Pemuatan seluruh peserta ujian'),
        fetchAll(()=>sb.from('exam_sessions').select('id,exam_registration_id,participant_id,status,exam_rule_id,rule_snapshot').in('exam_registration_id',registrationIds).order('id',{ascending:false}),'Pemuatan sesi ujian')
      ]);
      const participantMap=new Map(participantsRows.map(x=>[x.id,x]));
      const sessionParticipantIds=[...new Set(sessions.map(x=>x.participant_id).filter(Boolean))];
      const missingParticipantIds=sessionParticipantIds.filter(id=>!participantMap.has(id));
      if(missingParticipantIds.length){
        const extra=await fetchAll(()=>sb.from('exam_participants').select('id,exam_registration_id,name,nis,exam_number,media_id,status').in('id',missingParticipantIds).order('id',{ascending:true}),'Pemuatan peserta dari sesi ujian');
        extra.forEach(x=>participantMap.set(x.id,x));
      }
      const sessionByParticipant=new Map();
      sessions.forEach(x=>{if(x.participant_id&&!sessionByParticipant.has(x.participant_id))sessionByParticipant.set(x.participant_id,x)});
      const sessionIds=sessions.map(x=>x.id).filter(Boolean);
      let results=[],scoreRows=[],ruleDetails=[],currentRuleIdByPeriod=new Map();
      if(sessionIds.length){
        results=await fetchAll(()=>sb.from('exam_results').select('id,exam_session_id,total_score,average_score,status,finalized_at,locked_at').in('exam_session_id',sessionIds).order('id',{ascending:true}),'Pemuatan hasil ujian');
        scoreRows=await fetchAll(()=>sb.from('exam_scores').select('id,exam_session_id,exam_material_id,score,attempt_number,status,submitted_at,created_at,exam_materials:exam_material_id(name,code,sequence),exam_score_components(id,component_code,score)').in('exam_session_id',sessionIds).order('attempt_number',{ascending:false}).order('submitted_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false}).order('id',{ascending:true}),'Pemuatan rincian nilai');
        const periodIds=[...new Set(registrations.map(x=>x.management_period_id).filter(Boolean))];
        let activeRules=[];
        if(periodIds.length)activeRules=await fetchAll(()=>sb.from('exam_rules').select('id,management_period_id,exam_type,overall_minimum,version').eq('status','ACTIVE').eq('exam_type',type).in('management_period_id',periodIds).order('version',{ascending:false}),'Pemuatan aturan ujian aktif');
        activeRules.forEach(rule=>{if(!currentRuleIdByPeriod.has(rule.management_period_id))currentRuleIdByPeriod.set(rule.management_period_id,rule.id)});
        const activeRuleIds=[...new Set(activeRules.map(x=>x.id).filter(Boolean))];
        if(activeRuleIds.length)ruleDetails=await fetchAll(()=>sb.from('exam_rule_details').select('exam_rule_id,exam_material_id,minimum_score,exam_materials:exam_material_id(id,code,name,sequence,status)').in('exam_rule_id',activeRuleIds).order('exam_material_id',{ascending:true}),'Pemuatan tujuh materi dari aturan aktif');
      }
      const resultBySession=new Map();
      results.forEach(x=>{if(x.exam_session_id&&!resultBySession.has(x.exam_session_id))resultBySession.set(x.exam_session_id,x)});
      const ruleMaterials=new Map();
      ruleDetails.forEach(d=>{if(!ruleMaterials.has(d.exam_rule_id))ruleMaterials.set(d.exam_rule_id,[]);ruleMaterials.get(d.exam_rule_id).push(d)});
      ruleMaterials.forEach(a=>a.sort((x,y)=>Number(x.exam_materials?.sequence||9999)-Number(y.exam_materials?.sequence||9999)));
      scoreRows.sort((a,b)=>{
        const submittedA=String(a.status||'').toUpperCase()==='DRAFT'?0:1,submittedB=String(b.status||'').toUpperCase()==='DRAFT'?0:1;
        if(submittedA!==submittedB)return submittedB-submittedA;
        if(Number(a.attempt_number||0)!==Number(b.attempt_number||0))return Number(b.attempt_number||0)-Number(a.attempt_number||0);
        const ta=new Date(a.submitted_at||a.created_at||0).getTime(),tb=new Date(b.submitted_at||b.created_at||0).getTime();
        return tb-ta;
      });
      const scoreMap=new Map();
      scoreRows.forEach(x=>{const key=x.exam_session_id+'|'+x.exam_material_id;if(!scoreMap.has(key))scoreMap.set(key,x)});
      const mediaIds=[...new Set([...participantMap.values()].map(x=>x.media_id).filter(Boolean))];
      let media=[];
      if(mediaIds.length)media=await fetchAll(()=>sb.from('participant_media').select('id,storage_path').in('id',mediaIds).order('id',{ascending:true}),'Pemuatan foto peserta');
      const mediaMap=new Map(media.map(x=>[x.id,x.storage_path]));
      const mediaUrl=path=>{const u=String(path||'');if(!u)return '';if(/^https?:/i.test(u))return u;try{return sb.storage.from('bkfuspaq-media').getPublicUrl(u).data?.publicUrl||''}catch(_){return ''}};
      const rows=[...participantMap.values()].filter(p=>registrationMap.has(p.exam_registration_id)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'id',{sensitivity:'base'}));
      if(!rows.length){reportEl().innerHTML=`<div class="empty">Belum ada peserta terdaftar untuk ujian ${label} pada cakupan akun ini.</div>`;return}
      reportEl().innerHTML=rows.map((participant,index)=>{
        const registration=registrationMap.get(participant.exam_registration_id)||{};
        const institution=institutionMap.get(registration.institution_id)||'-';
        const wave=registration.wave;
        const session=sessionByParticipant.get(participant.id)||null;
        const result=session?resultBySession.get(session.id)||null:null;
        const finalized=!!result?.finalized_at,locked=!!result?.locked_at,editable=!!result&&canReview&&!finalized&&!locked;
        const photo=mediaUrl(mediaMap.get(participant.media_id));
        const participantStatus=String(participant.status||'').toUpperCase();
        const currentRuleId=currentRuleIdByPeriod.get(registration.management_period_id);
        const configured=session&&currentRuleId?(ruleMaterials.get(currentRuleId)||[]):[];
        const materialRows=configured.map(d=>({detail:d,material:d.exam_materials||{},score:scoreMap.get(session.id+'|'+d.exam_material_id)||null}));
        const completedCount=materialRows.filter(x=>x.score&&x.score.score!=null&&String(x.score.status||'').toUpperCase()!=='DRAFT').length;
        const requiredCount=materialRows.length;
        const legacyIncomplete=!!session&&requiredCount>0&&completedCount<requiredCount&&(finalized||locked);
        const statusText=participantStatus==='BATAL'||participantStatus==='DIBATALKAN'?'DIBATALKAN':legacyIncomplete?(locked?'TERKUNCI · DATA BELUM LENGKAP':'PERLU TINJAU ULANG · MATERI BELUM LENGKAP'):locked?'TERKUNCI':finalized?'DIFINALISASI':result?(result.status==='BELUM_LULUS'?'BELUM LULUS':(result.status||'BELUM LULUS')):session?'BELUM ADA HASIL':'BELUM ADA SESI';
        const statusClass=legacyIncomplete?'bad':locked||finalized||String(result?.status||'').startsWith('LULUS')?'ok':result&&(result.status==='REMEDIAL'||result.status==='BELUM_LULUS'||result.status==='GAGAL')?'bad':'';
        let editableCount=0;
        const materialHtml=materialRows.map(({detail,material,score})=>{
          const scoreSubmitted=!!score&&score.score!=null&&String(score.status||'').toUpperCase()!=='DRAFT';
          const canEditScore=editable&&scoreSubmitted;
          if(canEditScore)editableCount++;
          const comps=(score?.exam_score_components||[]).map(c=>canEditScore?`<div class="small muted" style="margin-top:4px">${_E(c.component_code)} <input class="exam-list-component" data-score-id="${_E(score.id)}" data-component="${_E(c.component_code)}" type="number" min="0" max="100" step="0.01" value="${c.score??''}" style="width:90px;margin-left:5px"></div>`:`<div class="small muted">${_E(c.component_code)}: ${_E(c.score??'-')}</div>`).join('');
          let value='';
          if(!score)value='<span class="small muted">Belum ada nilai</span>';
          else if(!scoreSubmitted)value=`<span class="small muted">${_E(score.score??'-')} · DRAFT/belum dikirim</span>`;
          else value=canEditScore?`<input class="exam-list-score" data-score-id="${_E(score.id)}" type="number" min="0" max="100" step="0.01" value="${score.score??''}" style="width:105px;text-align:right">`:`<strong>${_E(score.score??'-')}</strong>`;
          return `<div style="padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-top:7px"><div class="row"><span>${_E(material.name||material.code||'Materi ujian')}</span><span>${value}</span></div>${comps}</div>`;
        }).join('');
        let actions='';
        if(session&&editable&&editableCount>0)actions+=`<button class="btn secondary" type="button" onclick="window.bkfSaveExamList('${_E(session.id)}')">Simpan Koreksi Nilai</button>`;
        if(session&&result&&!finalized&&!locked&&(String(result.status||'').startsWith('LULUS')||(type==='TASHIH'&&result.status==='GAGAL'))&&canFinalize&&requiredCount>0&&completedCount===requiredCount)actions+=`<button class="btn primary" type="button" onclick="v11FinalizeSession('${_E(session.id)}')">Finalisasi Nilai</button>`;
        if(session&&result&&finalized&&!locked&&String(result.status||'').startsWith('LULUS')&&canLock&&requiredCount>0&&completedCount===requiredCount)actions+=`<button class="btn gold" type="button" onclick="v11LockSession('${_E(session.id)}')">Penguncian Nilai</button>`;
        if(locked)actions+='<span class="small muted">Hasil sudah dikunci; nilai tidak dapat dikoreksi melalui proses normal.</span>';
        else if(finalized&&!actions)actions='<span class="small muted">Hasil sudah difinalisasi.</span>';
        const searchText=`${participant.name||''} ${participant.nis||''} ${participant.exam_number||''} ${institution||''}`.toLowerCase();
        const materialSection=session?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><strong>Rincian Materi Ujian (${requiredCount})</strong><div class="small muted" style="margin-top:4px">Materi bernilai: ${completedCount}/${requiredCount}. Materi yang belum dinilai tetap ditampilkan dan tidak dianggap bernilai nol.</div>${materialHtml||'<div class="small muted">Aturan materi untuk sesi ini belum tersedia.</div>'}</div>`:'';
        const resultSummary=result?`<div class="small muted" style="margin-top:9px"><strong>Total nilai:</strong> ${_E(result.total_score??'-')} · <strong>Rata-rata:</strong> ${result.average_score==null?'-':Number(result.average_score).toFixed(2)} · <strong>Hasil:</strong> ${_E(result.status||'-')}</div>`:'';
        const incompleteNote=session&&requiredCount>0&&completedCount<requiredCount?`<div class="notice" style="margin-top:9px">${completedCount} dari ${requiredCount} materi memiliki nilai terkirim. Materi kosong tetap berstatus BELUM DINILAI dan tidak dihitung sebagai nol. Lengkapi melalui menu Pengujian oleh penguji yang ditugaskan. Simpan Koreksi Nilai hanya memperbarui nilai yang sudah ada. ${legacyIncomplete?'PERINGATAN: hasil ini pernah difinalisasi/dikunci berdasarkan data lama yang belum memenuhi aturan aktif; hasil tersebut perlu ditinjau ulang secara administratif.':''}</div>`:'';
        const noSessionNote=!session?'<div class="small muted" style="margin-top:10px">Sesi penilaian belum tersedia. Belum ada rincian nilai materi untuk ditampilkan.</div>':!result?'<div class="small muted" style="margin-top:9px">Hasil rekap belum terbentuk. Materi sesi tetap ditampilkan di atas; nilai baru dihitung setelah ada nilai ujian yang dikirim.</div>':'';
        return `<details class="list-item exam-result-item" data-search="${_E(searchText)}"><summary style="cursor:pointer;list-style:none"><div class="row"><div style="display:flex;gap:10px;align-items:center"><div class="photo-sm" style="width:48px;height:60px;flex:0 0 48px;overflow:hidden;border-radius:8px;border:1px solid var(--line)">${photo?`<img src="${_E(photo)}" alt="Foto" style="width:100%;height:100%;object-fit:cover">`:'Foto'}</div><div><strong>${index+1}. ${_E(participant.name||'Peserta ujian')}</strong><div class="small muted">NIS ${_E(participant.nis||'-')} · No. ujian ${_E(participant.exam_number||'-')}</div><div class="small muted">Lembaga: ${_E(institution)}</div></div></div><span class="status ${statusClass}">${_E(statusText)}</span></div><div class="small muted" style="margin-top:6px">Klik untuk melihat seluruh materi dan nilai yang tersedia</div></summary>${materialSection}${resultSummary}${incompleteNote}${noSessionNote}<div class="compact-actions no-print" style="margin-top:10px">${actions}</div></details>`;
      }).join('');
    }catch(e){
      console.error('[BK REKAP HASIL UJIAN V373]',e);
      const offline=typeof navigator!=='undefined'&&navigator.onLine===false;
      const network=e instanceof TypeError||/failed to fetch|networkerror|load failed|fetch failed|network request/i.test(String(e?.message||e));
      setError(offline||network?'Koneksi internet terputus atau server belum dapat dihubungi. Data Rekap Hasil Ujian belum dapat dimuat. Periksa koneksi internet lalu tekan Coba Lagi.':(e?.message||String(e)));
      if(offline||network){
        const el=reportEl();
        if(el){const btn=document.createElement('button');btn.className='btn secondary';btn.type='button';btn.textContent='Coba Lagi';btn.onclick=()=>showExamReportsV32(type);el.appendChild(document.createElement('div'));el.appendChild(btn)}
      }
    }
  };
  window.bkfOpenTashihRekapExportV373=async function(){
    const area=document.getElementById('examArea')||page();
    const isOperator=Array.isArray(state?.roles)&&state.roles.includes('OPERATOR');
    area.innerHTML=`<div class="card" id="v373TashihExportArea"><div class="row"><div><h3>Rekap Hasil Ujian Tashih</h3><div class="small muted">Laporan lengkap per lembaga dengan foto kecil, biodata, nilai setiap materi, dan rata-rata.</div></div><div class="compact-actions no-print"><button class="btn secondary" type="button" onclick="showExamReportsV32('TASHIH')">← Kembali</button><button class="btn info" id="v373PdfBtn" type="button" disabled>Download PDF</button><button class="btn secondary" id="v373PrintBtn" type="button" disabled>Cetak</button><button class="btn primary" id="v373ExcelBtn" type="button" disabled>Download Excel</button></div></div><div class="field no-print" style="margin-top:12px"><label for="v373InstitutionSelect">Pilih Lembaga</label><select id="v373InstitutionSelect"><option value="__ALL__">Semua Lembaga</option></select><div class="small muted" style="margin-top:5px">Pilihan ini berlaku untuk Download PDF, Cetak, dan Download Excel.</div></div><div id="v373TashihReport" class="small muted" style="margin-top:12px">Menyiapkan data laporan...</div></div>`;
    const out=document.getElementById('v373TashihReport');
    const select=document.getElementById('v373InstitutionSelect');
    const setError=m=>{if(out)out.innerHTML=`<div class="error">${_E(m||'Rekap Tashih belum dapat dimuat.')}</div>`};

  window.bkfOpenExamReview=async function(sessionId,readOnly){
    const roles=Array.isArray(state?.roles)?state.roles:[];
    const isOperator=roles.includes('OPERATOR');
    const canReview=roles.includes('KETUA')||roles.includes('SEKRETARIS');
    const sessionQ=await sb.from('exam_sessions').select('id,status,participant_id,exam_participants:participant_id(name,nis,exam_number),exam_results:exam_results!exam_results_exam_session_id_fkey(total_score,average_score,status,finalized_at,locked_at)').eq('id',sessionId).maybeSingle();

    const locked=!!result?.locked_at,finalized=!!result?.finalized_at;

      return `<div class="list-item"><div class="row"><strong>${_E(x.exam_materials?.name||'-')}</strong><span class="small muted">${_E(x.status||'-')}</span></div>${editable?`<input class="exam-correction-score" data-score-id="${x.id}" type="number" min="0" max="100" step="0.01" value="${x.score??''}" style="max-width:140px">`:`<div class="metric" style="font-size:22px">${_E(x.score??'-')}</div>`}${comps}</div>`;
    }).join('')||'<div class="empty">Belum ada rincian nilai.</div>';
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="examReviewModal"><div class="modal-sheet" style="max-width:760px"><div class="row"><div><h3>${editable?'Pemeriksaan & Koreksi Nilai':isOperator?'Nilai Resmi Peserta':'Hasil Ujian'}</h3><div class="small muted">${_E(p.name||'-')} · NIS ${_E(p.nis||'-')} · No. ujian ${_E(p.exam_number||'-')}</div></div><button class="btn secondary" onclick="document.getElementById('examReviewModal')?.remove()">Tutup</button></div><div class="small muted" style="margin:10px 0">Status: ${locked?'🔒 Terkunci':finalized?'Sudah difinalisasi':'Belum difinalisasi'}</div><div class="list">${rows}</div><div id="examReviewMsg"></div>${editable?`<div class="compact-actions" style="margin-top:12px"><button class="btn primary" onclick="window.bkfSaveExamReview('${sessionId}')">Simpan Koreksi</button><button class="btn secondary" onclick="window.bkfFinalizeFromReview('${sessionId}')">Finalisasi Nilai</button></div>`:''}</div></div>`);
  };

  window.bkfSaveExamReview=async function(sessionId){
    const items=[...document.querySelectorAll('#examReviewModal .exam-correction-score')].map(i=>({exam_score_id:i.dataset.scoreId,score:Number(i.value),components:[...document.querySelectorAll('#examReviewModal .exam-correction-component[data-score-id="'+i.dataset.scoreId+'"]')].map(c=>({component_code:c.dataset.component,score:Number(c.value)}))}));
    if(items.some(x=>!Number.isFinite(x.score)||x.score<0||x.score>100))return window.bkAlert('Nilai harus 0–100.');
    const {error}=await sb.rpc('review_exam_scores',{p_exam_session_id:sessionId,p_scores:items});
    if(error)return window.bkAlert(v10Err(error));
    window.bkAlert('Koreksi nilai tersimpan. Hasil ujian dihitung ulang.');
    document.getElementById('examReviewModal')?.remove();
    showExamReportsV32();
  };

  window.bkfFinalizeFromReview=async function(sessionId){
    if(!(await window.bkfSystemConfirm('Finalisasi hasil ini? Pastikan seluruh nilai sudah diperiksa dan benar. Setelah finalisasi, koreksi biasa tidak dapat dilakukan lagi.')))return;
    const {error}=await sb.rpc('finalize_exam_result',{p_session_id:sessionId});
    if(error)return window.bkAlert(v10Err(error));
    window.bkAlert('Hasil ujian berhasil difinalisasi.');
    document.getElementById('examReviewModal')?.remove();
    showExamReportsV32();
  };


  /* Keuangan: pertahankan semua tab V30, tetapi ganti panel Kas dan Tagihan dengan alur V32. */
  window.saveCashV32=async function(e){e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('v32CashMsg');const org=(await sb.from('organizations').select('id').eq('status','ACTIVE').limit(1).maybeSingle()).data;if(!org){msg.className='error';msg.textContent='Organisasi aktif belum tersedia.';return}const typ=f.get('transaction_type');const {error}=await sb.from('cash_transactions').insert({transaction_number:'KAS-'+(String(f.get('type')||'INCOME').toUpperCase()==='EXPENSE'?'KELUAR':'MASUK')+'-'+String(f.get('desc')||'TRANSAKSI KAS').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)+'-'+String(f.get('date')||new Date().toISOString().slice(0,10)).replace(/-/g,'')+'-'+crypto.randomUUID().replace(/-/g,'').slice(0,8),organization_id:org.id,transaction_date:f.get('transaction_date'),transaction_type:typ,category_id:f.get('category_id'),amount:Number(f.get('amount')),description:f.get('description')||null,created_by:state.profile?.id,status:'DISETUJUI'});if(error){msg.className='error';msg.textContent=friendlyError(error);return}msg.className='success';msg.textContent=typ==='EXPENSE'?'Kas keluar tersimpan; jika melewati batas, sistem menunggu persetujuan Ketua.':'Kas masuk berhasil dicatat.';e.target.reset();document.getElementById('v32CashType').dispatchEvent(new Event('change'));loadCashV32()};
  window.loadCashV32=async function(){const [h,p]=await Promise.all([sb.from('v_cash_book').select('*').order('transaction_date',{ascending:false}).limit(100),sb.from('cash_transactions').select('id,transaction_number,transaction_date,amount,description,status').eq('transaction_type','EXPENSE').eq('status','MENUNGGU_PERSETUJUAN').order('transaction_date',{ascending:false})]);const hh=document.getElementById('v32CashHistory'),pp=document.getElementById('v32CashPending');if(hh)hh.innerHTML=h.error?`<p class="error">${_E(h.error.message)}</p>`:h.data?.length?h.data.map(x=>`<div class="list-item"><div class="row"><strong>${_E(x.transaction_number)}</strong><span class="status ${x.status==='MENUNGGU_PERSETUJUAN'?'lock':x.status==='DITOLAK'?'bad':'ok'}">${_E(x.status||'-')}</span></div><div class="small">${_E(x.category_name||x.transaction_type)} · ${fmt(x.amount)} · ${date(x.transaction_date)}</div></div>`).join(''):'<div class="empty">Belum ada transaksi.</div>';if(pp)pp.innerHTML=p.error?`<p class="error">${_E(p.error.message)}</p>`:p.data?.length?p.data.map(x=>`<div class="list-item"><div class="row"><div><strong>${_E(x.transaction_number)}</strong><div class="small">${date(x.transaction_date)} · ${fmt(x.amount)}</div><div class="small">${_E(x.description||'')}</div></div>${has('finance.approve')?`<div class="compact-actions"><button class="btn primary" onclick="approveCashV32('${x.id}',true)">Setujui</button><button class="btn danger" onclick="approveCashV32('${x.id}',false)">Tolak</button></div>`:''}</div></div>`).join(''):'<div class="empty">Tidak ada kas keluar yang menunggu persetujuan.</div>'};
  window.approveCashV32=async function(id,ok){const {error}=await sb.rpc('approve_cash_expense',{p_id:id,p_approved:ok,p_note:ok?'Disetujui Ketua':'Ditolak Ketua'});if(error)return window.bkAlert(error.message);loadCashV32()};
  /* previous financeBills2 implementation removed; canonical implementation retained later. */
  window.autoCreateBillsV32=async function(){return true;};

  /* Sekretariat: hapus langsung dari masing-masing item surat. */
  window.deleteLetterV32=async function(table,id){if(!(await window.bkfSystemConfirm('Hapus surat ini? Data tidak dapat dikembalikan.')))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)return window.bkAlert(error.message);showSecretariat()};
  /* Pengaturan: tanpa counter/tombol Keluar. */
  /* Bersihkan tombol manual tagihan yang mungkin dirender oleh legacy function. */
  document.addEventListener('click',()=>setTimeout(()=>{document.querySelectorAll('button').forEach(b=>{if(/Tambah Tagihan|Jadikan Tagihan/.test((b.textContent||'').trim()))b.remove()});closeButtonify()},0),{passive:true});
  setTimeout(closeButtonify,100);
})();

<style id="v33-user-architecture">
/* V33 — Kepengurusan & Pengguna: pisahkan akun organisasi dari akun lembaga */
#adminUserForm .scope-note{margin-top:6px}
</style>
<script id="v33-user-architecture-script">
(function(){
  const E=window.esc||((x)=>String(x??''));
  const oldShowManagement=window.showManagement;
  

  function roleOptions(type,current){
    const org=[['KETUA','Ketua Pengurus'],['SEKRETARIS','Sekretaris Pengurus'],['BENDAHARA','Bendahara Pengurus'],['ANGGOTA','Anggota Pengurus']];
    const inst=[['OPERATOR','Kepala/Operator Lembaga']];
    return (type==='institution'?inst:org).map(x=>`<option value="${x[0]}" ${x[0]===current?'selected':''}>${x[1]}</option>`).join('');
  }
  function syncScopeForm(){
    const f=document.getElementById('v33AdminUserForm'); if(!f)return;
    const type=f.elements.scope_type?.value||'organization', role=f.elements.role_code, inst=f.elements.institution_id, pw=f.elements.password;
    role.innerHTML=roleOptions(type,role.dataset.current||role.value);
    if(type==='institution'){
      inst.disabled=false; inst.required=true;
      f.querySelector('.v33-inst-wrap')?.classList.remove('hidden');
      f.querySelector('.scope-note').textContent='Akun ini terhubung ke satu lembaga dan tidak menjadi anggota kepengurusan organisasi.';
    }else{
      inst.value=''; inst.disabled=true; inst.required=false;
      f.querySelector('.scope-note').textContent='Akun ini adalah akun pengurus organisasi. Lembaga tidak perlu dipilih.';
    }
    if(pw) pw.placeholder=f.dataset.uid?'Kosongkan jika tidak ingin mengganti password':'Minimal 8 karakter';
  }
  async function saveV33AdminUser(e,uid){
    e.preventDefault(); const f=e.target,msg=document.getElementById('v33AdminMsg'); msg.textContent='Menyimpan...';
    try{
      const fd=new FormData(f),type=fd.get('scope_type'),role=fd.get('role_code'),inst=type==='institution'?(fd.get('institution_id')||null):null,pw=String(fd.get('password')||'').trim(),pc=String(fd.get('password_confirm')||'').trim();
      if(type==='institution'&&!inst)throw new Error('Lembaga wajib dipilih untuk Pengguna Lembaga.');
      if(pw&&pw.length<8)throw new Error('Password minimal 6 karakter.');
      if(pw!==pc)throw new Error('Konfirmasi password tidak sama.');
      let authId=uid;
      if(!uid){const r=await sb.functions.invoke('user-management',{body:{action:'create',full_name:String(fd.get('full_name')||'').trim(),email:String(fd.get('email')||'').trim(),phone:String(fd.get('phone')||'').trim()||null,role_code:role,password:pw}});if(r.error||r.data?.error)throw new Error(r.data?.error||r.error?.message||'Akun belum berhasil dibuat.');authId=r.data.user_id;}
      else if(pw){const r=await sb.functions.invoke('user-management',{body:{action:'reset_password',user_id:authId,password:pw}});if(r.error||r.data?.error)throw new Error(r.data?.error||r.error?.message||'Password belum berhasil diubah.');}
      let photo=null;if(f._photoFile)photo=await (window.bkfUploadImage?window.bkfUploadImage(f._photoFile,'profiles/admin-'+authId+'.jpg'):null);
      const q=await sb.rpc('admin_save_user_profile',{p_auth_user_id:authId,p_full_name:String(fd.get('full_name')||'').trim(),p_phone:String(fd.get('phone')||'').trim()||null,p_photo_url:photo,p_role_code:role,p_institution_id:inst});
      if(q.error)throw q.error;
      if(type==='organization'){const mm=await sb.rpc('add_management_member',{p_auth_user_id:authId,p_role_code:role,p_start_date:new Date().toISOString().slice(0,10),p_end_date:null});if(mm.error)throw mm.error;}
      else {await sb.from('management_members').update({status:'INACTIVE',end_date:new Date().toISOString().slice(0,10)}).eq('user_id',authId).eq('status','ACTIVE');}
      document.getElementById('adminUserModal')?.remove();toast(uid?'Pengguna berhasil diperbarui.':'Pengguna berhasil dibuat.');showUsers();
    }catch(err){msg.className='error';msg.textContent=friendlyError(err)}
  }

  

  // Label navigasi utama: Pengurus menjadi bagian dari Kepengurusan, bukan modul yang berdiri sendiri.
  setTimeout(()=>{document.querySelectorAll('button,a').forEach(el=>{if((el.textContent||'').trim()==='Pengurus')el.textContent='Kepengurusan'});},100);
})();

(function(){
  const E=window.esc||((x)=>String(x??''));
  const isManager=()=>state.roles.includes('KETUA')||state.roles.includes('SEKRETARIS');
  const isChair=()=>state.roles.includes('KETUA');
  const posLabel=x=>({KETUA:'Ketua Panitia',SEKRETARIS:'Sekretaris Panitia',BENDAHARA:'Bendahara Panitia',ANGGOTA:'Anggota Panitia'})[x]||x;

  // Satu pintu Kepengurusan: profil organisasi, susunan pengurus, penugasan penguji.
  

  // Penugasan penguji bersifat TEMPLATE: boleh dibuat kapan saja, sebelum ada peserta.
  // Kegiatan: setiap kegiatan memiliki satu susunan panitia. Semua anggota panitia berasal dari Pengurus aktif.
  window.openCommitteeForm=async function(activityId){
    if(!(await requireActiveSession())){toast('Sesi pengguna belum tersedia.','error');return}
    const a=(window._activityData||[]).find(x=>x.id===activityId); if(!a)return;
    const [{data:members},{data:comm}]=await Promise.all([
      sb.from('management_members').select('user_id,role_id').eq('status','ACTIVE'),
      sb.from('activity_committees').select('id').eq('activity_id',activityId).maybeSingle()
    ]);
    const ids=(members||[]).map(x=>x.role_id).filter(Boolean),uids=(members||[]).map(x=>x.user_id).filter(Boolean);
    const [{data:roles},{data:profiles},{data:cm}]=await Promise.all([
      ids.length?sb.from('roles').select('id,code,name').in('id',ids):Promise.resolve({data:[]}),
      uids.length?sb.from('profiles').select('id,full_name,phone').in('id',uids):Promise.resolve({data:[]}),
      comm?.id?sb.from('activity_committee_members').select('user_id,position').eq('committee_id',comm.id):Promise.resolve({data:[]})
    ]);
    const rm=new Map((roles||[]).map(x=>[x.id,x])),pm=new Map((profiles||[]).map(x=>[x.id,x])),cmMap=new Map((cm||[]).map(x=>[x.user_id,x.position]));
    const rows=(members||[]).map(x=>({id:x.user_id,p:pm.get(x.user_id),r:rm.get(x.role_id)})).filter(x=>x.p).map(x=>`<div class="list-item"><div class="row"><label class="check" style="flex:1"><input type="checkbox" class="committee-user" value="${E(x.id)}" ${cmMap.has(x.id)?'checked':''}><span><strong>${E(x.p.full_name)}</strong><br><span class="small muted">${E(x.r?.name||x.r?.code||'Pengurus')}</span></span></label><select class="committee-pos" data-user="${E(x.id)}"><option value="KETUA" ${cmMap.get(x.id)==='KETUA'?'selected':''}>Ketua Panitia</option><option value="SEKRETARIS" ${cmMap.get(x.id)==='SEKRETARIS'?'selected':''}>Sekretaris Panitia</option><option value="BENDAHARA" ${cmMap.get(x.id)==='BENDAHARA'?'selected':''}>Bendahara Panitia</option><option value="ANGGOTA" ${cmMap.get(x.id)==='ANGGOTA'?'selected':''}>Anggota Panitia</option></select></div></div>`).join('');
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="committeeModal"><div class="modal-sheet"><div class="row"><div><h3>Panitia Kegiatan</h3><div class="small muted">${E(a.name)}</div></div><button class="btn secondary" type="button" onclick="document.getElementById('committeeModal')?.remove()">Tutup</button></div><div class="notice">Ketua, Sekretaris, Bendahara, maupun Anggota Pengurus dapat diberi tugas sebagai panitia dengan peran apa pun.</div><div class="list" style="margin-top:10px">${rows||'<div class="empty">Belum ada pengurus aktif.</div>'}</div><button id="saveCommittee" class="btn primary" style="width:100%;margin-top:12px">Simpan Susunan Panitia</button><p id="committeeMsg" class="small"></p></div></div>`);
    document.getElementById('saveCommittee').onclick=async()=>{
      const msg=document.getElementById('committeeMsg');msg.textContent='Menyimpan...';
      try{
        const members=[...document.querySelectorAll('.committee-user:checked')].map(ch=>({user_id:ch.value,position:document.querySelector(`.committee-pos[data-user="${ch.value}"]`)?.value||'ANGGOTA'}));
        if(!members.length)throw new Error('Pilih minimal satu anggota panitia.');
        const positions=members.map(x=>x.position);for(const p of ['KETUA','SEKRETARIS','BENDAHARA'])if(positions.filter(x=>x===p).length>1)throw new Error(posLabel(p)+' hanya boleh satu orang.');
        const r=await sb.rpc('save_activity_committee',{p_activity_id:activityId,p_members:members});if(r.error)throw r.error;
        msg.className='success';msg.textContent='Susunan panitia berhasil disimpan.';setTimeout(()=>{document.getElementById('committeeModal')?.remove();showActivities()},500);
      }catch(e){msg.className='error';msg.textContent=E(e?.message||e)}
    };
  };

  // Pengaturan kategori kas: UI memakai tabel finance_categories dan RPC resmi.
  const escFinanceCategory = v => String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  window.openFinanceCategoryForm = async function(id=''){
    if(!isChair()){toast('Hanya Ketua yang dapat mengatur kategori kas.','error');return}
    let x={};
    if(id){
      const q=await sb.from('finance_categories')
        .select('id,name,category_type,is_active')
        .eq('id',id).maybeSingle();
      if(q.error){toast(escFinanceCategory(q.error.message),'error');return}
      if(!q.data){toast('Kategori kas tidak ditemukan.','error');return}
      x=q.data;
    }
    document.getElementById('financeCatModal')?.remove();
    document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="financeCatModal">
      <div class="modal-sheet">
        <div class="row"><h3>${id?'Edit Kategori Kas':'Tambah Kategori Kas'}</h3>
          <button class="btn secondary" type="button" onclick="document.getElementById('financeCatModal')?.remove()">Tutup</button>
        </div>
        <form id="financeCatForm">
          <div class="field"><label>Jenis Kas</label>
            <select name="type" required>
              <option value="INCOME" ${x.category_type==='INCOME'?'selected':''}>Kas Masuk</option>
              <option value="EXPENSE" ${x.category_type==='EXPENSE'?'selected':''}>Kas Keluar</option>
            </select>
          </div>
          <div class="field"><label>Nama Kategori</label>
            <input name="name" required maxlength="120" value="${escFinanceCategory(x.name||'')}" placeholder="Masukkan nama kategori">
          </div>
          <button class="btn primary" type="submit" style="width:100%">${id?'Simpan Perubahan':'Tambah Kategori'}</button>
          <p id="financeCatMsg" class="small" role="status"></p>
        </form>
      </div>
    </div>`);
    const form=document.getElementById('financeCatForm');
    form.onsubmit=async ev=>{
      ev.preventDefault();
      const msg=document.getElementById('financeCatMsg');
      const f=new FormData(form);
      const name=String(f.get('name')||'').trim();
      const type=String(f.get('type')||'').toUpperCase();
      if(!name){msg.className='error';msg.textContent='Nama kategori wajib diisi.';return}
      if(!['INCOME','EXPENSE'].includes(type)){msg.className='error';msg.textContent='Jenis kas tidak valid.';return}
      const submit=form.querySelector('button[type="submit"]');
      if(submit)submit.disabled=true;

eld"><label>Alamat</label><textarea name="address"></textarea></div><button class="btn primary" style="width:100%">Daftarkan Peserta</button><p id="v40ExamRegMsg" class="small"></p></form></div></div>`);

    photo.onchange=e=>{const file=e.target.files?.[0];if(!file)return;f._photoFile=file;const r=new FileReader();r.onload=()=>preview.innerHTML=`<img src="${E(r.result)}" style="width:90px;height:115px;object-fit:cover;border-radius:10px;border:1px solid #ccc">`;r.readAsDataURL(file)};
    f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),msg=document.getElementById('v40ExamRegMsg');let mediaId=null;let stage='validasi data';msg.className='small';msg.textContent='Memeriksa data...';try{if(!f._photoFile)throw new Error('Foto peserta wajib diisi.');const institution=isOp?ownInst:fd.get('institution_id');if(!institution)throw new Error('Lembaga peserta wajib dipilih.');stage='mengunggah foto';msg.textContent='Mengunggah foto...';const upload=window.bkfUploadImage||window.v23UploadImage;if(typeof upload!=='function')throw new Error('Fungsi penyimpanan foto tidak tersedia.');const url=await upload(f._photoFile,'exam-participants/'+crypto.randomUUID()+'.jpg');stage='menyimpan foto peserta';const m=await sb.from('participant_media').insert({media_type:'PARTICIPANT',storage_path:url,mime_type:'image/jpeg',file_size:f._photoFile.size,uploaded_by:state.profile?.id||null,status:'ACTIVE'}).select('id').single();if(m.error)throw m.error;mediaId=m.data.id;stage='mendaftarkan peserta dan membuat sesi ujian';msg.textContent='Mendaftarkan peserta...';const q=await sb.rpc('register_exam_participant',{p_activity_id:null,p_exam_type:'PRA_TASHIH',p_institution_id:institution,p_name:String(fd.get('name')||'').trim(),p_nis:String(fd.get('nis')||'').trim()||null,p_gender:fd.get('gender')||null,p_birth_place:String(fd.get('birth_place')||'').trim()||null,p_birth_date:fd.get('birth_date')||null,p_address:String(fd.get('address')||'').trim()||null,p_guardian_name:String(fd.get('guardian_name')||'').trim()||null,p_media_id:mediaId});if(q.error)throw q.error;document.getElementById('examRegModal')?.remove();toast('Peserta berhasil didaftarkan. Status proses ujian akan mengikuti sesi ujian.');showExams()}catch(e2){console.error('[BKF PENDAFTARAN UJIAN]',{stage,error:e2});msg.className='error';const raw=String(e2?.message||e2||'Terjadi kesalahan.');const friendly=window.friendlyError?window.friendlyError(e2):raw;msg.textContent=(friendly=== 'Tindakan belum berhasil. Silakan periksa data lalu coba lagi.'||friendly=== 'Fitur atau data yang diminta belum tersedia.')?('Gagal pada tahap '+stage+'. '+raw):friendly;if(mediaId){try{await sb.from('participant_media').delete().eq('id',mediaId)}catch(_){}}}};

  window.openExamDuesForm=async function(){

  window.showGraduation=async function(){

      document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="gradEditSearchModal"><div class="modal-sheet"><div class="row"><div><h3>Edit Data Wisuda</h3><div class="small muted">Cari peserta wisuda berdasarkan NIS atau nama peserta.</div></div><button class="btn secondary" onclick="document.getElementById('gradEditSearchModal')?.remove()">Tutup</button></div><div class="field"><label>Cari peserta</label><input id="gradEditSearchInput" type="search" autocomplete="off" placeholder="Ketik NIS atau nama peserta..."></div><div id="gradEditSearchResult" class="list"><div class="empty">Ketik minimal 2 karakter untuk mencari.</div></div></div></div>`);

        }
        const regs=await regSearch;
        if(regs.error){result.innerHTML=`<div class="error">${E(err(regs.error))}</div>`;return}
        const term=q.toLocaleLowerCase('id');
        const rows=(regs.data||[]).flatMap(r=>(r.graduation_participants||[]).filter(p=>p.status!=='BATAL').map(p=>({...p,institution_name:r.institutions?.name||'-',source_type:r.source_type}))).filter(p=>String(p.name||'').toLocaleLowerCase('id').includes(term)||String(p.nis||'').toLocaleLowerCase('id').includes(term)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'id',{sensitivity:'base'}));

/p></form></div></div>`);

      const inst=String(a.institution||'').localeCompare(String(b.institution||''),'id',{numeric:true,sensitivity:'base'});

      return String(a.name||'').localeCompare(String(b.name||''),'id',{numeric:true,sensitivity:'base'});

    list.innerHTML=rows.length?rows.map(x=>`<div class="list-item"><div class="row"><div><strong>${E(x.graduation_order?x.graduation_order+'. ':'')}${E(x.name)}</strong><div class="small muted">${E(x.institution)} · ${x.source==='SPECIAL'?'Daftar wisuda':'Dari Tashih'}</div></div><div class="compact-actions">${canAction('graduation.participant.edit')?`<button class="btn secondary" onclick="editGraduationParticipant('${x.id}')">Edit</button>`:''}${canGradManage()?`<button class="btn secondary" onclick="editGraduationNumberV40('${x.id}','${E(x.graduation_order||'')}')">Nomor</button>`:''}</div></div><div class="small">NIS: ${E(x.nis||'-')} · Motto: ${E(x.motto||'-')}</div></div>`).join(''):'<div class="empty">Belum ada peserta wisuda.</div>';

  window.bkfFormatQuantityV359=function(value){if(value===null||value===undefined||value==='')return '-';const n=Number(value);if(!Number.isFinite(n))return String(value);return new Intl.NumberFormat('id-ID',{maximumFractionDigits:10}).format(n)};

  window.showNotifications=async function(){
    const pid=state.profile?.id;
    if(!pid)return listPage('Notifikasi','Pemberitahuan akun.','<div class="empty">Profil akun belum tersedia.</div>');
    listPage('Notifikasi','Pemberitahuan yang ditujukan khusus kepada akun ini.','<div id="v40Notifs" class="bkf-notification-list"><div class="empty">Memuat notifikasi...</div></div>');
    const [q,cq]=await Promise.all([
      sb.from('notifications').select('id,title,message,type,read_at,created_at,related_table,related_id,event_scope,event_type,activity_id,institution_id,item_name').eq('user_id',pid).order('created_at',{ascending:false}).limit(200),
      sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',pid).is('read_at',null)
    ]);
    const box=document.getElementById('v40Notifs');
    if(!box)return;
    if(q.error){box.innerHTML=`<div class="error">${E(err(q.error))}</div>`;return}
    if(cq.error){box.innerHTML=`<div class="error">${E(err(cq.error))}</div>`;return}
    const rows=q.data||[];
    const instIds=[...new Set(rows.map(n=>n.institution_id).filter(Boolean))];
    const iq=instIds.length?await sb.from('institutions').select('id,name').in('id',instIds):{data:[],error:null};
    if(iq.error){box.innerHTML=`<div class="error">${E(err(iq.error))}</div>`;return}
    const instMap=new Map((iq.data||[]).map(x=>[x.id,x.name]));
    rows.forEach(n=>{n.institution_name=instMap.get(n.institution_id)||''});

    // Untuk notifikasi Transaksi Kas Baru, ambil identitas lembaga + item dari transaksi terkait.
    const cashRows=rows.filter(n=>n.related_table==='cash_transactions'&&n.related_id);
    if(cashRows.length){
      const cashIds=[...new Set(cashRows.map(n=>n.related_id))];
      const cq2=await sb.from('cash_transactions').select('id,transaction_number,transaction_type,category_id,amount,description').in('id',cashIds);
      if(cq2.error){box.innerHTML=`<div class="error">${E(err(cq2.error))}</div>`;return}
      const cashById=new Map((cq2.data||[]).map(x=>[x.id,x]));
      const catIds=[...new Set((cq2.data||[]).map(x=>x.category_id).filter(Boolean))];
      const catQ=catIds.length?await sb.from('finance_categories').select('id,name').in('id',catIds):{data:[],error:null};
      if(catQ.error){box.innerHTML=`<div class="error">${E(err(catQ.error))}</div>`;return}
      const catMap=new Map((catQ.data||[]).map(x=>[x.id,x.name]));
      cashRows.forEach(n=>{const tx=cashById.get(n.related_id);if(!tx)return;n.cash_type=tx.transaction_type==='INCOME'?'Kas Masuk':'Kas Keluar';n.cash_category=catMap.get(tx.category_id)||'';n.cash_description=tx.description||'';n.cash_amount=tx.amount;});
      const cashMap=new Map((cq2.data||[]).map(x=>[x.id,x.transaction_number]));
      const txNumbers=[...new Set((cq2.data||[]).map(x=>x.transaction_number).filter(Boolean))];
      if(txNumbers.length){
        const pq=await sb.from('payments').select('payment_number,bill_id').in('payment_number',txNumbers);
        if(pq.error){box.innerHTML=`<div class="error">${E(err(pq.error))}</div>`;return}
        const payMap=new Map((pq.data||[]).map(x=>[x.payment_number,x.bill_id]));
        const billIds=[...new Set((pq.data||[]).map(x=>x.bill_id).filter(Boolean))];
        if(billIds.length){
          const bq=await sb.from('bills').select('id,institution_id').in('id',billIds);
          if(bq.error){box.innerHTML=`<div class="error">${E(err(bq.error))}</div>`;return}
          const billMap=new Map((bq.data||[]).map(x=>[x.id,x]));
          const bInstIds=[...new Set((bq.data||[]).map(x=>x.institution_id).filter(Boolean))];
          const biq=bInstIds.length?await sb.from('institutions').select('id,name').in('id',bInstIds):{data:[],error:null};
          if(biq.error){box.innerHTML=`<div class="error">${E(err(biq.error))}</div>`;return}
          biq.data?.forEach(x=>instMap.set(x.id,x.name));
          const itemQ=await sb.from('bill_items').select('bill_id,description,quantity,unit_price').in('bill_id',billIds);
          if(itemQ.error){box.innerHTML=`<div class="error">${E(err(itemQ.error))}</div>`;return}
          const itemMap=new Map();
          (itemQ.data||[]).forEach(x=>{const arr=itemMap.get(x.bill_id)||[];arr.push(x);itemMap.set(x.bill_id,arr)});
          cashRows.forEach(n=>{
            const txNo=cashMap.get(n.related_id),billId=payMap.get(txNo),bill=billMap.get(billId),items=itemMap.get(billId)||[];
            if(bill?.institution_id)n.institution_name=instMap.get(bill.institution_id)||n.institution_name||'';
            if(items.length)n.item_name=items.map(x=>`${x.description||'Item'}${x.quantity!=null?' × '+window.bkfFormatQuantityV359(x.quantity):''}`).join(' · ');
          });
        }
      }
    }
    // V359: lengkapi konteks notifikasi lintas modul dari record terkait, bukan hanya nomor/ID.
    const relatedAllow=['activities','exam_registrations','exam_participants','graduation_registrations','graduation_participants','distribution_allocations','distribution_periods','distribution_items','bills','bill_items','payments','incoming_letters','outgoing_letters','meetings','meeting_minutes','meeting_decisions','meeting_action_items','budgets','selapanan_dues_obligations','profiles','organizations','institutions'];
    const relatedGroups=new Map();
    rows.filter(n=>n.related_table&&n.related_id&&relatedAllow.includes(n.related_table)&&n.related_table!=='cash_transactions').forEach(n=>{const a=relatedGroups.get(n.related_table)||[];a.push(n);relatedGroups.set(n.related_table,a)});
    for(const [table,ns] of relatedGroups){const ids=[...new Set(ns.map(n=>n.related_id))];const rq=await sb.from(table).select('*').in('id',ids);if(rq.error)continue;const byId=new Map((rq.data||[]).map(r=>[r.id,r]));for(const n of ns){const r=byId.get(n.related_id);if(!r)continue;n.related_record=r;n.context_name=r.name||r.title||r.full_name||r.item_name||r.activity_name||r.bill_number||r.payment_number||r.registration_number||r.letter_number||r.transaction_number||'';n.context_description=r.description||r.notes||r.theme||r.message||'';n.context_type=r.status||r.type||r.category_type||'';if(!n.institution_id)n.institution_id=r.institution_id||null;if(!n.institution_name&&n.institution_id)n.institution_name=instMap.get(n.institution_id)||'';}}
    const extraInstIds=[...new Set(rows.map(n=>n.institution_id).filter(id=>id&&!instMap.has(id)))];
    if(extraInstIds.length){const exq=await sb.from('institutions').select('id,name').in('id',extraInstIds);if(!exq.error)(exq.data||[]).forEach(x=>instMap.set(x.id,x.name));rows.forEach(n=>{if(!n.institution_name&&n.institution_id)n.institution_name=instMap.get(n.institution_id)||''})}
    const unreadCount=cq.count??0;
    const head=`<div class="row no-print" style="margin-bottom:10px;gap:8px;align-items:center"><div class="small muted">${unreadCount?`${unreadCount} notifikasi belum dibaca`:'Semua notifikasi sudah dibaca'}</div>${unreadCount?'<button class="btn secondary" type="button" onclick="markAllNotificationsReadV40()">Tandai semua sudah dibaca</button>':''}</div>`;
    box.innerHTML=rows.length?head+rows.map(n=>{
      const isCash=n.related_table==='cash_transactions'&&n.title==='Transaksi Kas Baru';
      const contextName=n.item_name||n.context_name||'';
      const meta=[n.institution_name?`Lembaga: ${n.institution_name}`:'',n.cash_type||n.context_type||'',n.cash_category?`Kategori: ${n.cash_category}`:'',contextName?`Item/Kegiatan: ${contextName}`:''].filter(Boolean).join(' · ');
      const detail=isCash?`<div class="bkf-notification-detail">${n.institution_name?`<strong>Lembaga:</strong> ${E(n.institution_name)}<br>`:''}${n.cash_type?`<strong>Jenis:</strong> ${E(n.cash_type)}<br>`:''}${n.cash_category?`<strong>Kategori:</strong> ${E(n.cash_category)}<br>`:''}${contextName?`<strong>Item:</strong> ${E(contextName)}<br>`:''}${n.cash_amount!=null?`<strong>Nominal:</strong> ${E(fmt(n.cash_amount))}<br>`:''}<strong>Keterangan:</strong> ${E(n.cash_description||n.context_description||n.message||'-')}</div>`:`<div class="bkf-notification-detail">${n.institution_name?`<strong>Lembaga:</strong> ${E(n.institution_name)}<br>`:''}${contextName?`<strong>Item/Kegiatan:</strong> ${E(contextName)}<br>`:''}${n.context_type?`<strong>Jenis/Status:</strong> ${E(n.context_type)}<br>`:''}${E(window.bkfFormatNotificationTextV360(n.context_description||n.message||'-'))}</div>`;
      return `<article class="bkf-notification-item ${n.read_at?'is-read':'is-unread'}"><div class="bkf-notification-main" role="button" tabindex="0" onclick="readNotificationV40('${E(n.id)}')" onkeydown="if(event.key==='Enter'||event.key===' ')readNotificationV40('${E(n.id)}')"><div class="bkf-notification-title"><span class="bkf-notification-dot ${n.read_at?'read':''}"></span><strong>${E(n.title||'Notifikasi')}</strong><span class="bkf-notification-status">${n.read_at?'Sudah dibaca':'Belum dibaca'}</span></div>${!isCash&&meta?`<div class="small muted">${E(meta)}</div>`:''}${detail}<div class="bkf-notification-time">${date(n.created_at)} · ${E(n.type||'')}</div></div><button class="bkf-notification-delete" type="button" title="Hapus notifikasi" aria-label="Hapus notifikasi" onclick="event.stopPropagation();deleteNotificationV40('${E(n.id)}')">🗑</button></article>`;
    }).join(''):'<div class="empty">Belum ada notifikasi untuk akun Anda.</div>';
  };

    restoreInput.onchange=async()=>{selectedBackup=null;restoreBtn.disabled=true;const file=restoreInput.files?.[0];if(!file){preview.textContent='Belum ada berkas dipilih.';return}try{const parsed=JSON.parse(await file.text());if(!parsed||typeof parsed.tables!=='object'||!parsed.tables||Array.isArray(parsed.tables))throw new Error('Format tidak sesuai. Pilih file JSON hasil Ekspor Backup BK-FUSPAQ-NU.');const allowed=['organizations','management_periods','institutions','profiles','user_roles','activities','exam_materials','exam_registrations','exam_participants','exam_sessions','exam_results','graduation_events','graduation_registrations','graduation_participants','graduation_institution_packages','bills','bill_items','payments','participant_media','alumni','audit_logs','notifications'];const entries=allowed.filter(t=>Array.isArray(parsed.tables[t])&&parsed.tables[t].length);if(!entries.length)throw new Error('Tidak ditemukan tabel berisi data yang dapat dipulihkan.');selectedBackup=parsed;preview.innerHTML='Berkas: <strong>'+E(file.name)+'</strong><br>Versi: '+E(parsed.backup_version||'tidak dicantumkan')+' · Ekspor: '+E(parsed.exported_at||'-')+'<br>Tabel berisi data: '+entries.map(t=>E(t)+' ('+parsed.tables[t].length+')').join(', ');restoreBtn.disabled=false;document.getElementById('v365RestoreMsg').textContent='Periksa isi backup sebelum memulihkan.'}catch(e){preview.textContent='Backup tidak valid: '+E(e.message||e);document.getElementById('v365RestoreMsg').textContent='';}}

bles.map(t=>[t,selectedBackup.tables[t].length])),p_notes:'Pemulihan backup lokal JSON dari menu Audit & Backup V365.'})}catch(_){}msg.className='small success';msg.textContent='Pemulihan selesai. '+total+' baris dikirim untuk '+tables.length+' tabel. Muat ulang halaman untuk menyegarkan data.';preview.innerHTML+=' <strong>· Pemulihan selesai</strong>'}catch(e){msg.className='small error';msg.textContent='Pemulihan berhenti pada tabel '+E(current)+'. '+done+' baris sudah diproses sebelum kendala: '+E(e.message||e)+'. Data yang sudah diproses tidak otomatis dibatalkan; periksa kondisi database sebelum mengulang.'}finally{restoreBtn.disabled=false;restoreInput.disabled=false}};

})();
