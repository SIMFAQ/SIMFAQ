  <div class="grid grid2"><div class="field"><label>Jabatan *</label><select name="role" required>${['KETUA','SEKRETARIS','BENDAHARA','ANGGOTA'].map(r=>`<option value="${r}" ${x?.role_code===r?'selected':''}>${roleLabel(r)}</option>`).join('')}</select></div><div class="field"><label>Tugas</label><input name="task" value="${E(x?.task||'')}"></div></div>
  <div class="grid grid2"><div class="field"><label>Tanggal mulai *</label><input name="start" type="date" required value="${E(x?.start_date||'')}"></div><div class="field"><label>Tanggal akhir</label><input name="end" type="date" value="${E(x?.end_date||'')}"></div></div>

  </form></div></div>`);
  document.getElementById('v126MgmtForm').onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('v126MgmtMsg');msg.textContent='Menyimpan...';

      const email=String(f.get('email')||'').trim(); if(!email)throw new Error('Email login wajib diisi.');
      const password=String(f.get('password')||''); if(!edit&&password.length<6)throw new Error('Password awal minimal 6 karakter.'); if(edit&&password&&password.length<6)throw new Error('Password baru minimal 6 karakter.');
      let photo=x?.photo_url||null;const file=f.get('photo');if(file?.size&&window.bkfUploadImage)photo=await window.bkfUploadImage(file,'management/'+(id||Date.now())+'.jpg');
      const args={p_full_name:String(f.get('name')||'').trim(),p_email:email,p_phone:String(f.get('phone')||'').trim()||null,p_role_code:f.get('role'),p_task:String(f.get('task')||'').trim()||null,p_start_date:f.get('start'),p_end_date:f.get('end')||null,p_photo_url:photo};
      const invokeUserManagement=async(body,fallback)=>{

        throw new Error(detail||fallback);
      };
      const q=edit&&x?.auth_user_id

window.openInstitutionDataFormV126=async function(id='',createAccount=false){
  let x=null,accountMissing=true;
  if(id){
    const q=await sb.from('institutions').select('id,code,name,head_name,address,village,district,regency,email,phone,status,joined_at,logo_url,head_photo_url').eq('id',id).maybeSingle();
    if(q.error||!q.data)return toast('Data lembaga tidak ditemukan.','error');
    x=q.data;
    const aq=await sb.from('user_roles').select('user_id').eq('institution_id',id).eq('status','ACTIVE').limit(1).maybeSingle();
    if(aq.error)throw aq.error;
    accountMissing=!aq.data?.user_id;
  }
  const edit=!!id,accountMode=createAccount&&accountMissing;document.getElementById('v126InstModal')?.remove();
  document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="v126InstModal"><div class="modal-sheet"><div class="row"><div><h3>${accountMode?'Buatkan Akun':edit?'Edit Lembaga':'Tambah Lembaga'}</h3><div class="small muted">${accountMode?'Lengkapi password untuk membuat akun login lembaga.':edit?'Edit data lembaga. Jika akun belum ada, isi password untuk membuatnya.':'Pendaftaran Lembaga sekaligus pembuatan akun login.'}</div></div><button class="btn secondary" type="button" onclick="document.getElementById('v126InstModal')?.remove()">Tutup</button></div><form id="v126InstForm">
  <div class="grid grid2"><div class="field"><label>Kode Lembaga</label><input name="code" value="${E(x?.code||'')}"></div><div class="field"><label>Nama Lembaga *</label><input name="name" required value="${E(x?.name||'')}"></div></div>
  <div class="field"><label>Nama Kepala Lembaga *</label><input name="head_name" required value="${E(x?.head_name||'')}"></div>
  <div class="grid grid2"><div class="field"><label>Email login *</label><input name="email" type="email" required value="${E(x?.email||'')}"></div><div class="field"><label>Password ${edit&&!accountMissing?'baru (opsional)':'awal *'}</label><input name="password" type="password" minlength="6" ${edit&&!accountMissing?'':'required'} autocomplete="new-password"></div></div>
  <div class="grid grid2"><div class="field"><label>Nomor Telepon</label><input name="phone" value="${E(x?.phone||'')}"></div><div class="field"><label>Tanggal Bergabung</label><input name="joined_at" type="date" value="${E(x?.joined_at||'')}"></div></div>
  <div class="field"><label>Alamat</label><textarea name="address" rows="2">${E(x?.address||'')}</textarea></div>
  <div class="grid grid3"><div class="field"><label>Desa/Kelurahan</label><input name="village" value="${E(x?.village||'')}"></div><div class="field"><label>Kecamatan</label><input name="district" value="${E(x?.district||'')}"></div><div class="field"><label>Kabupaten/Kota</label><input name="regency" value="${E(x?.regency||'')}"></div></div>
  <div class="field"><label>Status</label><select name="status"><option value="ACTIVE" ${x?.status!=='INACTIVE'?'selected':''}>Aktif</option><option value="INACTIVE" ${x?.status==='INACTIVE'?'selected':''}>Tidak Aktif</option></select></div>
  <div class="grid grid2"><div class="field"><label>Logo Lembaga</label><input id="v126InstLogo" type="file" accept="image/*"><div id="v126InstLogoPreview" style="margin-top:6px">${x?.logo_url?`<img src="${E(x.logo_url)}" style="width:72px;height:72px;object-fit:contain;border-radius:10px" alt="Logo">`:''}</div></div><div class="field"><label>Foto Kepala Lembaga</label><input id="v126InstHeadPhoto" type="file" accept="image/*"><div id="v126InstHeadPreview" style="margin-top:6px">${x?.head_photo_url?`<img src="${E(x.head_photo_url)}" style="width:72px;height:72px;object-fit:cover;border-radius:10px" alt="Foto Kepala">`:''}</div></div></div>
  <button class="btn primary" style="width:100%">${accountMode?'Buatkan Akun':edit?'Simpan Perubahan':'Daftar Lembaga & Buat Akun'}</button><p id="v126InstMsg" class="small"></p></form></div></div>`);
  const form=document.getElementById('v126InstForm');
  document.getElementById('v126InstLogo').onchange=e=>{const f=e.target.files?.[0];if(f){form._logoFile=f;document.getElementById('v126InstLogoPreview').innerHTML='<span class="small muted">Logo siap disimpan.</span>'}};
  document.getElementById('v126InstHeadPhoto').onchange=e=>{const f=e.target.files?.[0];if(f){form._headFile=f;document.getElementById('v126InstHeadPreview').innerHTML='<span class="small muted">Foto siap disimpan.</span>'}};
  form.onsubmit=async e=>{
    e.preventDefault();const f=new FormData(form),msg=document.getElementById('v126InstMsg');msg.textContent='Menyimpan...';
    try{
      const email=String(f.get('email')||'').trim();if(!email)throw new Error('Email login wajib diisi.');const password=accountMode?'12345678':String(f.get('password')||'');if(!edit&&password.length<6)throw new Error('Password awal minimal 6 karakter.');if(edit&&password&&password.length<6)throw new Error('Password baru minimal 6 karakter.');
      let logo=x?.logo_url||null,headPhoto=x?.head_photo_url||null;
      if(form._logoFile&&window.bkfUploadImage)logo=await window.bkfUploadImage(form._logoFile,'institutions/'+(id||Date.now())+'/logo.jpg');
      if(form._headFile&&window.bkfUploadImage)headPhoto=await window.bkfUploadImage(form._headFile,'institutions/'+(id||Date.now())+'/head.jpg');
      const payload={code:String(f.get('code')||'').trim()||null,name:String(f.get('name')||'').trim(),head_name:String(f.get('head_name')||'').trim(),email,phone:String(f.get('phone')||'').trim()||null,address:String(f.get('address')||'').trim()||null,village:String(f.get('village')||'').trim()||null,district:String(f.get('district')||'').trim()||null,regency:String(f.get('regency')||'').trim()||null,joined_at:f.get('joined_at')||null,status:f.get('status')||'ACTIVE',logo_url:logo,head_photo_url:headPhoto};
      let instId=id;
      if(!id){const o=(await sb.from('organizations').select('id').eq('status','ACTIVE').order('created_at',{ascending:true}).limit(1).maybeSingle()).data;if(!o)throw new Error('Organisasi aktif belum tersedia.');payload.organization_id=o.id;if(!payload.code)payload.code='LMB-'+crypto.randomUUID().slice(0,8).toUpperCase();const q=await sb.from('institutions').insert(payload).select('id').single();if(q.error)throw q.error;instId=q.data.id;}
      else {const q=await sb.from('institutions').update(payload).eq('id',id);if(q.error)throw q.error;}
      const uid=(await sb.from('user_roles').select('user_id').eq('institution_id',instId).eq('status','ACTIVE').limit(1).maybeSingle()).data?.user_id||null;
      if(!edit){
        if(password.length<6)throw new Error('Password awal minimal 6 karakter.');
        const u=await sb.functions.invoke('user-management',{body:{action:'create_institution_account',institution_id:instId,email,password}});if(u.error||u.data?.error)throw new Error(u.data?.error||u.error?.message||'Akun lembaga belum berhasil dibuat.');
      }else if(!uid&&password){
        const u=await sb.functions.invoke('user-management',{body:{action:'create_institution_account',institution_id:instId,email,password}});if(u.error||u.data?.error)throw new Error(u.data?.error||u.error?.message||'Akun lembaga belum berhasil dibuat.');
      }else if(uid&&password){
        const u=await sb.functions.invoke('user-management',{body:{action:'reset_password',user_id:uid,password}});if(u.error||u.data?.error)throw new Error(u.data?.error||u.error?.message||'Password akun lembaga belum berhasil diperbarui.');
      }
      document.getElementById('v126InstModal')?.remove();toast(accountMode?'Akun lembaga berhasil dibuat.':edit?'Data lembaga diperbarui.':'Lembaga dan akun berhasil didaftarkan.');await window.v126RenderInstitutions();
    }catch(err){msg.className='error';msg.textContent=friendly(err)}
  };
};
window.v126RenderInstitutions=async function(){
  const host=document.getElementById('v126UsersContent');if(!host)return;
  host.innerHTML='<div class="card"><div class="row"><div><h3>DATA LEMBAGA</h3><div class="small muted">Status akun ditampilkan berdasarkan akun aktif yang benar-benar terhubung ke lembaga.</div></div><button class="btn primary" onclick="openInstitutionDataForm()">+ Tambah Lembaga</button></div><div id="v126InstList" class="list" style="margin-top:10px">Memuat...</div></div>';
  const box=document.getElementById('v126InstList');
  try{
    const [q,aq]=await Promise.all([
      sb.from('institutions').select('id,code,name,head_name,address,village,district,regency,email,phone,status,joined_at,logo_url,head_photo_url').eq('status','ACTIVE').order('name'),
      sb.from('user_roles').select('institution_id,user_id').eq('status','ACTIVE').not('institution_id','is',null)
    ]);
    if(q.error)throw q.error;if(aq.error)throw aq.error;
    const accountMap=new Map();for(const a of aq.data||[]){if(a.institution_id&&a.user_id)accountMap.set(a.institution_id,a.user_id)}
    const rows=q.data||[];
    box.innerHTML=rows.length?rows.map(x=>{
      const hasAccount=accountMap.has(x.id);
      const status=hasAccount?'<span class="status ok">🟢 Sudah Punya Akun</span>':`<button class="btn gold" type="button" onclick="openInstitutionDataForm('${E(x.id)}',true)">🟠 Buatkan Akun</button>`;
      return `<div class="list-item"><div class="row"><div style="display:flex;gap:12px;align-items:center;min-width:0"><div style="width:58px;height:58px;flex:0 0 58px;border-radius:12px;overflow:hidden;background:#f3f4f6">${x.logo_url?`<img src="${E(x.logo_url)}" style="width:100%;height:100%;object-fit:contain" alt="Logo ${E(x.name)}">`:x.head_photo_url?`<img src="${E(x.head_photo_url)}" style="width:100%;height:100%;object-fit:cover" alt="Kepala ${E(x.name)}">`:'<div class="photo-placeholder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">Logo</div>'}</div><div style="min-width:0"><strong>${E(x.name)}</strong><div class="small muted">${E(x.code||'')}</div><div class="small">Kepala: ${E(x.head_name||'Belum diisi')}</div><div class="small">${E(x.address||'-')}${x.village||x.district||x.regency?' · '+E([x.village,x.district,x.regency].filter(Boolean).join(', ')):''}</div><div class="small">Email: ${E(x.email||'Belum diisi')} · HP: ${E(x.phone||'Belum diisi')}</div><div style="margin-top:7px">${status}</div></div></div><div class="compact-actions"><button class="btn secondary" type="button" onclick="openInstitutionDataForm('${E(x.id)}')">Edit</button></div></div></div>`
    }).join(''):'<div class="empty">Belum ada lembaga aktif.</div>';
  }catch(e){box.innerHTML=`<div class="error">${E(friendly(e))}</div>`}
};
window.renderInstitutionUsers=async()=>{listPage('Lembaga','Pendaftaran dan data lembaga aktif.',`<div id="v126UsersContent"></div>`);await window.v126RenderInstitutions()};

<script id="v108-stable-boot-print-account-audit">
(function(){
  'use strict';
  const E108=window.esc||((v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  const toast=(m,t='success')=>window.v12Toast?window.v12Toast(m,t):window.bkAlert?window.bkAlert(m):window.bkAlert(m);

  /* KOP CETAK KANONIK: satu logo di kiri + satu profil organisasi di kanan. */
  async function org108(){
    try{
      const q=await sb.from('organizations')
        .select('name,address,email,phone,logo_url')
        .eq('status','ACTIVE')
        .order('created_at',{ascending:true})
        .limit(1)
        .maybeSingle();
      return q.data||{name:'BK FUSPAQ NU',address:'',email:'',phone:'',logo_url:''};
    }catch(_){
      return {name:'BK FUSPAQ NU',address:'',email:'',phone:'',logo_url:''};
    }
  }
  function kop108(o,title=''){
    const logo=o?.logo_url
      ?`<img class="bkf108-logo" src="${E108(o.logo_url)}" alt="Logo organisasi">`
      :`<div class="bkf108-logo bkf108-logo-empty" aria-hidden="true"></div>`;
    const name=E108(o?.name||'BK FUSPAQ NU');
    const sekretariat=`<div><strong>Sekretariat:</strong> ${E108(o?.address||'-')}</div>`;

  }
  function css108(){return `.bkf108-kop{margin:0 0 7mm;padding:0 0 4mm;border-bottom:3px double #222;color:#111}.bkf108-main{display:flex;align-items:center;justify-content:flex-start;gap:5mm;text-align:left}.bkf108-logo{width:20mm;height:20mm;object-fit:contain;flex:0 0 20mm}.bkf108-logo-empty{display:block}.bkf108-profile{line-height:1.3;flex:1}.bkf108-profile>div{font-size:9px}.bkf108-org{font-size:17px!important;font-weight:800;letter-spacing:.15px;margin-bottom:1mm}.bkf108-title{text-align:center;font-size:13px;font-weight:800;margin-top:4mm;text-transform:uppercase}@media print{.bkf108-kop{break-inside:avoid;page-break-inside:avoid}.bkf108-logo{print-color-adjust:exact;-webkit-print-color-adjust:exact}}`;}
  window.bkfGetOrganizationForPrint=org108;
  window.bkfPrintKop=kop108;
  window.bkfPrintCss=css108;

  /* Data Pengguna: tetap khusus lembaga dan satu tombol tambah di header. */
  window.__BKFUSPAQ_DATA_USERS_RULE__={scope:'institution_only',single_add_button:true,card_edit_only:true};
  const fixUserLabel=()=>{
    document.querySelectorAll('#v84SettingsArea button').forEach(b=>{if(/^\+\s*Tambah Data$/i.test((b.textContent||'').trim()))b.textContent='+ Tambah Pengguna'});
    document.querySelectorAll('#v84SettingsArea .list-item .compact-actions button').forEach(b=>{if(/Tambah/i.test(b.textContent||''))b.remove()});
  };
  const oldInstRender108=window.v84RenderInstitutionAccounts;
  if(typeof oldInstRender108==='function')window.v84RenderInstitutionAccounts=async function(){const r=await oldInstRender108.apply(this,arguments);fixUserLabel();return r};

  /* Kebijakan penandatangan terpusat untuk hasil cetak tabel/laporan. */
  const SIG108={NONE:'NONE',CHAIR:'CHAIR',CHAIR_TREASURER:'CHAIR_TREASURER',CHAIR_SECRETARY:'CHAIR_SECRETARY'};
  async function signatories108(){
    try{
      const q=await sb.from('management_people').select('full_name,role_code,status').eq('status','ACTIVE').order('full_name');
      const rows=q.data||[];
      const pick=c=>rows.find(x=>c.includes(String(x.role_code||'').toUpperCase()))||null;
      return {chair:pick(['KETUA']),treasurer:pick(['BENDAHARA']),secretary:pick(['SEKRETARIS'])};
    }catch(_){return {chair:null,treasurer:null,secretary:null};}
  }
  function sig108(mode,p){
    if(mode===SIG108.NONE)return '';
    const cols=mode===SIG108.CHAIR_TREASURER?[['Mengetahui,',p.chair],['Bendahara,',p.treasurer]]:mode===SIG108.CHAIR_SECRETARY?[['Mengetahui,',p.chair],['Sekretaris,',p.secretary]]:[['Mengetahui,',p.chair]];
    return `<div class="bkf108-signatures">${cols.map(([label,x])=>`<div class="bkf108-sign"><div>${label}</div><div class="bkf108-space"></div><strong>${E108(x?.full_name||'')}</strong></div>`).join('')}</div>`;
  }
  function modeFor108(title){

    if(/keuangan|buku kas|kas|tagihan|pembayaran|anggaran|iuran|arus kas/.test(t))return SIG108.CHAIR_TREASURER;
    if(/surat|sekretariat|undangan|berita acara|notulen/.test(t))return SIG108.CHAIR_SECRETARY;
    if(/pengesahan|penetapan|keputusan/.test(t))return SIG108.CHAIR;
    return SIG108.NONE;
  }
  const sigCss108=`.bkf108-signatures{display:flex;justify-content:flex-end;gap:24mm;margin-top:18mm;break-inside:avoid}.bkf108-sign{text-align:center;min-width:42mm;font-size:10px}.bkf108-space{height:18mm}.bkf108-sign strong{font-size:10px;text-decoration:underline}@media print{.bkf108-signatures{page-break-inside:avoid}}`;

    const th=headers.map(h=>'<th>'+E108(h)+'</th>').join('');

    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${E108(title)}</title><style>@page{size:A4 portrait;margin:12mm}body{font:12px Arial;color:#111;margin:0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:6px;vertical-align:top}th{background:#eee}${css108()}${sigCss108}</style></head><body>${kop108(o,title)}<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>${sig108(mode,people)}
<!-- V228: V227 locked; friendly data lists and enhanced payment receipt. --></body>
</html>`);
    w.document.close();w.focus();setTimeout(()=>window.bkfPreparePrintWindowV151(w),300);
  };
  window.v51PrintTable=window.bkfPrintTableV108;

  /* Native print memakai kop yang sama, tanpa menambah kop kedua. */
  const nativePrint108=window.print.bind(window);
  window.print=function(){
    if(document.querySelector('.bkf108-current-print-kop'))return nativePrint108();
    const host=document.querySelector('#page')||document.body;
    const title=(host.querySelector('h1,h2,h3')?.textContent||'BK FUSPAQ NU').trim();
    const kop=document.createElement('div');
    kop.className='bkf108-current-print-kop';
    kop.innerHTML=kop108(window.__BKFUSPAQ_PRINT_ORG__||{name:'BK FUSPAQ NU'},title);
    const style=document.createElement('style');
    style.className='bkf108-current-print-style';
    style.textContent=`@media print{.bkf108-current-print-kop{display:block!important;margin-bottom:8mm}.no-print{display:none!important}}@media screen{.bkf108-current-print-kop{display:none!important}}${css108()}`;
    document.head.appendChild(style);host.insertBefore(kop,host.firstChild);
    Promise.resolve(org108()).then(o=>{window.__BKFUSPAQ_PRINT_ORG__=o;kop.innerHTML=kop108(o,title);nativePrint108();setTimeout(()=>{kop.remove();style.remove()},800)}).catch(()=>{nativePrint108();setTimeout(()=>{kop.remove();style.remove()},800)});
  };
  window.__BKFUSPAQ_FINAL_AUDIT__={version:'V108',bootSingle:true,scriptLeakFixed:true,nativePrint:true,organizationKop:'single-logo-left-profile-right',profileFields:['name','address','email','phone'],signaturePolicy:'centralized'};
})();

<script id="bkf-pengujian-module-v234">
(function(){
'use strict';
const E=window.esc||((v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const normType=t=>String(t||'').toUpperCase()==='TASHIH'?'TASHIH':'PRA_TASHIH';
const examLabel=t=>normType(t)==='TASHIH'?'UJIAN TASHIH':'PRA TASHIH';
const examTypeClass=t=>normType(t)==='TASHIH'?'tashih':'';
const photoHtml=(url,cls='bkf-peng-photo')=>url?`<div class="${cls}"><img src="${E(url)}" alt="Foto peserta"></div>`:`<div class="${cls}">Foto<br>peserta</div>`;
const mediaUrl=path=>{const u=String(path||'');if(!u)return '';if(/^https?:/i.test(u))return u;try{return sb.storage.from('bkfuspaq-media').getPublicUrl(u).data?.publicUrl||''}catch(_){return ''}};
const routeForType=t=>normType(t)==='TASHIH'?'pengujian-tashih':'pengujian-pra';
const isFinishedScore=s=>['FINAL','LOCKED'].includes(String(s||'').toUpperCase());
window.bkfIsFinishedScore=isFinishedScore;

async function loadPengujianRows(examType){
 const type=normType(examType);
 const uid=state.profile?.id||state.user?.id||'00000000-0000-0000-0000-000000000000';
 const aq=await sb.from('examiner_assignments')
  .select('exam_session_id,exam_material_id,examiner_user_id,status,exam_sessions!inner(id,participant_id,exam_registration_id,status,exam_registrations!inner(id,exam_type,institution_id),exam_participants:participant_id(id,name,nis,exam_number,status,media_id))')
  .eq('status','ACTIVE').eq('examiner_user_id',uid);
 if(aq.error)throw aq.error;
 const assignedRows=(aq.data||[]).filter(x=>normType(x.exam_sessions?.exam_registrations?.exam_type)===type);
 if(!assignedRows.length)return [];
 const mids=[...new Set(assignedRows.map(x=>x.exam_material_id).filter(Boolean))];
 const sessionIds=[...new Set(assignedRows.map(x=>x.exam_session_id).filter(Boolean))];
 const [mq,scoreQ,resultQ]=await Promise.all([
  mids.length?sb.from('exam_materials').select('id,name,code,sequence').in('id',mids).eq('status','ACTIVE').order('sequence'):{data:[],error:null},
  sessionIds.length?sb.from('exam_scores').select('exam_session_id,exam_material_id,score,status').in('exam_session_id',sessionIds).in('exam_material_id',mids):{data:[],error:null},
  sessionIds.length?sb.from('exam_results').select('exam_session_id,status,total_score,average_score,finalized_at,locked_at').in('exam_session_id',sessionIds):{data:[],error:null}
 ]);
 if(mq.error)throw mq.error;if(scoreQ.error)throw scoreQ.error;if(resultQ.error)throw resultQ.error;
 const mats=mq.data||[];
 const matMap=new Map(mats.map(m=>[m.id,m]));
 const scoreMap=new Map();
 for(const x of scoreQ.data||[])scoreMap.set(x.exam_session_id+'|'+x.exam_material_id,x);
 const resultMap=new Map((resultQ.data||[]).map(x=>[x.exam_session_id,x]));
 const grouped=new Map();
 for(const a of assignedRows){
   const sess=a.exam_sessions||{},p=sess.exam_participants||{};
   if(!sess.id||!p.id)continue;
   const mat=matMap.get(a.exam_material_id);if(!mat)continue;
   if(!grouped.has(sess.id))grouped.set(sess.id,{p,r:{exam_type:type,institution_id:sess.exam_registrations?.institution_id},sess,materials:[],result:resultMap.get(sess.id)||null});
   const g=grouped.get(sess.id);
   if(!g.materials.some(m=>m.id===mat.id))g.materials.push(mat);
 }
 const rows=[...grouped.values()].filter(x=>x.materials.length);
 if(!rows.length)return [];
 const mediaIds=[...new Set(rows.map(x=>x.p.media_id).filter(Boolean))];
 let mediaMap=new Map();
 if(mediaIds.length){const mm=await sb.from('participant_media').select('id,storage_path').in('id',mediaIds);if(mm.error)throw mm.error;mediaMap=new Map((mm.data||[]).map(x=>[x.id,mediaUrl(x.storage_path)]));}
 const instIds=[...new Set(rows.map(x=>x.r.institution_id).filter(Boolean))];
 let instMap=new Map();
 if(instIds.length){const iq=await sb.from('institutions').select('id,name').in('id',instIds);if(iq.error)throw iq.error;instMap=new Map((iq.data||[]).map(x=>[x.id,x.name]));}
 return rows.map(x=>{
   const scoreRows=x.materials.map(m=>scoreMap.get(x.sess.id+'|'+m.id)).filter(Boolean);
   const scores=scoreRows.map(v=>Number(v.score)).filter(Number.isFinite);
   const result=x.result||{};
   // Status peserta ditentukan dari SELURUH materi yang ditugaskan kepada penguji ini.
   // Satu materi saja belum memiliki exam_scores => paket penilaian belum selesai.
   const scoredCount=scoreRows.length;
   const completeScore=scoredCount===x.materials.length && x.materials.length>0;
   const total=result.total_score!=null?Number(result.total_score):(completeScore&&scores.length?scores.reduce((a,b)=>a+b,0):null);
   const average=result.average_score!=null?Number(result.average_score):(completeScore&&scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null);
   const finishedCount=x.materials.filter(m=>window.bkfIsFinishedScore(scoreMap.get(x.sess.id+'|'+m.id)?.status)).length;
   const assignedMaterialScores=x.materials.map(m=>{
     const sc=scoreMap.get(x.sess.id+'|'+m.id);
     return {id:m.id,name:m.name,code:m.code,score:sc?.score??null,status:sc?.status||'BELUM_DINILAI'};
   });
   return {...x,photo_url:mediaMap.get(x.p.media_id)||'',institution_name:instMap.get(x.r.institution_id)||'-',hasAnyScore:scoredCount>0,completeScore,total_score:completeScore?total:null,average_score:completeScore?average:null,scored_count:scoredCount,finished_count:finishedCount,assignedMaterialScores};
 }).sort((a,b)=>String(a.p.exam_number||'').localeCompare(String(b.p.exam_number||''),undefined,{numeric:true})||String(a.p.name||'').localeCompare(String(b.p.name||'')));
}

function renderPengujianChooser(){
 const host=document.getElementById('page');if(!host)return;
 host.innerHTML=`<div class="card"><div class="row"><div><h2>Pengujian</h2><p class="muted">Pilih tahapan ujian yang akan dinilai.</p></div><button class="btn secondary" type="button" onclick="navigate('home')">${typeof icon==='function'?icon('home'):''} Beranda</button></div></div>
 <div class="grid grid2" style="margin-top:12px">
   <button class="card" type="button" onclick="navigate('pengujian-pra')" style="text-align:left;cursor:pointer;border:1px solid rgba(16,185,129,.25)"><h3 style="margin-top:0">Pra Tashih</h3><span class="btn primary">Mulai Penilaian ›</span></button>
   <button class="card" type="button" onclick="navigate('pengujian-tashih')" style="text-align:left;cursor:pointer;border:1px solid rgba(59,130,246,.25)"><h3 style="margin-top:0">Tashih</h3><span class="btn primary">Mulai Penilaian ›</span></button>
 </div>`;
}

async function showPengujianStage(examType){
 const type=normType(examType),route=routeForType(type),label=examLabel(type);
 const host=document.getElementById('page');if(!host)return;
 host.innerHTML=`<div class="card"><div class="row"><div><button class="btn secondary" type="button" onclick="navigate('pengujian')">← Pengujian</button><h2 style="margin:12px 0 4px">Penilaian ${E(label)}</h2><p class="muted">Peserta yang belum memiliki nilai diberi tombol Nilai. Peserta yang sudah memiliki nilai hanya menampilkan nilainya.</p></div></div><div class="bkf-peng-search"><span class="ico">🔎</span><input id="pengujianSearch" type="search" autocomplete="off" placeholder="Cari nama peserta / nomor ujian..."></div><div id="pengujianCount" class="bkf-peng-count" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"></div></div><div id="pengujianArea" class="card"><p class="muted">Memuat data peserta...</p></div>`;
 const area=document.getElementById('pengujianArea'),search=document.getElementById('pengujianSearch'),count=document.getElementById('pengujianCount');
 try{
   const data=await loadPengujianRows(type);window.__bkfPengujianRows=data;
   const render=()=>{
     const q=String(search.value||'').trim().toLowerCase();
     const rows=!q?data:data.filter(x=>String(x.p.name||'').toLowerCase().includes(q)||String(x.p.exam_number||'').toLowerCase().includes(q)||String(x.p.nis||'').toLowerCase().includes(q));
     const remaining=data.filter(x=>Number(x.scored_count||0)===0).length;
     count.innerHTML=`<span>${rows.length} peserta</span><span style="margin-left:auto">Sisa peserta yang belum ikut Tes: <strong>${remaining}</strong></span>`;
     area.innerHTML=`<div class="row"><div><h3>Peserta Ujian ${E(label)}</h3></div><span class="status ok">${rows.length}</span></div><div class="list" style="margin-top:10px">${rows.map(x=>{
       const complete=!!x.completeScore;
       const r=x.result||{};
       const locked=!!r.locked_at||String(r.status||'').toUpperCase()==='LOCKED';
       const finalized=!!r.finalized_at;
       const statusText=complete?(locked?'DIKUNCI':finalized?'DIFINALISASI':'SUDAH DINILAI'):(x.scored_count>0?`BELUM SELESAI · ${x.scored_count}/${x.materials.length} materi sudah dinilai`:'BELUM DINILAI');
       const statusClass=complete?'ok':'';
       const valueLine=x.scored_count>0?`<div style="margin-top:8px"><strong>Nilai materi tugas:</strong><div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">${(x.assignedMaterialScores||[]).filter(m=>m.score!=null).map(m=>`<span class="status ok" style="display:inline-flex;gap:5px;align-items:center"><span>${E(m.name||m.code||'-')}</span><strong>${E(Number(m.score).toFixed(2))}</strong></span>`).join('')||'<span class="small muted">Belum ada nilai.</span>'}</div></div>`:`<div class="small muted" style="margin-top:8px">Belum ada nilai pada materi yang ditugaskan kepada Anda.</div>`;
       const action=complete?'':`<button class="btn primary bkf-peng-open" type="button" onclick="window.openParticipantFromPengujian('${E(x.sess.id)}','${E(x.p.id)}','${route}')">Nilai ›</button>`;
       return `<div class="list-item"><div class="row"><div class="bkf-peng-person">${photoHtml(x.photo_url)}<div class="bkf-peng-info"><strong>${E(x.p.name||'-')}</strong><div class="bkf-peng-meta">No. Ujian: ${E(x.p.exam_number||'-')} · NIS: ${E(x.p.nis||'-')}</div><span class="bkf-peng-type ${examTypeClass(x.r.exam_type)}">${examLabel(x.r.exam_type)}</span></div></div>${action}</div><div class="small" style="margin-top:8px">Lembaga: <strong>${E(x.institution_name)}</strong> · ${x.materials.length} materi</div><div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft,#f4f8f5);border:1px solid var(--line)"><div class="row"><strong>${complete?'Hasil Penilaian':'Status Penilaian'}</strong><span class="status ${statusClass}">${statusText}</span></div>${valueLine}</div></div>`;
     }).join('')||'<div class="empty">Belum ada peserta yang menjadi penugasan Anda.</div>'}</div>`;
   };
   search.oninput=render;render();search.focus();
 }catch(e){area.innerHTML=`<div class="error">${E(e?.message||'Modul Pengujian belum dapat dimuat.')}</div>`}
}

window.openParticipantFromPengujian=async function(sessionId,participantId,returnRoute){
 try{
 const q=await sb.from('exam_sessions').select('id,participant_id,exam_registration_id,status,participant:participant_id(id,name,nis,exam_number,status,media_id,participant_media:media_id(storage_path)),exam_registrations:exam_registration_id(exam_type,institution_id)').eq('id',sessionId).single();
 if(q.error||!q.data)return window.bkAlert?.(window.friendlyError?q.error?friendlyError(q.error):'Peserta tidak ditemukan.':'Peserta tidak ditemukan.');
 const p=q.data.participant||{},examType=normType(q.data.exam_registrations?.exam_type),route=returnRoute||routeForType(examType);
 if(normType(examType)!==normType(route==='pengujian-tashih'?'TASHIH':'PRA_TASHIH'))return window.bkAlert?.('Tahap ujian tidak sesuai dengan modul penilaian.');
 
 const uid=state.profile?.id||state.user?.id||'00000000-0000-0000-0000-000000000000';
 const ass=await sb.from('examiner_assignments').select('exam_material_id').eq('status','ACTIVE').eq('examiner_user_id',uid).eq('exam_session_id',sessionId);
 if(ass.error)throw ass.error;
 const mids=[...new Set((ass.data||[]).map(x=>x.exam_material_id).filter(Boolean))];
 const mats=mids.length?(await sb.from('exam_materials').select('id,name,code,sequence').in('id',mids).eq('status','ACTIVE').order('sequence')).data||[]:[];
 const sr=await sb.from('exam_sessions').select('exam_rule_id,rule_snapshot').eq('id',sessionId).maybeSingle();
 let ruleDetails=[];if(sr.data?.exam_rule_id){const rd=await sb.from('exam_rule_details').select('exam_material_id,minimum_score').eq('exam_rule_id',sr.data.exam_rule_id);ruleDetails=rd.data||[];}
 const minMap=new Map(ruleDetails.map(x=>[x.exam_material_id,Number(x.minimum_score)]));
 const overallMinimum=Number(sr.data?.rule_snapshot?.overall_minimum??65);
 const sc=mids.length?(await sb.from('exam_scores').select('exam_material_id,score,status,exam_score_components:exam_score_id(component_code,score)').eq('exam_session_id',sessionId).in('exam_material_id',mids)).data||[]:[];
 const scoreMap=new Map(sc.map(x=>[x.exam_material_id,x]));
 const assignedMats=mats;
 const pendingMats=assignedMats.filter(m=>!isFinishedScore(scoreMap.get(m.id)?.status));
 const resultRow=await sb.from('exam_results').select('status,finalized_at,locked_at').eq('exam_session_id',sessionId).maybeSingle();
 if(resultRow.error)throw resultRow.error;
 const resultLocked=!!resultRow.data?.locked_at||String(resultRow.data?.status||'').toUpperCase()==='LOCKED';
 let photo='';if(p.media_id){const mm=await sb.from('participant_media').select('storage_path').eq('id',p.media_id).maybeSingle();if(!mm.error)photo=mediaUrl(mm.data?.storage_path)}
 let institutionName='-';const instId=q.data.exam_registrations?.institution_id;if(instId){const iq=await sb.from('institutions').select('name').eq('id',instId).maybeSingle();if(!iq.error)institutionName=iq.data?.name||'-'}
 p.exam_session_id=sessionId;p.overall_status=resultLocked?'DIKUNCI':(resultRow.data?.finalized_at?'DIFINALISASI':(p.status||'BELUM_DINILAI'));p.assigned_count=assignedMats.length;p.exam_type=examType;p.photo_url=photo;p.institution_name=institutionName;p.overall_minimum=overallMinimum;p.pengujian_return_route=route;
 p.assigned_materials=assignedMats.map(m=>{const x=scoreMap.get(m.id)||{},comps={};for(const c of x.exam_score_components||[])comps[c.component_code]=c.score;return {material_id:m.id,name:m.name,code:m.code,score:x.score??null,score_status:x.status||'BELUM_DINILAI',minimum_score:minMap.get(m.id)??65,components:comps}});
 state.participant=p;window.openParticipant(p);
 }catch(e){console.error('[BK PENGUJIAN OPEN]',e);window.bkAlert?.(e?.message||'Form penilaian tidak dapat dibuka.');}
};


// Public route entry points: the central router calls these exact handlers.
// Keep them explicit so Pengujian never falls through to the previously rendered module.
window.showPengujian=renderPengujianChooser;
window.showPengujianPra=()=>showPengujianStage('PRA_TASHIH');
window.showPengujianTashih=()=>showPengujianStage('TASHIH');

})();
</script>
<script id="bk-final-consolidated-runtime-v3">
(function(){
'use strict';
const E=window.esc||((v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const toast=(m,t='success')=>window.v12Toast?window.v12Toast(m,t):window.bkAlert?window.bkAlert(m):window.bkAlert(m);
const routeHandlers={
 home:()=>window.showHome?.(),activities:()=>window.showActivities?.(),payments:()=>window.showPayments?.(),exams:()=>window.showExams?.(),pengujian:()=>window.showPengujian?.(),'pengujian-pra':()=>window.showPengujianPra?.(),'pengujian-tashih':()=>window.showPengujianTashih?.(),graduation:()=>window.showGraduation?.(),finance:()=>window.showFinance?.(),secretariat:()=>window.showSecretariat?.(),distribution:()=>window.showDistribution?.(),reports:()=>window.showReports?.(),notifications:()=>window.showNotifications?.(),management:()=>window.showManagement?.(),institutions:()=>window.showUsers?.(),album:()=>window.showMemoryAlbum?.(),organization:()=>window.showOrganization?.(),auditbackup:()=>window.showAuditBackup?.(),settings:()=>window.showSettings?.()
};
async function requireActiveSession(){
  try{
    const client=window.sb||sb;
    if(!client?.auth?.getSession) return false;
    const r=await client.auth.getSession();
    if(r.error) throw r.error;
    if(r.data?.session){state.user=r.data.session.user;return true;}
    try{await client.auth.refreshSession();const rr=await client.auth.getSession();if(rr.data?.session){state.user=rr.data.session.user;return true;}}catch(_){ }
  }catch(e){console.warn('[BK ACTION SESSION]',e)}
  return !!state.user;
}
window.navigate=async function(route){
 const r=String(route||'home').trim().toLowerCase();state.route=Object.prototype.hasOwnProperty.call(routeHandlers,r)?r:'home';
 try{const fn=routeHandlers[state.route];if(typeof fn!=='function')throw new Error('Modul belum terpasang: '+state.route);await Promise.resolve(fn());document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.route));}
 catch(e){console.error('[BK ROUTE]',state.route,e);toast('Modul gagal dimuat: '+(e?.message||state.route),'error')}
};

window.loadFinanceCategorySettings=async function(){
  const el=document.getElementById('financeCategoryList'); if(!el)return;
  el.innerHTML='<div class="small muted">Memuat jenis kas...</div>';
  try{
    const q=await sb.from('finance_categories').select('id,name,category_type,is_active').order('category_type').order('name');
    if(q.error)throw q.error;
    const rows=q.data||[];
    el.innerHTML=rows.length?rows.map(x=>`<div class="list-item"><div class="row"><div><strong>${E(x.name)}</strong><div class="small muted">${x.category_type==='INCOME'?'Kas Masuk':'Kas Keluar'} · ${x.is_active?'Aktif':'Nonaktif'}</div></div><div class="compact-actions"><button class="btn secondary" type="button" onclick="openFinanceCategoryForm('${E(x.id)}')">Edit</button><button class="btn danger" type="button" onclick="toggleFinanceCategoryV34('${E(x.id)}',${!x.is_active})">${x.is_active?'Nonaktifkan':'Aktifkan'}</button></div></div></div>`).join(''):'<div class="empty">Belum ada jenis kas. Template pengelolaan tetap tersedia.</div>';
  }catch(e){el.innerHTML=`<div class="error">${E(e?.message||e)}</div>`}

window.bkfSaveExamRulesSimple=async function(materials,preRule,tashRule){
 const btn=document.getElementById('bkfSaveExamRules');
 const msg=document.getElementById('bkfExamRulesMsg');
 if(btn)btn.disabled=true;
 if(msg)msg.textContent='Menyimpan...';
 try{
   const build=(prefix)=>materials.map(m=>({material_id:m.id,minimum_score:Number(document.getElementById(`${prefix}_${m.id}`)?.value)}));
   const pre=build('bkf_min_pre');
   const tash=build('bkf_min_tashih');
   if(pre.some(x=>!Number.isFinite(x.minimum_score)||x.minimum_score<0||x.minimum_score>100)||tash.some(x=>!Number.isFinite(x.minimum_score)||x.minimum_score<0||x.minimum_score>100)){
     throw new Error('Semua batas minimal materi wajib diisi dengan angka 0–100.');
   }
   const save=async(type,rule,details)=>{
     const overall=Number(rule?.overall_minimum??Math.min(...details.map(x=>x.minimum_score)));
     if(!Number.isFinite(overall)||overall<0||overall>100)throw new Error(`Nilai keseluruhan ${type} tidak valid.`);
     const q=await sb.rpc('save_exam_rule_config',{p_exam_type:type,p_overall_minimum:overall,p_details:details});
     if(q.error)throw q.error;
   };
   await save('PRA_TASHIH',preRule,pre);
   await save('TASHIH',tashRule,tash);
   if(msg)msg.textContent='Berhasil disimpan. Nilai lama telah digantikan.';
   await window.bkfLoadExamRulesSimple();
 }catch(e){
   if(msg)msg.innerHTML=`<span class="error">${esc(window.bkfExamRuleError(e))}</span>`;
 }finally{if(btn)btn.disabled=false;}
};

window.loadIdentity=async function(){
  const run=async()=>{
    let lastError=null;
    for(let attempt=0;attempt<3;attempt++){
      try{
        const {data,error}=await sb.rpc('get_my_access_bundle');
        if(error)throw error;
        const roles=Array.isArray(data?.roles)?data.roles.map(x=>String(x).trim().toUpperCase()).filter(Boolean):[];
        const permissions=Array.isArray(data?.permissions)?data.permissions.map(x=>String(x)):[ ];
        const knownRoles=['KETUA','SEKRETARIS','BENDAHARA','ANGGOTA','OPERATOR'];
        const validRoles=roles.filter(r=>knownRoles.includes(r));
        if(!validRoles.length)throw new Error('Identitas role pengguna kosong atau tidak dikenal.');
        state.profile=data?.profile||state.profile||null;
        state.roles=validRoles;
        state.permissions=new Set(permissions);
        return true;
      }catch(e){
        lastError=e;
        console.warn('[BK IDENTITY]',attempt+1,e);
        if(attempt===0){try{await sb.auth.refreshSession()}catch(_){} }
        if(attempt<2)await new Promise(r=>setTimeout(r,300*(attempt+1)));
      }
    }
    state.profile=state.profile||null;state.roles=[];state.permissions=new Set();
    window.__BK_IDENTITY_ERROR__=String(lastError?.message||lastError||'Identitas pengguna gagal dimuat.');
    return false;
  };
  return await Promise.race([run(),new Promise(resolve=>setTimeout(()=>resolve(false),12000))]);
};

window.bkfSplash?.show();const start=async()=>{try{await window.boot()}catch(e){console.error('[BK FINAL BOOT]',e);await window.bkfSplash?.hide()}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else setTimeout(start,0);
})();
